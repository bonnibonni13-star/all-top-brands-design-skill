<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<title>Musterscreens Kraken</title>
<style>
/* =====================================================================
   Musterscreens im Stil von Kraken – durchgehend weiß, kompakt, 12 px
   Radius, Lila als Arbeitsfarbe. Werte aus der Markendatei (Farben,
   Radien, Schatten, Typo-Skala, Badge-Radien). Die Markendatei ist
   kurz; App-Muster (Navigationsleiste, Kennzahlen-Karte, Karten-Zeile,
   Segment-Schalter) sind aus Charakter und Komponenten abgeleitete
   Empfehlungen. Pillen sind ausdrücklich verboten – 12 px ist Maximum.
   ===================================================================== */
:root {
  /* Farben (Markendatei) */
  --purple: #7132f5;
  --purple-dark: #5741d8;
  --purple-deep: #5b1ecf;
  --purple-tint: rgba(133, 91, 251, .16);
  --ink: #101114;
  --cool-gray: #686b82;
  --silver: #9497a9;
  --gray-tint: rgba(148, 151, 169, .08);
  --gray-badge: rgba(104, 107, 130, .12);
  --gray-badge-ink: #484b5e;
  --border: #dedee5;
  --canvas: #ffffff;
  --green: #149e61;
  --green-tint: rgba(20, 158, 97, .16);
  --green-dark: #026b3f;

  /* Schrift: Kraken-Product-Fallback ist Helvetica → TeX Gyre Heros;
     zwei Gewichte, 700 für alles Benannte */
  --font: "TeX Gyre Heros", Helvetica, "Liberation Sans", sans-serif;

  /* Radien (Markendatei) */
  --r-3: 3px; --r-6: 6px; --r-8: 8px; --r-10: 10px; --r-12: 12px; --r-16: 16px;

  /* Abstände */
  --s-4: 4px; --s-6: 6px; --s-8: 8px; --s-10: 10px; --s-12: 12px;
  --s-16: 16px; --s-20: 20px; --s-24: 24px;
  --gutter: 16px;

  /* Tiefe – Flüster-Niveau */
  --shadow: rgba(0, 0, 0, .03) 0 4px 24px;
  --shadow-micro: rgba(16, 24, 40, .04) 0 1px 4px;

  /* Bewegung (Empfehlung – Datei macht keine Angaben) */
  --dur-s: 150ms;
  --dur-m: 250ms;
  --ease: cubic-bezier(.2, 0, .2, 1);
}

/* ---------- Grundlagen ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 400 16px/1.38 var(--font); }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }
.sb, .hi { color: var(--ink); }

/* ---------- Kopf ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px var(--gutter) 0; height: 48px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background-color: var(--gray-tint); }
.tile-btn { width: 40px; height: 40px; border-radius: var(--r-12); background: var(--gray-tint);
  display: grid; place-items: center; font-size: 21px; color: var(--ink); flex: none;
  transition: background var(--dur-s) var(--ease); }
.tile-btn:active { background: var(--purple-tint); }
.tile-btn.lg { width: 48px; height: 48px; font-size: 22px; }

.title-row { padding: 8px var(--gutter) 0; }
.h1 { font: 700 28px/1.29 var(--font); letter-spacing: -.5px; }
.h1.page { letter-spacing: -.6px; }
.sub { font-size: 14px; color: var(--silver); margin-top: 2px; }

/* ---------- Karte ---------- */
.card { background: var(--canvas); border: 1px solid var(--border); border-radius: var(--r-12); box-shadow: var(--shadow); }
.sec { padding: 0 var(--gutter); margin-top: 16px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sec-head h2 { font: 700 17px/1.3 var(--font); }
.sec-head .link { font: 700 13px/1 var(--font); color: var(--purple); }

/* Kennzahlen-Karte */
.metric { padding: 14px; }
.metric .label { font: 700 10px/1.3 var(--font); letter-spacing: .09em; text-transform: uppercase; color: var(--silver); }
.metric .figure { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 8px; }
.metric .big { font: 700 32px/1.1 var(--font); letter-spacing: -.8px; }
.metric .big em { font: 400 15px/1.2 var(--font); font-style: normal; color: var(--silver); margin-left: 6px; }
.badge-ok { background: var(--green-tint); color: var(--green-dark); border-radius: var(--r-6);
  font: 700 13px/1 var(--font); padding: 6px 8px; }
.badge-neutral { background: var(--gray-badge); color: var(--gray-badge-ink); border-radius: var(--r-8);
  font: 700 12px/1 var(--font); padding: 5px 8px; }
.track { height: 6px; border-radius: var(--r-3); background: var(--gray-tint); margin-top: 14px; overflow: hidden; }
.track > i { display: block; height: 100%; width: 69%; background: var(--purple); border-radius: var(--r-3); }
.sources { display: flex; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 11px; }
.sources > div { flex: 1; min-width: 0; font: 700 12px/1.25 var(--font); }
.sources > div + div { border-left: 1px solid var(--border); padding-left: 12px; }
.sources .ic { display: block; font-size: 16px; color: var(--silver); display: block; margin-bottom: 5px; }
.sources span { font: 400 11px/1.2 var(--font); color: var(--silver); display: block; margin-top: 3px; }

/* Karten-Zeile */
.r { display: flex; align-items: center; gap: 12px; padding: 9px; }
.r + .r { margin-top: 7px; }
.r .pic { width: 56px; height: 56px; border-radius: var(--r-10); background-color: var(--gray-tint); flex: none; }
.r .pic.big { width: 72px; height: 72px; }
.r .grow { flex: 1; min-width: 0; }
.r .name { font: 700 16px/1.25 var(--font); }
.r .meta { font: 400 13px/1.3 var(--font); color: var(--silver); margin-top: 3px; }
.r .num { text-align: right; flex: none; }
.r .num b { display: block; font: 700 16px/1.2 var(--font); }
.r .num span { display: block; font: 400 12px/1.2 var(--font); color: var(--silver); margin-top: 3px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--r-12); font: 700 16px/1.38 var(--font); padding: 13px 16px;
  transition: background var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--purple); color: #fff; }
.btn.primary:active { background: var(--purple-dark); }
.btn.outline { background: var(--canvas); color: var(--purple-dark); border: 1px solid var(--purple-dark); padding: 9px 14px; font-size: 14px; }
.btn.subtle { background: var(--purple-tint); color: var(--purple); padding: 9px 14px; font-size: 14px; }
.btn.gray { background: var(--gray-tint); color: var(--ink); padding: 9px 14px; font-size: 14px; }

/* ---------- Suche, Chips, Sortierzeile ---------- */
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; margin: 0 var(--gutter);
  background: var(--canvas); border: 1px solid var(--border); border-radius: var(--r-12); box-shadow: var(--shadow);
  color: var(--silver); font-size: 16px; }
.chips { gap: 8px; padding: 12px var(--gutter) 0; }
.chip { flex: none; border-radius: var(--r-12); background: var(--gray-tint); color: var(--ink);
  font: 400 14px/1 var(--font); padding: 10px 14px; }
.chip.on { background: var(--purple-tint); color: var(--purple); font-weight: 700; }
.sortline { display: flex; align-items: center; justify-content: space-between; padding: 12px var(--gutter) 8px;
  font: 400 12px/1 var(--font); color: var(--silver); }
.sortline .count b { font-weight: 700; color: var(--ink); }
.sortline .pickr { display: inline-flex; align-items: center; gap: 6px; background: var(--gray-tint);
  border-radius: var(--r-8); padding: 6px 9px; font: 700 12px/1 var(--font); color: var(--ink); }

/* ---------- Navigationsleiste ---------- */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: var(--canvas);
  border-top: 1px solid var(--border); display: flex; padding: 8px 8px 22px; }
.nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--silver); font: 400 11px/1.2 var(--font); }
.nav .plate { width: 44px; height: 26px; border-radius: var(--r-12); display: grid; place-items: center; font-size: 22px; }
.nav a.on { color: var(--ink); font-weight: 700; }
.nav a.on .plate { background: var(--purple-tint); color: var(--purple); }

/* ---------- Detail ---------- */
.plate-img { position: relative; margin: 8px var(--gutter) 0; height: 198px; border-radius: var(--r-12);
  box-shadow: var(--shadow); overflow: hidden; }
.plate-img .tag { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.92);
  color: var(--ink); border-radius: var(--r-8); font: 700 12px/1 var(--font); padding: 6px 9px; }
.detail-head { padding: 14px var(--gutter) 0; }
.detail-head .line { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.detail-head .meta { font: 400 14px/1.3 var(--font); color: var(--silver); }
.cta { display: flex; gap: 8px; padding: 14px var(--gutter) 0; }
.cta .btn.primary { flex: 1; }

.segment { display: flex; gap: 3px; margin: 16px var(--gutter) 0; padding: 3px;
  background: var(--gray-tint); border-radius: var(--r-12); }
.segment span { flex: 1; text-align: center; padding: 9px 0; border-radius: var(--r-10);
  font: 400 14px/1.2 var(--font); color: var(--cool-gray); }
.segment span.on { background: var(--canvas); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-micro); }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px var(--gutter) 0; }
.grid .photo { height: 96px; border-radius: var(--r-8); background-color: var(--gray-tint); }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference) {
  .card, .r, .plate-img, .grid { animation: up var(--dur-m) var(--ease) both; }
  .r:nth-child(2) { animation-delay: 25ms; }
  .r:nth-child(3) { animation-delay: 50ms; }
  .r:nth-child(4) { animation-delay: 75ms; }
  @keyframes up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style></head>
