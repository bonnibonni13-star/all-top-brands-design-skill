<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* ==========================================================================
   Mintlify – Designsprache als App-Vorlage
   Werte aus references/mintlify.md (Farben, Typo, Radien, Abstände, Schatten).
   App-Muster, Icons und Bewegung sind Ableitungen/Empfehlungen.
   Grundsätze: ein Himmelsverlauf als Auftakt, danach flache weiße Dokufläche
   · Haarlinien statt Schatten · alle Buttons sind Pillen · Inter + Mono als Paar
   · Minzgrün nur als einzelner Akzent.
   ========================================================================== */
:root {
  /* Flächen */
  --canvas: #ffffff;
  --surface: #f7f7f7;
  --surface-soft: #fafafa;
  --surface-code: #1c1c1e;
  --hairline: #e5e5e5;
  --hairline-soft: #ededed;
  --hairline-dark: #2b2b2e;
  /* Text */
  --ink: #0a0a0a;
  --charcoal: #1c1c1e;
  --slate: #3a3a3c;
  --steel: #5a5a5c;
  --stone: #888888;
  --muted: #a8a8aa;
  --on-dark: #ffffff;
  --on-dark-muted: #b3b3b3;
  /* Akzente */
  --mint: #00d4a4;
  --mint-deep: #00b48a;
  --tag-blue: #3772cf;
  /* Himmelsband */
  --sky-from: #87a8c8;
  --sky-mid: #b9c8d2;
  --sky-to: #f5e9d8;
  /* Schrift */
  --font: "Inter", "DejaVu Sans", sans-serif;
  --font-display: "Inter Display", "Inter", sans-serif;
  --mono: "DejaVu Sans Mono", monospace;
  /* Radien */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 9999px;
  /* Abstände */
  --s-xxs: 4px;
  --s-xs: 8px;
  --s-sm: 12px;
  --s-md: 16px;
  --s-lg: 20px;
  --s-xl: 24px;
  --s-xxl: 32px;
  /* Schatten */
  --sh-card: 0 4px 12px rgba(0, 0, 0, .08);
  --sh-mockup: 0 24px 48px -8px rgba(0, 0, 0, .12);
  /* Bewegung (Empfehlung) */
  --dur-s: 150ms;
  --dur-m: 200ms;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

/* ---------- Grundlage ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 400 16px/1.5 var(--font); }
.phone .hi { color: var(--ink); }
:where(.phone) :where(h1, h2, h3, p, ul, li) { margin: 0; }
.ic-l { stroke-width: 1.5; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Typo-Rollen ---------- */
.micro-up { font: 600 11px/1.4 var(--font); letter-spacing: .5px; text-transform: uppercase; color: var(--steel); }
.h-hero { font: 600 32px/1.1 var(--font-display); letter-spacing: -1px; }
.h-page { font: 600 28px/1.25 var(--font-display); letter-spacing: -.4px; }
.h-5 { font: 600 15px/1.4 var(--font); }
.sub { font: 400 15px/1.5 var(--font); color: var(--steel); }
.body-sm { font: 400 14px/1.5 var(--font); color: var(--steel); }
.caption { font: 400 13px/1.4 var(--font); color: var(--stone); }

/* ---------- Himmelsband (einziger Verlauf, einmal pro Screen) ---------- */
.sky { position: relative; overflow: hidden; padding-bottom: 54px;
  background: linear-gradient(180deg, #5d82a8 0%, #7b9fc1 30%, #b7c3cb 62%, var(--sky-to) 88%, var(--canvas) 100%); }
.sky .sb { color: #ffffff; }
.cloud { position: absolute; border-radius: var(--r-full); background: #ffffff; filter: blur(11px); pointer-events: none; }
.cloud-a { width: 212px; height: 58px; left: -54px; top: 104px; opacity: .6; }
.cloud-b { width: 162px; height: 46px; right: -44px; top: 150px; opacity: .5; }
.cloud-c { width: 310px; height: 70px; left: 30px; top: 216px; opacity: .62; }
.cloud-d { width: 96px; height: 50px; left: 28px; top: 86px; opacity: .5; }

/* Kopfzeile im Band */
.sky-nav { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between;
  height: 44px; padding: 0 var(--s-md); color: #fff; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 15px/1 var(--font); letter-spacing: -.1px; }
.brand-mark { width: 22px; height: 22px; border-radius: var(--r-sm); background: rgba(255, 255, 255, .9);
  display: grid; place-items: center; }
.brand-mark span { width: 9px; height: 9px; border-radius: var(--r-full); background: var(--mint); }
.avatar { width: 28px; height: 28px; border-radius: var(--r-full); box-shadow: 0 0 0 1px rgba(255, 255, 255, .6); }

.hero-mid { position: relative; z-index: 3; text-align: center; padding: 18px 26px 0; }
.hero-mid .micro-up { color: #ffffff; }
.hero-mid .h-hero { color: #fff; margin-top: 8px; }
.hero-mid .sub { color: rgba(255, 255, 255, .96); margin-top: 8px; font-size: 14px; }
.hero-btns { display: flex; justify-content: center; gap: var(--s-xs); margin-top: 16px; }

/* ---------- Buttons: immer Pille ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex: none;
  height: 38px; padding: 0 20px; border-radius: var(--r-full);
  font: 500 14px/1.3 var(--font); white-space: nowrap;
  transition: opacity var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); }
.btn .ic { font-size: 16px; }
.btn--primary { background: var(--ink); color: var(--on-dark); }
.btn--mint { background: var(--mint); color: var(--ink); font-weight: 600; }
.btn--outline { background: var(--canvas); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hairline); }
.btn--ghost { background: none; color: var(--ink); border-radius: var(--r-md); height: 32px; padding: 0 12px; }

.icon-round { width: 36px; height: 36px; border-radius: var(--r-full); display: grid; place-items: center;
  background: var(--canvas); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hairline); font-size: 17px; flex: none; }
.icon-plain { width: 32px; height: 32px; border-radius: var(--r-md); display: grid; place-items: center;
  color: var(--steel); font-size: 19px; flex: none; }

/* ---------- Überlappende Produktkarte ---------- */
.mockup { position: relative; z-index: 4; margin: -44px var(--s-md) 0; padding: 8px;
  background: var(--canvas); border: 1px solid var(--hairline-soft); border-radius: var(--r-lg);
  box-shadow: var(--sh-mockup); }
.mockup-img { height: 112px; border-radius: var(--r-md); }
.mockup-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s-sm);
  padding: 10px 6px 4px; }
.badge-mono { display: inline-block; padding: 2px 7px; border-radius: var(--r-sm); background: var(--surface);
  border: 1px solid var(--hairline); color: var(--steel); font: 400 12px/1.5 var(--mono); }

/* ---------- Weiße Dokufläche ---------- */
.doc { padding: 0 var(--s-md); }
.sec { margin-top: 18px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-sm); margin-bottom: 10px; }
.card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-lg); overflow: hidden; }
.prop { display: flex; align-items: center; gap: var(--s-sm); padding: 11px 14px;
  border-bottom: 1px solid var(--hairline-soft); }
.prop:last-child { border-bottom: 0; }
.prop .grow { flex: 1; min-width: 0; }
.prop .h-5 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb { width: 36px; height: 36px; border-radius: var(--r-sm); flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06); }
.prop .ic { color: var(--stone); font-size: 18px; }
.check { color: var(--mint); font-size: 17px; }
.meter { height: 6px; border-radius: var(--r-full); background: var(--surface); overflow: hidden; margin-top: 10px;
  box-shadow: inset 0 0 0 1px var(--hairline-soft); }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: var(--r-full); }

/* ---------- Obere Leiste (Doku) ---------- */
.top-bar { position: relative; z-index: 5; display: flex; align-items: center; gap: 10px;
  height: 52px; padding: 0 var(--s-md); border-bottom: 1px solid var(--hairline-soft); background: var(--canvas); }
.search-pill { flex: 1; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-md);

.search-pill .ic { font-size: 16px; color: var(--stone); }

.tabs button.is-on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* ---------- Doku-Navigationsliste (Bibliothek) ---------- */
.group-head { padding: 16px 10px 6px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-sm);

.nav-item .thumb { width: 30px; height: 30px; }
.nav-item .grow { flex: 1; min-width: 0; }
.nav-item .h-5 { font-size: 14px; font-weight: 400; color: var(--slate); }

.nav-item.is-on::before { content: ""; position: absolute; left: 2px; top: 8px; bottom: 8px; width: 3px;
  border-radius: var(--r-full); background: var(--mint); }

.crumbs { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1;

.crumbs .here { color: var(--ink); font-weight: 500; }
.detail-img { height: 140px; border-radius: var(--r-lg); border: 1px solid var(--hairline-soft); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.detail-actions { display: flex; align-items: center; gap: var(--s-xs); margin-top: 14px; }
.detail-actions .btn--primary { flex: 1; height: 40px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.photo { aspect-ratio: 1; border-radius: var(--r-md); }

.code-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-sm);

.code-body { padding: 10px 12px 12px; font: 400 12.5px/1.75 var(--mono); }
.code-line { display: flex; gap: 10px; color: var(--on-dark-muted); white-space: nowrap; }
.code-line .num { color: #55555a; width: 14px; text-align: right; flex: none; }
.code-line .tr { color: #9ad8ff; }
.code-line .tm { color: var(--mint); margin-left: auto; }

/* ---------- Navigation unten: Pille um das aktive Icon ---------- */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; z-index: 20;
  display: flex; align-items: flex-start; padding: 7px 8px 0;
  background: var(--canvas); border-top: 1px solid var(--hairline); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--steel); font: 400 11.5px/1.4 var(--font); }

.tab-avatar { width: 20px; height: 20px; border-radius: var(--r-full); box-shadow: 0 0 0 1px var(--hairline); }

/* ---------- Auslaufen nach unten ---------- */
.fade { position: absolute; left: 0; right: 0; bottom: 74px; height: 48px; z-index: 10; pointer-events: none;

}
