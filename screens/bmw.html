<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }

<style>
:root{
  /* Farben aus der Markendatei */
  --blau:#1c69d4; --blau-aktiv:#0653b6;
  --ink:#262626; --body:#3c3c3c; --body-stark:#1a1a1a; --muted:#6b6b6b; --muted-soft:#9a9a9a;
  --linie:#e6e6e6; --linie-stark:#cccccc;
  --canvas:#ffffff; --soft:#f7f7f7; --plate:#fafafa; --strong:#ebebeb;
  --dunkel:#1a2129; --dunkel-hoch:#262e38; --auf-dunkel:#ffffff; --auf-dunkel-soft:#bbbbbb;
  /* Form */
  --r0:0px; --rfull:9999px;
  /* Abstände */
  --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:24px; --s-xl:32px;
  --rand:24px;
  /* Bewegung */
  --dur-s:120ms; --dur-m:240ms; --ease:cubic-bezier(.2,0,.2,1);
  /* Schrift */
  --font:Inter,"DejaVu Sans",sans-serif;
  --font-display:"Inter Display",Inter,"DejaVu Sans",sans-serif;
}

.phone{ background:var(--canvas); font-family:var(--font); color:var(--ink);
  -webkit-font-smoothing:antialiased; }
.phone .sb{ color:var(--ink); }

/* ---------- Typo-Bausteine ---------- */
.augenbraue{ font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); line-height:1.3; }
.h-display{ font-family:var(--font-display); font-size:26px; font-weight:700; line-height:1.1; letter-spacing:0; color:var(--ink); }
.h-xl{ font-family:var(--font-display); font-size:32px; font-weight:700; line-height:1.1; color:var(--ink); }
.h-sec{ font-size:18px; font-weight:700; line-height:1.3; color:var(--ink); }
.light{ font-weight:300; line-height:1.55; color:var(--body); }
.light-sm{ font-size:13px; font-weight:300; line-height:1.5; color:var(--muted); }
.tlink{ font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink);
  display:inline-flex; align-items:center; gap:5px; }
.tlink .ic{ font-size:11px; }

/* ---------- Icons: ein Stil (Lucide, 1.5px, eckig) ---------- */
.ic{ stroke-width:1.5; stroke-linecap:square; stroke-linejoin:miter; }

/* ---------- Kopfzeile ---------- */
.appbar{ height:52px; display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--rand); border-bottom:1px solid var(--linie); background:var(--canvas); }
.mark{ display:block; }
.appbar-rechts{ display:flex; align-items:center; gap:14px; }
.appbar-rechts .ic{ font-size:21px; color:var(--ink); }
.avatar{ width:28px; height:28px; border-radius:var(--rfull); box-shadow:0 0 0 1px var(--linie-stark); }

/* ---------- Begrüßung ---------- */
.gruss{ padding:15px var(--rand) 13px; }
.gruss .h-display{ margin-top:0; }
.zahlen{ margin-top:7px; font-size:13px; font-weight:300; color:var(--body); }
.zahlen b{ font-weight:700; color:var(--ink); }

/* ---------- Dunkle Bahn (Rückblick) ---------- */
.bahn-dunkel{ background:var(--dunkel); color:var(--auf-dunkel); }
.bahn-foto{ height:106px; }
.bahn-text{ padding:14px var(--rand) 16px; }
.bahn-dunkel .augenbraue{ color:var(--auf-dunkel-soft); }
.bahn-titel{ font-family:var(--font-display); font-size:22px; font-weight:700; line-height:1.15; margin-top:6px; }
.bahn-meta{ font-size:13px; font-weight:300; line-height:1.45; color:var(--auf-dunkel-soft); margin-top:5px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 22px;
  border-radius:var(--r0); font-size:14px; font-weight:700; letter-spacing:.5px;
  transition:background var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); }
.btn-primaer{ background:var(--blau); color:#fff; }
.btn-primaer:active{ background:var(--blau-aktiv); transform:scale(.985); }
.btn-sek-dunkel{ background:transparent; color:var(--auf-dunkel); box-shadow:inset 0 0 0 1px var(--auf-dunkel); }
.btn-reihe{ display:flex; gap:10px; margin-top:14px; }

/* ---------- Abschnittskopf ---------- */
.sec-kopf{ display:flex; align-items:baseline; justify-content:space-between;
  padding:14px var(--rand) 9px; }

/* ---------- Modellkarten ---------- */
.karten{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-md) var(--s-md); padding:0 var(--rand); }
.karte{ background:var(--canvas); border-radius:var(--r0); }
.karte-foto{ background-color:var(--plate); height:80px; border-radius:var(--r0); }
.karte-typ{ font-size:9px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-top:9px; }
.karte-titel{ font-size:15px; font-weight:700; line-height:1.3; margin-top:4px; }
.karte-meta{ font-size:12px; font-weight:300; line-height:1.45; color:var(--muted); margin-top:3px; }
.karte .tlink{ margin-top:8px; }

/* ---------- Spec-Zellen ---------- */
.spec{ display:flex; border-top:1px solid var(--linie); border-bottom:1px solid var(--linie); }
.spec-zelle{ flex:1; padding:12px 0 13px 14px; }
.spec-zelle + .spec-zelle{ border-left:1px solid var(--linie); }
.spec-wert{ font-family:var(--font-display); font-size:19px; font-weight:700; line-height:1.1; color:var(--ink); }
.spec-label{ font-size:9px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-top:5px; }

/* ---------- Quellen ---------- */
.quellen{ display:flex; border-top:1px solid var(--linie); }
.quelle{ flex:1; padding:11px 8px 12px 11px; display:flex; align-items:center; gap:8px; }
.quelle + .quelle{ border-left:1px solid var(--linie); }
.quelle .ic{ font-size:17px; color:var(--ink); flex:none; }
.quelle-name{ font-size:11px; font-weight:700; line-height:1.25; }
.quelle-status{ font-size:10px; font-weight:300; color:var(--muted); line-height:1.3; margin-top:1px; }
.speicher{ padding:0 var(--rand) 8px; display:flex; align-items:center; gap:12px; }
.quellen-kopf{ display:flex; align-items:baseline; justify-content:space-between; padding:13px var(--rand) 8px; }
.quellen-kopf b{ font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink); }
.quellen-kopf span{ font-size:11px; font-weight:300; color:var(--muted); }
.bar{ flex:1; height:4px; background:var(--strong); }
.bar i{ display:block; height:4px; width:69%; background:var(--blau); }


/* ---------- Untere Navigation ---------- */

.nav-ziel .ic{ font-size:21px; }

.nav-ziel.aktiv{ color:var(--ink); }
.nav-ziel.aktiv::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--blau); }
.nav-ziel .avatar{ width:21px; height:21px; }
.nav-ziel.aktiv .avatar{ box-shadow:0 0 0 1px var(--ink); }

/* ---------- Bibliothek ---------- */
.titelzeile{ display:flex; align-items:center; justify-content:space-between; padding:18px var(--rand) 14px; }
.suchfeld{ margin:0 var(--rand); height:46px; display:flex; align-items:center; gap:10px;
  border:1px solid var(--linie); border-radius:var(--r0); padding:0 14px; background:var(--canvas);

.suchfeld .ic{ font-size:18px; color:var(--muted); }
.suchfeld span{ font-size:15px; font-weight:300; color:var(--muted-soft); }
.chips{ display:flex; gap:7px; padding:14px var(--rand) 0; }
.chip{ border:1px solid var(--linie-stark); border-radius:var(--r0); padding:7px 11px;

.chip.aktiv{ background:var(--ink); border-color:var(--ink); color:#fff; font-weight:700; }
.sortzeile{ display:flex; align-items:center; justify-content:space-between;

.raster{ display:grid; grid-template-columns:1fr 1fr; gap:16px 16px; padding:4px var(--rand) 0; }
.raster .karte-foto{ height:96px; }

/* ---------- Detail ---------- */
.held{ position:relative; height:296px; }

.detail-kopf{ padding:20px var(--rand) 16px; }

.aktionen{ display:flex; align-items:center; gap:10px; padding:16px var(--rand) 0; }

.icon-knopf-rand{ width:46px; height:46px; border-radius:var(--rfull);

  color:var(--ink); flex:none; }
.icon-knopf-rand .ic{ font-size:19px; }
.musikzeile{ margin:18px var(--rand) 0; display:flex; align-items:center; gap:12px;
  border-top:1px solid var(--linie); border-bottom:1px solid var(--linie); padding:11px 0; }
.musik-thumb{ width:40px; height:40px; border-radius:var(--r0); flex:none; }

.reiter{ display:flex; gap:24px; padding:0 var(--rand); margin-top:16px; border-bottom:1px solid var(--linie); }

}
