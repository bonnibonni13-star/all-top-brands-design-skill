<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--grain, .18); mix-blend-mode: overlay;

<style>
:root{
  /* Farben */
  --primary:#150f23; --ink-deep:#1f1633; --on-primary:#ffffff;
  --lime:#c2ef4e; --pink:#fa7faa; --violet:#6a5fc1; --violet-deep:#422082; --violet-mid:#79628c;
  --canvas-dark:#1f1633; --canvas-light:#ffffff; --night:#150f23;
  --press-light:#f0f0f0; --hair-violet:#362d59; --hair-cool:#cfcfdb; --hair-cloud:#e5e7eb;
  --on-dark-muted:rgba(255,255,255,.72); --on-dark-faint:rgba(255,255,255,.18);
  /* Radien */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-xxl:18px;
  /* Abstände */
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-xxl:32px;
  /* Schrift */
  --display:"TeX Gyre Heros Cn","Inter",sans-serif;
  --ui:"Poppins","Inter",sans-serif;
  --mono:"DejaVu Sans Mono",monospace;
  /* Bewegung */
  --dur-s:160ms; --dur-m:260ms; --ease:cubic-bezier(.2,.8,.2,1);
}

/* ---------- Grundflächen ---------- */
.phone{ font-family:var(--ui); color:var(--on-primary); }
.screen-dark{ background:var(--canvas-dark); }
.screen-light{ background:var(--canvas-light); color:var(--ink-deep); }
/* Sternenfeld-Textur der dunklen Fläche */
.stars{ position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.3;
  background-image:
    radial-gradient(rgba(255,255,255,.55) .9px, transparent 1.1px),
    radial-gradient(rgba(255,255,255,.3) .8px, transparent 1px);
  background-size:94px 108px, 147px 131px; background-position:0 0, 38px 46px; }
.layer{ position:relative; z-index:1; }

/* ---------- Typo-Bausteine ---------- */
.eyebrow{ font:600 10px/1.8 var(--ui); letter-spacing:.25px; text-transform:uppercase; color:var(--on-dark-muted); }
.screen-light .eyebrow{ color:var(--violet-mid); }
.display{ font-family:var(--display); font-weight:700; letter-spacing:0; }
.h-xl{ font:500 30px/1.2 var(--ui); }
.body{ font:500 16px/1.5 var(--ui); }
.cap{ font:400 14px/1.43 var(--ui); }
.mono{ font:400 13px/1.5 var(--mono); letter-spacing:.2px; }
.caps{ font:700 14px/1.14 var(--ui); letter-spacing:.2px; text-transform:uppercase; }
.caps-l{ font:500 12px/1.3 var(--ui); letter-spacing:.2px; text-transform:uppercase; }
.chip-lime{ background:var(--lime); color:var(--ink-deep); border-radius:var(--r-xs); padding:0 12px; }

/* ---------- Kopfzeile ---------- */
.top{ display:flex; align-items:center; justify-content:space-between; padding:2px var(--s-xl) 0; height:52px; }
.mark{ width:30px; height:30px; border-radius:var(--r-md); background:var(--violet-deep);
  display:grid; place-items:center; border:1px solid var(--hair-violet); }
.top-right{ display:flex; align-items:center; gap:10px; }
.ghost{ width:36px; height:36px; border-radius:var(--r-xl); background:var(--on-dark-faint);
  display:grid; place-items:center; font-size:18px; color:#fff; transition:transform var(--dur-s) var(--ease), background var(--dur-s) var(--ease); }
.ghost:active{ transform:scale(.97); background:rgba(255,255,255,.3); }
.avatar{ width:34px; height:34px; border-radius:999px; background-size:cover; background-position:50% 28%;
  border:2px solid var(--hair-violet); }

/* ---------- Start ---------- */
.hero{ padding:6px var(--s-xl) 0; }
.hero h1{ font-family:var(--display); font-weight:700; font-size:40px; line-height:1.0; letter-spacing:0; }
.hero h1 .l2{ display:inline-block; margin-top:2px; }
.stat-line{ margin-top:12px; color:var(--on-dark-muted); }
.stat-line b{ color:#fff; font-weight:400; }

.feature{ position:relative; margin:12px var(--s-xl) 0; background:var(--night); border:1px solid var(--hair-violet);
  border-radius:var(--r-xxl); padding:14px; }
.feature .frame{ height:112px; border-radius:var(--r-xl); overflow:hidden; transform:rotate(-1.6deg);
  border:1px solid var(--hair-violet); --grain:.14; }
.feature .frame > div{ width:100%; height:100%; background-size:cover; background-position:50% 42%; }
.feature-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:14px; }
.pill{ display:inline-block; background:var(--primary); border:1px solid var(--hair-violet); color:#fff;
  border-radius:var(--r-xs); padding:3px 8px; font:400 11px/1.4 var(--ui); }
.feature h2{ font-family:var(--display); font-weight:700; font-size:24px; line-height:1.1; margin-top:8px; }
.feature .cap{ color:var(--on-dark-muted); margin-top:2px; }
.btn-inv{ display:inline-flex; align-items:center; gap:8px; background:#fff; color:var(--ink-deep);
  border-radius:var(--r-md); padding:12px 16px; white-space:nowrap;
  box-shadow:0 0 8px 6px rgba(21,15,35,.9); transition:background var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); }
.btn-inv:active{ background:var(--press-light); transform:scale(.97); }

/* Sticker – eigene Illustration, ragt über die Kartenkante */
.sticker{ position:absolute; right:-4px; top:-26px; width:84px; height:84px; transform:rotate(9deg); z-index:3; }

.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:18px var(--s-xl) 10px; }
.link-dark{ color:#fff; text-decoration:underline; text-underline-offset:3px; font:500 12px/1.3 var(--ui);
  letter-spacing:.2px; text-transform:uppercase; }
.row-x{ gap:12px; padding-left:var(--s-xl); }
.tile{ width:154px; flex:none; }
.tile .img{ position:relative; height:88px; border-radius:var(--r-xl); background-size:cover; background-position:50% 45%;
  border:1px solid var(--hair-violet); overflow:hidden; }
.tile .img i{ position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(21,15,35,.55); }
.tile .img i::after{ content:""; display:block; height:100%; width:var(--p); background:#fff; }
.tile .t{ font:500 14px/1.3 var(--ui); margin-top:9px; }
.tile .m{ font:400 11px/1.4 var(--ui); color:var(--on-dark-muted); margin-top:3px; }
.bar{ height:3px; border-radius:2px; background:rgba(255,255,255,.16); margin-top:8px; overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--violet-mid); }

/* Quellen als kompakter Streifen im Kopfbereich */
.src-head{ display:flex; align-items:baseline; justify-content:space-between; margin-top:14px; }
.src-head .gb{ font-size:11px; color:var(--on-dark-muted); }
.src-strip{ display:flex; gap:8px; margin-top:9px; }
.schip{ display:flex; align-items:center; gap:7px; background:var(--night); border:1px solid var(--hair-violet);
  border-radius:var(--r-xl); padding:7px 10px; font:500 11px/1.2 var(--ui); white-space:nowrap; }
.schip .ic{ font-size:15px; }
.schip .dot{ width:7px; height:7px; border-radius:999px; border:1.5px solid var(--violet-mid); }
.schip .dot.on{ background:#fff; border-color:#fff; }
.schip .dot.half{ background:linear-gradient(90deg,var(--violet-mid) 50%, transparent 50%); }
.bar.storage{ margin-top:9px; }

/* ---------- Navigationsleiste ---------- */
.nav{ position:absolute; left:16px; right:16px; bottom:22px; height:60px; z-index:20;
  background:var(--primary); border:1px solid var(--hair-violet); border-radius:var(--r-xl);
  display:flex; align-items:center; padding:5px; gap:4px; }
.nav a{ flex:1; height:50px; border-radius:var(--r-md); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; color:rgba(255,255,255,.62);
  transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease); }
.nav a .ic{ font-size:20px; }
.nav a span{ font:600 9px/1 var(--ui); letter-spacing:.25px; text-transform:uppercase; }
.nav a.on{ background:#fff; color:var(--ink-deep); }

/* ---------- Bibliothek (helle Welt) ---------- */
.lib-head{ display:flex; align-items:center; justify-content:space-between; padding:4px var(--s-xl) 0; }
.lib-head h1{ font:500 30px/1.2 var(--ui); color:var(--ink-deep); }
.ghost-light{ width:36px; height:36px; border-radius:var(--r-xl); border:1px solid var(--hair-cool);

.search{ margin:16px var(--s-xl) 0; display:flex; align-items:center; gap:10px; height:44px;

.search .ic{ font-size:18px; }
.search span{ font:500 15px/1.5 var(--ui); }
.search:focus-within{ box-shadow:rgba(0,0,0,.15) 0 2px 10px inset, 0 0 0 3px #9dc1f5; }
.filters{ gap:6px; padding:14px var(--s-xl) 2px; }
.fchip{ flex:none; border-radius:var(--r-xl); padding:8px 11px; border:1px solid var(--hair-cool);
  color:var(--ink-deep); font:500 11px/1.1 var(--ui); letter-spacing:.2px; text-transform:uppercase;
  transition:background var(--dur-s) var(--ease); }
.fchip.on{ background:var(--primary); border-color:var(--primary); color:#fff; font-weight:700; }
.count{ display:flex; align-items:center; justify-content:space-between; padding:16px var(--s-xl) 10px;
  border-bottom:1px solid var(--hair-cloud); }
.count .l{ font:600 10px/1.8 var(--ui); letter-spacing:.25px; text-transform:uppercase; color:var(--violet-mid); }
.count .r{ display:flex; align-items:center; gap:6px; font:600 10px/1.8 var(--ui); letter-spacing:.25px;
  text-transform:uppercase; color:var(--ink-deep); }
.rows{ padding:0 var(--s-xl); }
.rw{ display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--hair-cloud); }
.rw .th{ width:46px; height:46px; border-radius:var(--r-xs); background-size:cover; background-position:50% 45%; flex:none; }
.rw .mid{ flex:1; min-width:0; }
.rw .t{ font:500 15px/1.35 var(--ui); color:var(--ink-deep); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rw .m{ font:400 12px/1.4 var(--ui); color:var(--violet-mid); margin-top:2px; }
.rw .val{ text-align:right; flex:none; }
.rw .val .v{ font:400 12px/1.4 var(--mono); color:var(--ink-deep); }
.rw .val .d{ font:600 9px/1.6 var(--ui); letter-spacing:.25px; text-transform:uppercase; color:var(--violet-mid); margin-top:2px; }

/* ---------- Detail ---------- */
.crumb{ display:flex; align-items:center; gap:10px; padding:2px var(--s-xl) 0; height:52px; }
.crumb .path{ flex:1; font:600 10px/1.8 var(--ui); letter-spacing:.25px; text-transform:uppercase; color:var(--on-dark-muted); }
.shotframe{ margin:12px var(--s-xl) 0; border-radius:var(--r-xxl); overflow:hidden;
  border:1px solid var(--hair-violet); transform:rotate(-1.8deg); --grain:.12; }
.shotframe > div{ height:196px; background-size:cover; background-position:50% 46%; }
.d-title{ font-family:var(--display); font-weight:700; font-size:42px; line-height:1.05; margin:22px var(--s-xl) 0; }
.pills{ display:flex; gap:6px; margin:12px var(--s-xl) 0; }
.actions{ display:flex; gap:8px; margin:16px var(--s-xl) 0; align-items:stretch; }
.actions .btn-inv{ flex:1; justify-content:center; }
.actions .ghost{ width:48px; height:48px; }
.seg{ display:flex; gap:8px; margin:18px var(--s-xl) 0; align-items:center; }
.seg a{ background:rgba(255,255,255,.05); border-radius:var(--r-xl); padding:7px 14px; font:500 12px/1.1 var(--ui); letter-spacing:.2px;
  text-transform:uppercase; border:1px solid var(--hair-violet); color:var(--on-dark-muted); }
.seg a.on{ background:var(--violet-mid); border-color:var(--violet-mid); color:#fff; font-weight:700; }
.seg .grid-ic{ margin-left:auto; font-size:18px; color:var(--on-dark-muted); }
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:14px var(--s-xl) 0; }
.grid .ph{ aspect-ratio:1; border-radius:var(--r-md); background-size:cover; }

.musicbar{ position:absolute; left:0; right:0; bottom:0; z-index:20; background:var(--canvas-dark); padding:12px var(--s-xl) 26px; }
.squiggle{ display:block; width:100%; height:12px; }
.mb-row{ display:flex; align-items:center; gap:12px; padding-top:8px; }
.mb-row .cover{ width:40px; height:40px; border-radius:var(--r-md); background-size:cover; background-position:50% 50%; }
.mb-row .mid{ flex:1; }
.mb-row .l{ font:600 9px/1.6 var(--ui); letter-spacing:.25px; text-transform:uppercase; color:var(--on-dark-muted); }
.mb-row .t{ font:500 14px/1.3 var(--ui); margin-top:1px; }
.play{ width:44px; height:44px; border-radius:999px; background:#fff; color:var(--ink-deep);
  display:grid; place-items:center; font-size:20px; }

@media (prefers-reduced-motion: no-preference){
  .feature, .sources, .tile, .rw, .grid .ph{ animation:rise var(--dur-m) var(--ease) both; }
  .rw:nth-child(2){ animation-delay:40ms } .rw:nth-child(3){ animation-delay:80ms }
  .rw:nth-child(4){ animation-delay:120ms } .rw:nth-child(5){ animation-delay:160ms }
  .sticker{ animation:tilt var(--dur-m) var(--ease) both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(12px) } to{ opacity:1; transform:none } }
  @keyframes tilt{ from{ opacity:0; transform:rotate(1deg) scale(.9) } to{ opacity:1; transform:rotate(9deg) scale(1) } }
}
