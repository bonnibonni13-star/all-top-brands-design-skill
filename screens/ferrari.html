<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* =====================================================================
   Tokens aus references/ferrari.md – Markenname neutralisiert
   ===================================================================== */
:root {
  /* Flächen: Tiefe nur über Helligkeitsstufe und Foto, keine Schatten */
  --canvas: #181818;            /* Canvas – nie reines Schwarz */
  --canvas-elevated: #303030;   /* Ebene 1: Panels, Aktionsleiste */
  --canvas-light: #ffffff;      /* helle Redaktionsbahn */
  --surface-soft-light: #f7f7f7;
  --surface-strong-light: #ebebeb;
  /* Text */
  --ink: #ffffff;
  --body: #969696;
  --muted: #666666;
  --on-light: #181818;
  /* Akzent: sparsam – Hauptaktion und Aktiv-Marke */
  --primary: #da291c;           /* Rosso Corsa */
  --primary-active: #b01e0a;
  --on-primary: #ffffff;
  /* Haarlinien */
  --hairline: #303030;
  --hairline-on-light: #d2d2d2;
  --hairline-soft: #ebebeb;
  /* Radien: scharf per Voreinstellung */
  --r-none: 0px;
  --r-sm: 4px;                  /* nur Eingabefelder */
  --r-full: 9999px;             /* nur Pillen-Badge und Avatar */
  /* Abstandsleiter 8px */
  --s-xxxs: 4px; --s-xxs: 8px; --s-xs: 16px; --s-sm: 24px; --s-md: 32px; --s-lg: 48px;
  /* Schrift: eine Sans (FerrariSans-Ersatz) */
  --font: "Inter", "Liberation Sans", sans-serif;
  --font-display: "Inter Display", "Inter", sans-serif;
  --track-btn: 1.4px;           /* Versal-CTA */
  --track-nav: .65px;           /* Versal-Navigation */
  --track-label: 1.1px;         /* Versal-Mikrolabel */
  /* Bewegung (Empfehlung): langsam, filmisch */
  --dur-s: 160ms;
  --dur-m: 420ms;
  --ease: cubic-bezier(.33, 0, .1, 1);
}

/* =====================================================================
   Grundgerüst
   ===================================================================== */
.phone { background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
.phone .sb { color: var(--ink); }
.phone .hi { color: var(--ink); }
.phone--light { background: var(--canvas-light); color: var(--on-light); }
.phone--light .sb, .phone--light .hi { color: var(--on-light); }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }

/* Typografie-Rollen */
.display  { font-family: var(--font-display); font-weight: 500; font-size: 44px; line-height: 1.05; letter-spacing: -1.1px; }
.display-s{ font-family: var(--font-display); font-weight: 500; font-size: 32px; line-height: 1.1;  letter-spacing: -.6px; }
.title-sm { font-size: 16px; font-weight: 500; line-height: 1.35; letter-spacing: .08px; }
.body-sm  { font-size: 13px; font-weight: 400; line-height: 1.5; }
.caption  { font-size: 12px; font-weight: 400; line-height: 1.4; }
.label-up { font-size: 11px; font-weight: 600; line-height: 1.4; letter-spacing: var(--track-label); text-transform: uppercase; }

/* Icons: feine Linie mit runden Enden – fließendes Gegengewicht zu den harten Kanten */
.ic { stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
.sb .ic { stroke-width: 0; }

/* =====================================================================
   Kinobild (hero-band-cinema): randlos, Überschrift am unteren Bildrand
   ===================================================================== */
.hero { position: absolute; top: 0; left: 0; right: 0; z-index: 1; --grain: .1; }
.hero--start { height: 328px; }
.hero--detail { height: 340px; }
.hero-shade { position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(24,24,24,.70) 0%, rgba(24,24,24,.42) 15%, rgba(24,24,24,.06) 34%,
    rgba(24,24,24,0) 48%, rgba(24,24,24,.92) 90%, var(--canvas) 100%); }
.hero-text { position: absolute; left: var(--s-sm); right: var(--s-sm); bottom: 18px; }
.hero-text .label-up { color: var(--ink); opacity: .88; }
.hero-text .display { margin-top: 6px; }
.hero-text .body-sm { color: var(--body); margin-top: var(--s-xxs); }

/* Kopfzeile über dem Bild: Marke links, Werkzeuge rechts (nav-link-Stimme) */
.topbar { position: relative; z-index: 20; height: 52px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 var(--s-sm); }
.mark { width: 20px; height: 20px; border: 1px solid var(--ink); position: relative; }
.mark::after { content: ""; position: absolute; left: 5px; top: 5px; width: 8px; height: 8px; background: var(--ink); }
.topbar-right { display: flex; align-items: center; gap: var(--s-xs); }
.topbar-right .ic { font-size: 21px; }
.avatar { width: 32px; height: 32px; border-radius: var(--r-full); background-size: cover; background-position: center 18%; }

/* Inhaltsbahn unter dem Bild */
.scroll { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 var(--s-sm); }
.scroll--start { top: 328px; }
.scroll--detail { top: 340px; }

/* =====================================================================
   Buttons – scharf (0px), Versal mit 1,4px Laufweite
   ===================================================================== */
.btn { height: 48px; border-radius: var(--r-none); display: inline-flex; align-items: center;
  justify-content: center; gap: var(--s-xxs); font-size: 14px; font-weight: 700; line-height: 1;
  letter-spacing: var(--track-btn); text-transform: uppercase; transition: background var(--dur-s) var(--ease); }
.btn-primary { background: var(--primary); color: var(--on-primary); padding: 0 var(--s-md); flex: 1;
  white-space: nowrap; }
.btn-primary:active { background: var(--primary-active); }
.btn-outline { border: 1px solid var(--ink); color: var(--ink); width: 48px; flex: none; }
.btn-outline .ic { font-size: 20px; }
.actions { display: flex; gap: var(--s-xs); }

/* =====================================================================
   spec-cell: große Zahl über Versal-Label, von Haarlinien gefasst
   ===================================================================== */
.specs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline); }
.spec { padding: 15px 0 14px; }
.spec + .spec { border-left: 1px solid var(--hairline); padding-left: var(--s-xs); }
.spec-value { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1;
  letter-spacing: -.9px; font-variant-numeric: tabular-nums; }
.spec-label { color: var(--body); margin-top: 7px; }

/* Speicherzeile: feiner Balken statt Diagramm */
.storage { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 0 10px; }
.storage-val { color: var(--body); font-size: 13px; }
.storage-val b { color: var(--ink); font-weight: 500; }
.bar { height: 2px; background: var(--hairline); position: relative; }
.bar i { position: absolute; inset: 0 31% 0 0; background: var(--ink); display: block; }

/* =====================================================================
   Abschnittskopf und horizontale Bildreihe
   ===================================================================== */
.sec-head { display: flex; align-items: center; justify-content: space-between; }
.sec-head .label-up { color: var(--body); }
.sec-head a { color: var(--ink); }
.shelf { gap: var(--s-xs); margin: 10px calc(-1 * var(--s-sm)) 0 0; }
.shelf-item { width: 150px; flex: none; }
.shelf-photo { height: 96px; border-radius: var(--r-none); }
.shelf-item .title-sm { margin-top: 10px; }
.shelf-item .caption { color: var(--body); margin-top: 2px; }

/* =====================================================================
   Untere Navigationsleiste – eckig, Haarlinie, Aktiv = Rosso-Strich
   ===================================================================== */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; display: grid;

  border-top: 1px solid var(--hairline); z-index: 40; }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 6px; padding-top: 12px; color: var(--body); position: relative; }
.nav-item .ic { font-size: 22px; }
.nav-item.is-on { color: var(--ink); }
.nav-item.is-on::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 26px; height: 2px; background: var(--primary); }
.nav--light { background: var(--canvas-light); border-top-color: var(--hairline-on-light); }
.nav--light .nav-item { color: var(--muted); }
.nav--light .nav-item.is-on { color: var(--on-light); }

/* =====================================================================
   Helle Redaktionsbahn (Bibliothek) – Listenraster mit Haarlinien-Fugen
   ===================================================================== */
.head-light { padding: 10px var(--s-sm) var(--s-xs); display: flex; align-items: flex-start;
  justify-content: space-between; }
.head-light .body-sm { color: var(--muted); margin-top: 2px; }
.search { margin: 0 var(--s-sm); height: 48px; border: 1px solid var(--hairline-on-light);
  border-radius: var(--r-sm); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--muted); }
.search .ic { font-size: 19px; }
.tabs { display: flex; gap: 20px; padding: 18px var(--s-sm) 0; border-bottom: 1px solid var(--hairline-on-light); }
.tab { color: var(--muted); padding-bottom: 12px; position: relative; }
.tab.is-on { color: var(--on-light); }
.tab.is-on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary); }
.grid-list { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hairline-on-light);
  margin: var(--s-sm) var(--s-sm) 0; border: 1px solid var(--hairline-on-light); }
.tile { background: var(--canvas-light); }
.tile-photo { height: 126px; position: relative; }
.tile-body { padding: 13px 14px 15px; }
.tile-body .title-sm { color: var(--on-light); }
.tile-body .caption { color: var(--muted); margin-top: 3px; }
.badge { position: absolute; left: 10px; top: 10px; background: rgba(24,24,24,.86); color: var(--ink);
  border-radius: var(--r-full); padding: 4px 10px; }

/* =====================================================================
   Detail – Umschalter, Fotoraster, feste Musikleiste
   ===================================================================== */
.meta-row { display: flex; align-items: center; gap: 10px; color: var(--body); padding-top: 18px; }
.meta-row .dot { width: 3px; height: 3px; background: var(--muted); }
.toggle { display: flex; gap: 22px; border-bottom: 1px solid var(--hairline); margin-top: var(--s-sm); }
.toggle .tab { color: var(--body); }
.toggle .tab.is-on { color: var(--ink); }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: var(--s-xs); }
.photo-grid > div { aspect-ratio: 1; }
.backbtn { width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.7); background: rgba(24,24,24,.42);
  display: flex; align-items: center; justify-content: center; }
.backbtn .ic { font-size: 20px; }
.musicbar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: var(--canvas-elevated);
  border-top: 1px solid var(--hairline); display: flex; align-items: center; gap: 14px;

.musicbar .cover { width: 44px; height: 44px; flex: none; }
.musicbar .label-up { color: var(--body); }

/* =====================================================================
   Bewegung: Bild wächst, Textzeilen steigen gestaffelt
   ===================================================================== */
@media (prefers-reduced-motion: no-preference) {
  @keyframes cineIn { from { transform: scale(1.04); } to { transform: scale(1); } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .hero { animation: cineIn 600ms var(--ease) both; }
  .hero-text > *, .scroll > * { animation: riseIn var(--dur-m) var(--ease) both; }

  .scroll > *:nth-child(3) { animation-delay: 120ms; }
  .scroll > *:nth-child(4) { animation-delay: 180ms; }
}
