<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>

  --linie:#3c3c3c; --linie-stark:#262626;
  --m-blau-hell:#0066b1; --m-blau:#1c69d4; --m-rot:#e22718;
  /* Form */
  --r0:0px; --rfull:9999px;
  /* Abstände */
  --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:24px; --s-xl:40px; --s-xxl:64px;

}

.phone{ background:var(--canvas); font-family:var(--font); color:var(--weiss); }
.phone .sb{ color:var(--weiss); }

/* ---------- Typo ---------- */
.versal{ font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; line-height:1.3; }
.d-xl{ font-family:var(--font-display); font-weight:700; font-size:46px; line-height:1; text-transform:uppercase; letter-spacing:0; }
.d-lg{ font-family:var(--font-display); font-weight:700; font-size:40px; line-height:1.02; text-transform:uppercase; }
.d-md{ font-family:var(--font-display); font-weight:700; font-size:30px; line-height:1.08; text-transform:uppercase; }
.d-sm{ font-family:var(--font-display); font-weight:700; font-size:19px; line-height:1.15; text-transform:uppercase; }
.light{ font-weight:300; font-size:14px; line-height:1.5; color:var(--body); }
.light-xs{ font-weight:300; font-size:12px; line-height:1.45; color:var(--body); }

/* ---------- Icons: ein Stil (Phosphor gefüllt) ---------- */

/* ---------- M-Streifen ---------- */
.m-streifen{ display:block; height:4px; width:44px;
  background:linear-gradient(to right, var(--m-blau-hell) 0 33.33%, var(--m-blau) 33.33% 66.66%, var(--m-rot) 66.66% 100%); }

/* ---------- Fotobahn ---------- */
.buehne{ position:relative; }
.buehne .foto{ position:absolute; inset:0; }
.buehne::before{ content:""; position:absolute; inset:0 0 auto 0; height:110px; z-index:1;
  background:linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 100%); }
.buehne::after{ content:""; position:absolute; inset:auto 0 0 0; height:52%; z-index:1;

.buehne-text{ position:absolute; left:var(--rand); right:var(--rand); bottom:22px; z-index:5; }
.buehne-text .versal{ color:var(--body); margin-top:12px; }
.buehne-text .d-xl{ margin-top:10px; }
.buehne-text .light{ margin-top:8px; }

/* ---------- Knöpfe ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:9px; height:46px; padding:0 20px; white-space:nowrap;
  border-radius:var(--r0); font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--weiss); box-shadow:inset 0 0 0 1px var(--weiss); background:transparent;
  transition:background var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); }
.btn .ic{ font-size:15px; }
.btn:active{ background:var(--card); transform:scale(.98); }
.ikon-knopf{ width:46px; height:46px; flex:none; border-radius:var(--rfull); background:var(--card);
  display:inline-flex; align-items:center; justify-content:center; color:var(--weiss); }

.tlink{ display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:700;

.tlink .ic{ font-size:11px; }

/* ---------- Spec-Zellen ---------- */
.spec{ display:flex; background:var(--soft); border-top:1px solid var(--linie); border-bottom:1px solid var(--linie); }
.spec-zelle{ flex:1; padding:16px 0 17px 16px; }

.spec-wert{ font-family:var(--font-display); font-weight:700; font-size:27px; line-height:1; }
.spec-label{ font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--muted); margin-top:7px; }

/* ---------- Abschnittskopf ---------- */
.sec{ padding:20px var(--rand) 12px; }
.sec .d-sm{ margin-top:11px; }
.sec-zeile{ display:flex; align-items:flex-end; justify-content:space-between; }

/* ---------- Fotokarten-Reihe ---------- */
.reihe{ gap:10px; padding-left:var(--rand); }
.m-karte{ width:152px; flex:none; }
.m-karte .foto{ height:110px; }
.m-karte .d-sm{ font-size:16px; margin-top:11px; }
.m-karte .light-xs{ margin-top:5px; color:var(--muted); }

/* ---------- Untere Navigation (ohne Icons) ---------- */
.nav{ position:absolute; left:0; right:0; bottom:0; height:72px; background:var(--canvas);
  border-top:1px solid var(--linie); display:flex; z-index:20; }
.nav-ziel{ flex:1; position:relative; display:flex; align-items:center; justify-content:center;
  padding-bottom:14px; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;

.nav-ziel.aktiv{ color:var(--weiss); }

/* ---------- Bibliothek ---------- */
.kopfzeile{ display:flex; align-items:center; justify-content:space-between; padding:14px var(--rand) 16px; }
.kopfzeile .d-md{ font-size:32px; }
.kopfzeile .ic{ font-size:21px; }
.suchfeld{ margin:0 var(--rand); height:46px; display:flex; align-items:center; gap:11px;
  background:var(--card); border:1px solid var(--linie); border-radius:var(--r0); padding:0 14px; }
.suchfeld .ic{ font-size:17px; color:var(--muted); }
.suchfeld span{ font-size:15px; font-weight:300; color:var(--muted); }
.reiter{ display:flex; gap:20px; padding:0 var(--rand); margin-top:18px; border-bottom:1px solid var(--linie); }
.reiter button{ padding:0 0 11px; font-size:11px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--body); border-bottom:2px solid transparent; }
.reiter button.aktiv{ color:var(--weiss); border-bottom-color:var(--weiss); }
.listkopf{ display:flex; align-items:center; justify-content:space-between; padding:13px var(--rand) 11px; }
.listkopf .light-xs{ color:var(--muted); }
.zeile{ display:flex; align-items:center; gap:14px; padding:11px var(--rand);
  border-top:1px solid var(--linie-stark); }
.zeile .nr{ font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--muted);
  width:18px; flex:none; letter-spacing:.5px; }
.zeile .thumb{ width:78px; height:50px; flex:none; border-radius:var(--r0); }
.zeile .txt{ flex:1; min-width:0; }
.zeile .d-sm{ font-size:16px; }
.zeile .light-xs{ margin-top:3px; color:var(--muted); }
.zeile .wert{ font-size:10px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase;
  color:var(--body); text-align:right; flex:none; }

/* ---------- Detail ---------- */
.held{ height:328px; }
.held .zurueck{ position:absolute; top:54px; left:18px; z-index:10; width:40px; height:40px; }
.held .mehr{ position:absolute; top:54px; right:18px; z-index:10; width:40px; height:40px; }

.aktionen{ display:flex; align-items:center; gap:10px; padding:18px var(--rand) 0; }
.aktionen .btn{ flex:1; padding:0 10px; }
.musikzeile{ display:flex; align-items:center; gap:13px; background:var(--card);

.detail-reiter{ margin-top:20px; }

/* ---------- Bewegung ---------- */

  .buehne .foto{ animation:zoom 600ms var(--ease) both; }
  @keyframes zoom{ from{ transform:scale(1.06); } to{ transform:none; } }
}
