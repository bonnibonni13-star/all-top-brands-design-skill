<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Farben aus der Markendatei */
  --primary:#024ad8; --primary-deep:#0e3191; --primary-soft:#c9e0fc;
  --ink:#1a1a1a; --ink-soft:#292929; --on-ink:#ffffff;
  --canvas:#ffffff; --cloud:#f7f7f7; --fog:#e8e8e8;
  --steel:#c2c2c2; --graphite:#636363; --charcoal:#3d3d3d;
  --hairline:#e8e8e8;
  /* Zweiteilige Form: Karten weich, Buttons scharf */
  --r-btn:4px; --r-lg:8px; --r-card:16px; --r-pill:9999px;
  /* Raster 8 px */
  --pad:20px; --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:20px; --s-xl:24px;
  /* Tiefe */
  --lift:0 2px 8px rgba(26,26,26,.08);
  /* Bewegung */
  --dur-s:160ms; --dur-m:280ms; --ease:cubic-bezier(.2,0,.2,1);
  --f:Inter,"DejaVu Sans",sans-serif;
  --fd:"Inter Display",Inter,"DejaVu Sans",sans-serif;
}

.phone{background:var(--canvas);color:var(--ink);font:400 16px/1.4 var(--f);}
.ic-l{stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter;}

/* ---------- Typografie ---------- */
.disp-md{font:500 32px/1 var(--fd);}
.disp-sm{font:500 24px/1.17 var(--fd);}
.disp-xs{font:500 20px/1.1 var(--fd);}
.body-em{font:500 16px/1.38 var(--f);}
.cap{font:400 14px/1.5 var(--f);color:var(--charcoal);}
.cap-sm{font:400 12px/1.33 var(--f);color:var(--graphite);}
.eyebrow{font:700 14px/1.3 var(--f);color:var(--primary);}

/* ---------- Buttons: 4 px, versal, gesperrt ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;
  padding:12px 24px;border-radius:var(--r-btn);
  font:600 14px/1.4 var(--f);letter-spacing:.7px;text-transform:uppercase;
  transition:background var(--dur-s) var(--ease),color var(--dur-s) var(--ease);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-deep);}
.btn-outline-ink{background:var(--canvas);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
.btn-sq{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-btn);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);font-size:20px;flex:none;}
.tlink{display:inline-flex;align-items:center;gap:6px;font:500 14px/1.38 var(--f);color:var(--ink);}

/* ---------- Bänder ---------- */
.utility{height:32px;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);background:var(--ink);color:var(--on-ink);
  font:400 12px/1.33 var(--f);}
.utility .u-dim{color:#b9b9b9;}
.navbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 var(--pad);
  background:var(--canvas);border-bottom:1px solid var(--hairline);}
.mark{width:26px;height:26px;flex:none;color:var(--primary);}
.avatar{width:32px;height:32px;border-radius:var(--r-btn);flex:none;}
.nav-ic{font-size:23px;color:var(--ink);flex:none;}
.band-cloud{background:var(--cloud);}
.band-white{background:var(--canvas);}

/* ---------- Felder ---------- */
.field{display:flex;align-items:center;gap:10px;height:40px;padding:12px 14px;
  border:1px solid var(--steel);border-radius:var(--r-btn);background:var(--canvas);
  color:var(--graphite);transition:border-color var(--dur-s) var(--ease);}
.field-lg{height:44px;padding:12px 16px;}
.field span{font:400 16px/1 var(--f);}
.field .ic{font-size:19px;}

/* ---------- Chevron-Signatur ---------- */
.heroband{position:relative;background:var(--canvas);padding:14px 76px 16px var(--pad);}
.chev{position:absolute;right:0;top:44px;width:76px;height:190px;z-index:0;
  fill:var(--primary);}

/* ---------- Karten ---------- */
.card{background:var(--canvas);border-radius:var(--r-card);box-shadow:var(--lift);
  position:relative;z-index:1;}
.hero-card{padding:16px;}
.frame{border-radius:var(--r-card);overflow:hidden;position:relative;}
.badge-ink{position:absolute;left:12px;top:12px;z-index:2;background:var(--ink);color:#fff;
  border-radius:var(--r-lg);padding:5px 11px;font:500 13px/1.2 var(--f);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-md);}
.tile{background:var(--canvas);border-radius:var(--r-card);box-shadow:var(--lift);padding:12px;}
.tile-img{height:88px;border-radius:var(--r-lg);}
.tile-ttl{font:500 17px/1.15 var(--fd);margin-top:10px;}
.tile-meta{font:400 14px/1.5 var(--f);color:var(--charcoal);margin-top:4px;}

/* ---------- Ink-Block ---------- */
.slab{background:var(--ink);color:var(--on-ink);border-radius:var(--r-card);padding:18px 20px;}
.slab .cap{color:#b9b9b9;}
.pill-out{display:inline-flex;align-items:center;gap:7px;height:36px;padding:8px 13px;white-space:nowrap;
  border-radius:var(--r-pill);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);
  font:500 14px/1 var(--f);color:#fff;}
.bar{height:4px;background:rgba(255,255,255,.22);border-radius:2px;margin-top:14px;}
.bar span{display:block;height:4px;width:69%;background:#fff;border-radius:2px;}

/* ---------- Kategorie-Pillen ---------- */
.tabs{display:flex;gap:var(--s-xs);padding:0 var(--pad);overflow:hidden;}
.tab{display:inline-flex;align-items:center;height:40px;padding:8px 20px;flex:none;
  border-radius:var(--r-pill);background:var(--canvas);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--hairline);font:500 16px/1 var(--f);
  transition:background var(--dur-s) var(--ease),color var(--dur-s) var(--ease);}
.tab.is-on{background:var(--ink);color:#fff;box-shadow:none;}

/* ---------- Listenkarte mit Hairline-Zeilen ---------- */
.listcard{background:var(--canvas);border-radius:var(--r-card);box-shadow:var(--lift);
  overflow:hidden;}
.lrow{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 12px;
  border-top:1px solid var(--hairline);}
.lrow:first-child{border-top:0;}
.lrow-img{width:56px;height:56px;border-radius:var(--r-lg);flex:none;}
.lrow-ttl{font:500 16px/1.25 var(--f);}
.lrow-meta{font:400 14px/1.4 var(--f);color:var(--charcoal);margin-top:2px;}
.lrow-val{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap;
  font:400 14px/1.4 var(--f);color:var(--graphite);}

/* ---------- Hairline-Zeile einzeln ---------- */
.inline-row{display:flex;align-items:center;gap:14px;padding:14px 0;
  border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}

/* ---------- Fotoraster ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-xs);}
.photo{height:104px;border-radius:var(--r-lg);}

/* ---------- Tab-Leiste unten ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;z-index:20;
  display:flex;align-items:flex-start;background:var(--canvas);
  border-top:1px solid var(--hairline);padding-top:10px;}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--ink);font-size:23px;}
.tb b{font:400 12px/1.2 var(--f);padding-bottom:4px;border-bottom:2px solid transparent;}
.tb.is-on{color:var(--primary);}
.tb.is-on b{font-weight:600;border-bottom-color:var(--primary);}

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion:no-preference){
  .card,.tile,.slab,.listcard{animation:hp-up var(--dur-m) var(--ease) both;}
  .tile:nth-child(2){animation-delay:50ms;}
  .tile:nth-child(3){animation-delay:100ms;}
  @keyframes hp-up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
}
