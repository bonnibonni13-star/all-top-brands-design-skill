<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Flächen */
  --canvas:#131313; --slate:#2d2d2d; --frame:#313131;

  --mint:#3cffd0; --mint-line:#309875; --uv:#5200ff; --uv-rule:#3d00bf; --link:#3860be;
  /* Text */
  --white:#ffffff; --muted:#e9e9e9; --gray:#949494; --ink:#131313;
  /* Form */
  --r-tag:2px; --r-img:4px; --r-card:20px; --r-feature:24px; --r-pill:24px; --r-out:40px;
  /* Bewegung */
  --dur-s:150ms; --dur-m:200ms; --ease:cubic-bezier(.2,0,0,1);
  /* Schrift */
  --display:"TeX Gyre Heros Cn","DejaVu Sans Condensed",sans-serif;
  --sans:Inter,"DejaVu Sans",sans-serif;
  --mono:"DejaVu Sans Mono","Liberation Mono",monospace;
}

.phone{ background:var(--canvas); color:var(--white); font-family:var(--sans); }
.sb{ color:var(--white); }
.hi{ color:var(--white); }

/* ---------- Schriftrollen ---------- */
.display{ font-family:var(--display); font-weight:700; text-transform:uppercase;
  line-height:.88; letter-spacing:.01em; }
.whisper{ font-size:18px; font-weight:300; letter-spacing:1.9px; line-height:1.2; color:var(--white); }
.mono{ font-family:var(--mono); text-transform:uppercase; letter-spacing:1.5px; }
.kicker{ font-family:var(--mono); text-transform:uppercase; font-size:10.5px; letter-spacing:1.6px;
  font-weight:700; color:var(--mint); }
.deck{ font-size:12.5px; line-height:1.45; color:var(--gray); }

/* ---------- Knöpfe ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--mono); text-transform:uppercase; font-size:11px; font-weight:700; letter-spacing:1.5px;
  border-radius:var(--r-pill); padding:12px 20px; transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease); }
.btn-mint{ background:var(--mint); color:#000; }
.btn-ink{ background:#000; color:var(--white); }
.btn-slate{ background:var(--slate); color:var(--muted); }
.btn:active{ background:rgba(255,255,255,.2); color:#000; }
.btn .ic{ font-size:15px; }

.iconbtn{ width:42px; height:42px; border-radius:50%; border:1px solid var(--gray);
  display:flex; align-items:center; justify-content:center; color:var(--white); flex:none; }
.iconbtn .ic{ font-size:18px; }
.ic{ stroke-width:1.75; stroke-linecap:square; stroke-linejoin:miter; }

/* ---------- Untere Leiste: nur Text ---------- */
.nav{ position:absolute; left:0; right:0; bottom:0; height:66px; background:var(--canvas);
  border-top:1px solid rgba(255,255,255,.22); display:flex; align-items:flex-start;
  padding:17px 14px 0; z-index:30; }
.nav-item{ flex:1; text-align:center; font-family:var(--mono); text-transform:uppercase;
  font-size:10px; letter-spacing:1.5px; font-weight:700; color:var(--gray); padding-bottom:7px; }
.nav-item.is-on{ color:var(--mint); box-shadow:inset 0 -1px 0 0 var(--mint); }

/* ---------- Start ---------- */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:2px 16px 10px; }
.mark{ display:flex; align-items:center; gap:9px; }
.mark svg{ display:block; }
.mark-label{ font-family:var(--mono); text-transform:uppercase; font-size:9.5px; letter-spacing:1.8px; color:var(--gray); }
.topbar-right{ display:flex; align-items:center; gap:9px; }
.iconbtn-s{ width:34px; height:34px; }
.iconbtn-s .ic{ font-size:16px; }
.btn-s{ padding:9px 15px; font-size:10px; }

.masthead{ padding:4px 16px 0; }
.masthead .display{ font-size:56px; margin-top:8px; }
.stats{ font-family:var(--mono); text-transform:uppercase; font-size:10px; letter-spacing:1.4px;
  color:var(--muted); margin-top:14px; }
.stats i{ color:var(--mint); font-style:normal; padding:0 5px; }

.feature{ background:var(--mint); color:#000; border-radius:var(--r-feature); margin:12px 16px 0; padding:15px; }
.feature .kicker{ color:#000; }
.feature-img{ height:112px; border-radius:12px; margin-top:11px; background-position:50% 42%; }
.feature-title{ font-size:25px; font-weight:700; line-height:1.05; margin-top:12px; letter-spacing:-.01em; }
.feature-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; }
.feature-meta{ font-family:var(--mono); text-transform:uppercase; font-size:9.5px; letter-spacing:1.4px; color:rgba(0,0,0,.72); }

/* ---------- Zeitstrahl ---------- */
.stream{ margin-top:16px; padding:0 16px; }
.stream-head{ display:flex; align-items:center; justify-content:space-between;
  font-family:var(--mono); text-transform:uppercase; font-size:10px; letter-spacing:1.8px; color:var(--white); }
.stream-head span:last-child{ color:var(--mint); }
.stream-list{ position:relative; margin-top:13px; padding-left:78px; }
.stream-list::before{ content:""; position:absolute; left:64px; top:4px; bottom:0; width:1px; background:var(--white); }
.si{ position:relative; margin-bottom:12px; }
.si-time{ position:absolute; left:-78px; top:15px; width:52px; text-align:right; font-family:var(--mono); text-transform:uppercase;
  font-size:8.5px; letter-spacing:1.1px; color:var(--gray); line-height:1.35; }
.si::before{ content:""; position:absolute; left:-18px; top:17px; width:9px; height:9px; border-radius:50%;

.si-card.is-uv{ background:var(--uv); border-color:var(--uv); }
.si-img{ width:52px; height:52px; border-radius:var(--r-img); border:1px solid var(--frame); flex:none; }
.si-txt{ min-width:0; }
.si-title{ font-size:17px; font-weight:700; line-height:1.1; margin-top:5px; letter-spacing:-.01em; }
.si-meta{ font-family:var(--mono); text-transform:uppercase; font-size:9px; letter-spacing:1.1px;
  color:var(--gray); margin-top:6px; }
.is-uv .si-meta{ color:rgba(255,255,255,.8); }
.is-uv .kicker{ color:var(--white); }

/* ---------- Bibliothek ---------- */
.lib-head{ display:flex; align-items:flex-end; justify-content:space-between; padding:2px 16px 0; }
.lib-head .display{ font-size:48px; }
.search{ display:flex; align-items:center; gap:10px; height:46px; margin:16px 16px 0;
  border:1px solid var(--gray); border-radius:var(--r-tag); padding:0 14px;

.search .ic{ font-size:17px; color:var(--white); }

.tags{ gap:8px; padding:14px 0 0 16px; }
.tag{ flex:none; font-family:var(--mono); text-transform:uppercase; font-size:10px; letter-spacing:1.8px;
  font-weight:700; border:1px solid var(--gray); color:var(--muted); border-radius:var(--r-out); padding:8px 15px; }
.tag.is-on{ background:var(--mint); border-color:var(--mint); color:#000; }

.collage{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px 16px 0; }
.wide{ grid-column:1 / -1; }
.ct{ border:1px solid var(--frame); border-radius:var(--r-card); overflow:hidden; }
.ct-img{ height:108px; }
.ct-body{ padding:11px 12px 13px; }
.ct-title{ font-size:16.5px; font-weight:700; line-height:1.12; margin-top:5px; letter-spacing:-.01em; }
.ct-meta{ font-family:var(--mono); text-transform:uppercase; font-size:8.5px; letter-spacing:1.1px;
  color:var(--gray); margin-top:6px; }

.block{ border-radius:var(--r-card); padding:14px; display:flex; flex-direction:column; justify-content:flex-start; }
.block-white{ background:var(--white); color:#000; flex-direction:row; align-items:center; gap:12px; }
.block-white .kicker{ color:#000; }
.block-white .ct-meta{ color:rgba(0,0,0,.6); }
.block-uv{ background:var(--uv); }

.block-uv .ct-meta{ color:rgba(255,255,255,.8); }
.block-mint{ background:var(--mint); color:#000; }

.round-ink .ic{ font-size:16px; }

/* ---------- Detail ---------- */
.d-top{ display:flex; align-items:center; justify-content:space-between; padding:2px 16px 0; }
.d-img{ height:196px; margin:14px 16px 0; border-radius:var(--r-card); border:1px solid var(--frame);

.d-head{ padding:16px 16px 0; }
.d-head .display{ font-size:56px; margin-top:8px; }
.d-sub{ font-family:var(--mono); text-transform:uppercase; font-size:10px; letter-spacing:1.4px;

.d-act{ display:flex; align-items:center; gap:10px; padding:16px 16px 0; }
.d-act .btn-mint{ flex:1; }
.d-tabs{ display:flex; gap:22px; padding:18px 16px 0; }
.d-tab{ font-family:var(--mono); text-transform:uppercase; font-size:10.5px; letter-spacing:1.5px;
  font-weight:700; color:var(--gray); padding-bottom:9px; }
.d-tab.is-on{ color:var(--mint); box-shadow:inset 0 -1px 0 0 var(--mint); }
.d-rule{ height:1px; background:var(--frame); margin:0 16px; }
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:14px 16px 0; }
.gp{ aspect-ratio:1/1; border-radius:var(--r-img); border:1px solid var(--frame); }

.musicbar{ position:absolute; left:16px; right:16px; bottom:80px; z-index:28;

  display:flex; align-items:center; gap:12px; }
.musicbar .kicker{ color:var(--white); }
.music-name{ font-size:16px; font-weight:700; margin-top:5px; letter-spacing:-.01em; }
.round-white{ width:38px; height:38px; border-radius:50%; background:var(--white); color:#000;
  display:flex; align-items:center; justify-content:center; flex:none; margin-left:auto; }
.round-white .ic{ font-size:16px; }

/* ---------- Bewegung: nur Farbe, kein Heben ---------- */
@media (prefers-reduced-motion: no-preference){

  .si:nth-child(2){ animation-delay:30ms; } .si:nth-child(3){ animation-delay:60ms; }
  .ct:nth-child(2),.block:nth-child(2){ animation-delay:30ms; }
  @keyframes hard{ from{ opacity:0; } to{ opacity:1; } }
}
