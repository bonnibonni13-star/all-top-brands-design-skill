<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* ==========================================================================
   Shopify – Designsprache als App-Vorlage
   Werte aus references/shopify.md (zwei Spuren, Pillen, Typo-Leiter, Schatten).
   App-Muster, Icons und Bewegung = Empfehlung aus dem Profil.

:root {

  --night-up: #0a0a0a;

  /* Helle Spur */

  --shade-30: #d4d4d8;
  --shade-40: #a1a1aa;
  --shade-50: #71717a;
  --shade-60: #52525b;
  --shade-70: #3f3f46;
  /* Schrift: dünne Display-Grotesk + Inter für alles Bedienbare */
  --font-display: "Inter Display", "TeX Gyre Heros", sans-serif;
  --font: "Inter", sans-serif;
  /* Radien – Pille ist die einzige Knopfform */
  --r-xs: 4px;
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 20px;
  --r-pill: 9999px;
  /* Abstände (8-px-Basis) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-6: 24px;
  --s-8: 32px;
  --gutter: 24px;

  /* Bewegung (Empfehlung) */
  --dur-s: 180ms;
  --dur-m: 320ms;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

/* ---------- Grundlage: zwei Spuren, nie gemischt ---------- */
.phone { font: 400 16px/1.5 var(--font); font-feature-settings: "ss03"; }
.track-night { background: var(--night); color: #fff; }
.track-night .sb, .track-night .hi { color: #fff; }
.track-light { background: var(--cream); color: #000; }
.track-light .sb, .track-light .hi { color: #000; }
:where(.phone) :where(h1, h2, h3, p) { margin: 0; }
.ic-l { stroke-width: 1.5; }

/* Typografie: Display dünn, Inter kräftiger */
.display { font: 300 54px/1 var(--font-display); letter-spacing: 0; }
.display--light { font-weight: 300; }
.display--md { font-size: 42px; }
.eyebrow { font: 400 12px/1.2 var(--font); letter-spacing: .72px; text-transform: uppercase; }
.eyebrow--mute { color: var(--shade-40); }
.eyebrow--dim { color: var(--shade-50); }
.h-md { font: 500 20px/1.4 var(--font-display); letter-spacing: .3px; }
.body { font: 400 16px/1.5 var(--font); }
.caption { font: 500 14px/1.49 var(--font); letter-spacing: .28px; }
.micro { font: 500 13px/1.5 var(--font); letter-spacing: -.13px; }

/* ---------- Pillen: die einzige Knopfform ---------- */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px;
  padding: 0 24px; border-radius: var(--r-pill); font: 400 16px/1 var(--font); white-space: nowrap;

.pill .ic { font-size: 19px; }
.pill--stroke-dark { border: 2px solid #fff; color: #fff; background: transparent; }
.pill--stroke-dark:active { background: #fff; color: #000; }
.pill--fill-dark { background: #fff; color: #000; }
.pill--fill-light { background: #000; color: #fff; }
.pill--fill-light:active { background: var(--shade-70); }
.pill--stroke-light { border: 1px solid #000; color: #000; background: var(--light); }
.pill--aloe { background: var(--aloe); color: #000; }
.circle { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--r-pill);
  font-size: 20px; flex: none; transition: background-color var(--dur-s) var(--ease); }
.circle--stroke-dark { border: 2px solid #fff; color: #fff; }
.circle--fill { background: #fff; color: #000; }

.circle--stroke-dark:active { background: #fff; color: #000; }

/* Pillen-Tags */
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--r-pill);
  font: 400 11px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; white-space: nowrap; flex: none; }
.tag--mint { background: var(--aloe); color: #000; }
.tag--shade { background: var(--shade-30); color: #000; }
.tag--line { border: 1px solid var(--hairline); background: var(--light); color: var(--shade-60); }

/* ---------- Kinospur: Text in freier Fläche, Bild randlos ---------- */
.cine-top { display: flex; align-items: center; justify-content: space-between; height: 44px;
  padding: 0 var(--gutter); }
.avatar { width: 36px; height: 36px; border-radius: var(--r-pill); filter: grayscale(1); }
.cine-type { padding: 16px var(--gutter) 20px; }
.cine-type .display { margin-top: 10px; }

.bleed { width: 100%; }                    /* randlos von Kante zu Kante */
.cine-cta { padding: 20px var(--gutter) 0; }

/* Zweites Band: Reihe aus Fotoflächen mit Versal-Label darüber */
.strip-head { padding: 24px var(--gutter) 0; display: flex; align-items: baseline; justify-content: space-between; }
.row-x { gap: 10px; padding: 12px 0 0 var(--gutter); }
.frame { width: 152px; flex: none; }

/* ---------- Helle Spur: Suche, Filter, Bänder, Kartenzeilen ---------- */
.light-head { padding: 4px var(--gutter) 0; display: flex; align-items: center; justify-content: space-between; }
.search { display: flex; align-items: center; gap: 10px; height: 44px; margin: 16px var(--gutter) 0;

.filters { gap: var(--s-2); padding: 14px 0 0 var(--gutter); }

.band { margin: 16px var(--gutter) 0; background: var(--pistachio); border-radius: var(--r-lg);

.band .bar > i { display: block; height: 4px; width: 69%; background: #000; border-radius: var(--r-pill); }

/* Kartenzeilen mit gestapelten Mini-Schatten */
.rows { padding: 16px 18px 0; display: flex; flex-direction: column; gap: 12px; }
.rowcard { display: flex; align-items: center; gap: 12px; padding: 8px; background: var(--light);

/* ---------- Detail ---------- */
.hero-bleed { position: relative; height: 302px; }
.hero-bleed .pic { position: absolute; inset: 0; }
.hero-top { position: relative; display: flex; align-items: center; justify-content: space-between;

.detail-actions { display: flex; gap: 10px; margin-top: 20px; }
.detail-actions .pill { flex: 1; }
.switch { display: flex; gap: var(--s-2); padding: 20px var(--gutter) 0; }

/* ---------- Navigation: volle Leiste, Polarität des Screens ---------- */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; z-index: 20; display: flex;
  align-items: center; justify-content: space-around; padding: 0 12px 14px; }
.nav a { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px;
  border-radius: var(--r-pill); font: 500 14px/1 var(--font);

.nav .ic { font-size: 22px; }
.nav a span { display: none; }

.nav .is-on { padding: 0 20px 0 16px; }
.track-night .nav { background: var(--night); border-top: 1px solid var(--teal-line); }
.track-night .nav a { color: var(--shade-40); }
.track-night .nav .is-on { background: #fff; color: #000; }
.track-light .nav { background: var(--light); border-top: 1px solid var(--hairline); }

.fade-night { position: absolute; left: 0; right: 0; bottom: 76px; height: 56px; z-index: 15; pointer-events: none;

@media (prefers-reduced-motion: no-preference) {
