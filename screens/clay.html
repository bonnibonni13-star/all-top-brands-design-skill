<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* =====================================================================
   Musterscreens im Stil von Clay – Cremefläche, satte einfarbige Blöcke
   mit 24-px-Radius und einer weißen Innenkachel je Block. Keine Schatten,
   kein Weiß als Fläche, Display nur im Gewicht 500.
   Werte aus der Markendatei; App-Muster (Tab-Leiste, Musik-Karte) sind
   Empfehlungen und im Profil als solche gekennzeichnet.
   ===================================================================== */
:root {
  /* Flächen – die Cremeleiter der Marke */
  --canvas: #fffaf0;
  --soft: #faf5e8;
  --card: #f5f0e0;
  --strong: #ebe6d6;

  /* Schrift- und Linienfarben */
  --ink: #0a0a0a;
  --body: #3a3a3a;
  --muted: #6a6a6a;
  --muted-soft: #9a9a9a;
  --hairline: #e5e5e5;
  --on-primary: #ffffff;

  /* Die sechs Markenfarben der Feature-Blöcke */
  --pink: #ff4d8b;
  --teal: #1a3a3a;
  --lavender: #b8a4ed;
  --peach: #ffb084;
  --ochre: #e8b94a;
  --mint: #a4d4c5;
  --coral: #ff6b5a;

  /* Schrift: Plain Black → Inter Display 500 mit −0.05em (laut Datei) */
  --font: Inter, "DejaVu Sans", sans-serif;
  --font-display: "Inter Display", Inter, sans-serif;

  /* Radien */
  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 12px;   /* Knöpfe, Felder */
  --r-lg: 16px;   /* Inhaltskarten, Innenkacheln */
  --r-xl: 24px;   /* Farbblöcke */
  --r-pill: 9999px;

  /* Abstände (4er-Basis) */
  --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-24: 24px; --s-32: 32px;
  --gutter: 20px;

  /* Bewegung (Empfehlung – die Datei nennt keine Werte) */
  --dur-s: 180ms;
  --dur-m: 300ms;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

/* ---------- Grundlagen ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 400 14px/1.45 var(--font); }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }
:where(.phone) :where(button) { cursor: pointer; }
.sb, .hi { color: var(--ink); }

.eyebrow {
  font: 600 11px/1.4 var(--font); letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
}
.display { font-family: var(--font-display); font-weight: 500; letter-spacing: -.05em; line-height: 1.04; }

/* ---------- Kopf des Startscreens ---------- */
.greet { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px var(--gutter) 0; }
.greet .display { font-size: 34px; margin-top: 6px; }
.avatar { width: 44px; height: 44px; border-radius: var(--r-pill); flex: none; background-color: var(--strong); }

/* ---------- Farbblock: die Signatur ---------- */
.block { border-radius: var(--r-xl); padding: 14px; }
.block-ochre { background: var(--ochre); }
.block-teal { background: var(--teal); color: var(--on-primary); }
.block-lavender { background: var(--lavender); }
.block-peach { background: var(--peach); }
.block-pink { background: var(--pink); color: var(--on-primary); }
.block-cream { background: var(--card); }
.block-teal .eyebrow, .block-pink .eyebrow { color: rgba(255,255,255,.72); }

/* weiße Innenkachel – „Produktausschnitt im Farbfeld“ */
.inner { background: var(--canvas); border-radius: var(--r-lg); padding: 7px; }

/* Rückblick-Block (Start) */
.hero { display: flex; gap: 14px; align-items: center; margin: 18px var(--gutter) 0; }
.hero-tile { width: 102px; height: 102px; flex: none; }
.hero-tile .photo { display: block; width: 100%; height: 100%; border-radius: 11px; }
.hero-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hero-title { font-family: var(--font-display); font-weight: 500; font-size: 24px; letter-spacing: -.04em; line-height: 1.1; }
.hero-meta { font: 500 12.5px/1.3 var(--font); color: rgba(10,10,10,.62); }
.btn-on-color {
  align-self: flex-start; margin-top: 8px; height: 34px; padding: 0 16px; border-radius: var(--r-md);
  background: var(--canvas); color: var(--ink); font: 600 13px/1 var(--font);
  display: inline-flex; align-items: center; gap: 6px;
  transition: transform var(--dur-s) var(--ease);
}
.btn-on-color:active { transform: scale(.97); }

/* ---------- Abschnittskopf ---------- */
.sec {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 16px var(--gutter) 12px;
}
.sec h2 { font-family: var(--font-display); font-weight: 500; font-size: 21px; letter-spacing: -.045em; }
.sec a { font: 600 13px/1 var(--font); color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }

/* ---------- Regal aus Farbkarten ---------- */
.shelf { gap: 12px; padding-left: var(--gutter); }
.cover { width: 154px; flex: none; padding: 8px 8px 11px; }
.cover .inner { padding: 6px; }
.cover .photo { display: block; width: 100%; height: 96px; border-radius: 10px; }
.cover-title { margin: 9px 2px 0; font: 600 13.5px/1.25 var(--font); }
.cover-meta { margin: 2px 2px 0; font: 500 11.5px/1.3 var(--font); color: rgba(10,10,10,.6); }
.block-teal .cover-meta, .block-pink .cover-meta { color: rgba(255,255,255,.72); }

/* ---------- Zwei kleine Blöcke nebeneinander ---------- */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 var(--gutter); }
.duo .block { padding: 14px 14px 0; height: 146px; display: flex; flex-direction: column; overflow: hidden; }
.stat-num { font-family: var(--font-display); font-weight: 500; font-size: 29px; letter-spacing: -.05em; line-height: 1.05; margin-top: 8px; }
.stat-sub { font: 500 11.5px/1.3 var(--font); color: rgba(255,255,255,.7); }
.bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.22); margin-top: 10px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 69%; border-radius: 4px; background: var(--ochre); }
/* Knetberg-Horizont */
.hills { display: block; width: calc(100% + 28px); margin: auto -14px 0; height: 48px; }

.src-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.src { display: flex; align-items: center; gap: 8px; font: 600 12.5px/1 var(--font); }
.src .ic { font-size: 15px; }
.src small { margin-left: auto; font: 500 10.5px/1 var(--font); color: rgba(10,10,10,.5); }

/* ---------- Untere Leiste ---------- */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 78px; z-index: 20;
  background: var(--canvas); border-top: 1px solid var(--hairline);
  display: grid; grid-template-columns: repeat(4, 1fr); align-items: start; padding-top: 9px;
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 5px; font: 500 10.5px/1 var(--font); color: var(--muted-soft); }
.tab-ic {
  width: 44px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
  font-size: 19px; transition: background var(--dur-s) var(--ease);
}
.tab.is-active { color: var(--ink); font-weight: 600; }
.tab.is-active .tab-ic { background: var(--pink); color: var(--on-primary); }

/* ---------- Kopf mit Titel (Bibliothek) ---------- */
.head { display: flex; align-items: center; justify-content: space-between; padding: 10px var(--gutter) 0; }
.head h1 { font-family: var(--font-display); font-weight: 500; font-size: 31px; letter-spacing: -.05em; }
.icon-btn-dark {
  width: 40px; height: 40px; border-radius: var(--r-pill); background: var(--ink); color: var(--canvas);
  display: flex; align-items: center; justify-content: center; font-size: 17px;
}

/* ---------- Suche ---------- */
.search {
  display: flex; align-items: center; gap: 9px; height: 44px; margin: 14px var(--gutter) 0;
  background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 0 14px;
  font: 400 14px/1 var(--font); color: var(--muted);
  transition: border-color var(--dur-s) var(--ease);
}
.search .ic { font-size: 16px; color: var(--muted-soft); }

/* ---------- Chips ---------- */
.chips { gap: 8px; padding: 14px var(--gutter) 0; }
.chip {
  flex: none; height: 34px; padding: 0 15px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; font: 500 13px/1 var(--font); color: var(--muted);
  background: transparent;
}
.chip.is-active { background: var(--ink); color: var(--canvas); font-weight: 600; }

/* ---------- Raster der Bibliothek ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px var(--gutter) 0; }
.item { padding: 8px 8px 11px; }
.item .inner { padding: 6px; }
.item .photo { display: block; width: 100%; height: 94px; border-radius: 10px; }
.item-title { margin: 9px 2px 0; font: 600 13.5px/1.25 var(--font); }
.item-meta { margin: 2px 2px 0; font: 500 11.5px/1.3 var(--font); color: rgba(10,10,10,.6); }
.block-teal .item-meta, .block-pink .item-meta { color: rgba(255,255,255,.72); }

/* breiter Block mitten im Raster (Rhythmuswechsel groß/klein) */
.wide { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px; }
.wide .inner { padding: 6px; flex: none; }
.wide .photo { display: block; width: 72px; height: 72px; border-radius: 10px; }
.wide-body { min-width: 0; }
.wide-title { font-family: var(--font-display); font-weight: 500; font-size: 19px; letter-spacing: -.04em; }
.wide-meta { margin-top: 2px; font: 500 11.5px/1.3 var(--font); color: rgba(255,255,255,.72); white-space: nowrap; }
.wide .round-play { margin-left: auto; }
.round-play {
  width: 42px; height: 42px; flex: none; border-radius: var(--r-pill); background: var(--canvas); color: var(--ink);
  display: flex; align-items: center; justify-content: center; font-size: 17px;
}

/* ---------- Detail ---------- */
.detail-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px var(--gutter) 0; }
.icon-btn {
  width: 40px; height: 40px; border-radius: var(--r-pill); background: var(--canvas); border: 1px solid var(--hairline);
  color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 17px;
  transition: transform var(--dur-s) var(--ease);
}
.icon-btn:active { transform: scale(.97); }

/* Bild im Farbrahmen */
.frame { margin: 12px var(--gutter) 0; padding: 10px; }
.frame .photo { display: block; width: 100%; height: 196px; border-radius: var(--r-lg); }

.detail-head { margin: 18px var(--gutter) 0; }
.detail-head h1 { font-family: var(--font-display); font-weight: 500; font-size: 36px; letter-spacing: -.055em; line-height: 1.02; }
.detail-meta { margin-top: 6px; font: 400 13px/1.4 var(--font); color: var(--muted); }

.actions { display: flex; gap: 10px; margin: 16px var(--gutter) 0; }
.btn-primary {
  flex: 1; height: 46px; border-radius: var(--r-md); background: var(--ink); color: var(--on-primary);
  font: 600 14px/1 var(--font); display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform var(--dur-s) var(--ease), background var(--dur-s) var(--ease);
}
.btn-primary:active { transform: scale(.97); background: #1f1f1f; }
.btn-square {
  width: 46px; height: 46px; flex: none; border-radius: var(--r-md); background: var(--canvas);
  border: 1px solid var(--hairline); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 18px;
}

.seg { gap: 8px; padding: 18px var(--gutter) 0; }

.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px var(--gutter) 0; }
.photo-grid span { display: block; height: 92px; border-radius: var(--r-md); }

/* schwebende Musik-Karte statt Tab-Leiste (Empfehlung) */
.music {
  position: absolute; left: 16px; right: 16px; bottom: 22px; z-index: 20;
  display: flex; align-items: center; gap: 11px; padding: 9px; border-radius: 20px;
}
.music .inner { padding: 5px; flex: none; }
.music .photo { display: block; width: 50px; height: 50px; border-radius: 9px; }
.music-body { min-width: 0; }
.music-body small { display: block; font: 600 10.5px/1.4 var(--font); letter-spacing: 1.2px; text-transform: uppercase; color: rgba(10,10,10,.55); }
.music-body b { display: block; font: 600 15px/1.3 var(--font); }
.music .round-play { width: 40px; height: 40px; margin-left: auto; background: var(--ink); color: var(--canvas); font-size: 15px; }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference) {
  .block, .hero, .search, .grid, .photo-grid { animation: rise var(--dur-m) var(--ease) both; }
  .hero { animation-delay: 40ms; }
  .duo { animation-delay: 80ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
}
