<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{

  --canvas:#090909; --surf1:#141414; --surf2:#1c1c1c;
  --hair:#262626; --hair-soft:#1a1a1a;
  --ink:#ffffff; --muted:#999999; --on-primary:#000000;
  --blue:#0099ff;
  --g-violet:#6a4cf5; --g-magenta:#d44df0; --g-orange:#ff7a3d; --g-coral:#ff5577;
  /* Radien */
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:15px; --r-xl:20px; --r-xxl:30px; --r-pill:100px;
  /* Abstände (Basis 5) */
  --s-xs:8px; --s-sm:12px; --s-md:15px; --s-lg:20px; --s-xl:30px;
  --pad:20px;

  --dur-s:150ms; --dur-m:300ms; --ease:cubic-bezier(.2,.8,.2,1);

  --fd:Poppins,"TeX Gyre Adventor",sans-serif;
  --fs:Inter,"DejaVu Sans",sans-serif;

  --lift:inset 0 .5px 0 rgba(255,255,255,.10), 0 10px 30px rgba(0,0,0,.25);
}

.phone{background:var(--canvas);color:var(--ink);
  font:400 15px/1.3 var(--fs);letter-spacing:-.15px;font-variant-numeric:tabular-nums;}

/* ---------- Typografie ---------- */
.poster{font:500 40px/1 var(--fd);letter-spacing:-2px;color:var(--ink);}
.disp-md{font:500 30px/1.1 var(--fd);letter-spacing:-1.5px;color:var(--ink);}
.headline{font:500 22px/1.2 var(--fd);letter-spacing:-.8px;color:var(--ink);}
.cap{font:500 13px/1.2 var(--fs);letter-spacing:-.13px;color:var(--muted);}
.muted{color:var(--muted);}
.link{color:var(--blue);font:500 13px/1.2 var(--fs);letter-spacing:-.13px;}

.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:10px 18px;border-radius:var(--r-pill);

.pill:active{transform:scale(.96);}
.pill-primary{background:var(--ink);color:var(--on-primary);}
.pill-secondary{background:var(--surf1);color:var(--ink);}
.pill-sm{min-height:38px;padding:8px 14px;font-size:13px;gap:7px;}
.circ{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:44px;height:44px;border-radius:9999px;background:var(--surf1);color:var(--ink);
  font-size:21px;transition:transform var(--dur-s) var(--ease);}

.topbar{display:flex;align-items:center;gap:10px;height:56px;padding:0 var(--pad);}
.mark{width:26px;height:26px;border-radius:9999px;flex:none;

.topbar .sp{margin-left:auto;}

/* ---------- Verlaufs-Spotlight (Signatur) ---------- */
.spot{position:relative;overflow:hidden;border-radius:var(--r-xxl);padding:24px;

.spot > *{position:relative;}
.spot-eyebrow{font:500 13px/1.2 var(--fs);letter-spacing:-.13px;color:rgba(255,255,255,.82);}
.spot-row{display:flex;gap:14px;align-items:flex-start;}
.spot-row > div:first-child{min-width:0;}
.spot-thumb{width:84px;height:104px;border-radius:var(--r-lg);flex:none;

.sec-head{display:flex;align-items:baseline;justify-content:space-between;

.rows{padding:0 var(--pad);display:flex;flex-direction:column;gap:var(--s-xs);}
.row{display:flex;align-items:center;gap:12px;background:var(--surf1);

.row-img{width:56px;height:56px;border-radius:var(--r-md);flex:none;}

.row-val{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap;

.field{display:flex;align-items:center;gap:10px;height:44px;margin:0 var(--pad);
  padding:10px 14px;background:var(--surf1);border-radius:var(--r-md);color:var(--muted);

.field span{font:400 15px/1 var(--fs);letter-spacing:-.15px;}
.field .ic{font-size:19px;}
.chips{display:flex;gap:var(--s-xs);padding:0 var(--pad);overflow:hidden;}
.chip{display:inline-flex;align-items:center;height:40px;padding:8px 16px;flex:none;

.chip.is-on{background:var(--surf2);color:var(--ink);}

.tabbar{position:absolute;left:16px;right:16px;bottom:16px;height:62px;z-index:20;
  display:flex;align-items:center;justify-content:space-around;padding:0 10px;
