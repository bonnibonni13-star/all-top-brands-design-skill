<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

/* ==========================================================================
   Cohere – Designsprache als App-Vorlage

:root {

  --border-light: #e5e7eb;
  --card-border: #f2f2f2;
  --line-on-dark: rgba(255, 255, 255, .22);
  /* Akzente: Taxonomie und Links, nie Fläche */
  --coral: #ff7759;
  --coral-soft: #ffad9b;
  --coral-pale: #fff4f0;      /* Empfehlung: blasse Füllung inaktiver Korallen-Chips */
  --action-blue: #1863dc;
  --focus-blue: #4c6ee6;

  --font-ui: Inter, sans-serif;                     /* Ersatz für Unica77 */
  /* Form */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 30px;
  --r-pill: 32px;
  /* Abstände (8-px-Basis mit Zwischenwerten) */
  --s-1: 6px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --pad: 20px;
  /* Bewegung (Empfehlung) */
  --dur-s: 220ms;
  --dur-m: 420ms;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

/* ---------- Grundlage ---------- */
.phone { background: var(--canvas); color: var(--ink);
  font: 400 16px/1.5 var(--font-ui); }
.phone .sb { color: var(--ink); font-family: var(--font-ui); }
.pad { padding-left: var(--pad); padding-right: var(--pad); }
.stack { display: flex; flex-direction: column; }
.gap-1 { gap: var(--s-1); } .gap-2 { gap: var(--s-2); } .gap-3 { gap: var(--s-3); }
.gap-4 { gap: var(--s-4); } .gap-5 { gap: var(--s-5); } .gap-6 { gap: var(--s-6); }

.display-sm { font: 400 28px/1.05 var(--font-display); letter-spacing: -.02em; color: var(--near-black); }

  font-size: 18px; transition: background var(--dur-s) var(--ease); }

/* ---------- Icons: dünne geometrische Linien ---------- */
.ic { stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Pillen ---------- */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  border-radius: var(--r-pill); padding: 12px 24px;

.pill-white { background: var(--canvas); color: var(--near-black); padding: 9px 18px; }

/* ---------- Medienkarte mit dunklem Konsolen-Modul ---------- */
.media-card { position: relative; border-radius: var(--r-lg); overflow: hidden;
  height: 178px; transition: transform var(--dur-s) var(--ease); }

.console { position: absolute; left: 10px; right: 10px; bottom: 10px;

.green-band { background: var(--deep-green); color: var(--on-dark);
  border-radius: var(--r-lg); margin: 0 var(--pad); padding: 18px var(--s-5); }

.g-row { display: flex; align-items: center; gap: var(--s-3);

.g-row span.n { flex: 1; font-size: 16px; }

.bar { height: 3px; background: rgba(255, 255, 255, .22); border-radius: 9999px; margin: 12px 0 8px; }

/* ---------- Suche ---------- */
.search { display: flex; align-items: center; gap: var(--s-3); height: 50px;
  padding: 0 var(--s-4); border: 1px solid var(--hairline); border-radius: var(--r-xs);
  color: var(--muted); font-size: 16px; }
.search .ic { font-size: 19px; color: var(--ink); }

/* ---------- Übergroße Korallen-Chips als Taxonomie ---------- */
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.chips a { border-radius: var(--r-sm); padding: 7px 14px;

  transition: background var(--dur-s) var(--ease); }
.chips a[aria-current] { background: var(--coral); border-color: var(--coral);

/* ---------- Regelgetrennte Liste ohne Vorschaubilder ---------- */
.rule-list { border-top: 1px solid var(--hairline); }
.rule-list .row { display: flex; align-items: baseline; gap: var(--s-3);
  padding: 15px 0; border-bottom: 1px solid var(--hairline);

.rule-list .t { flex: 1; min-width: 0; }

.rule-list .sub { display: flex; align-items: center; gap: var(--s-2); margin-top: 7px; }
.kind { border: 1px solid var(--hairline); border-radius: var(--r-xl); padding: 2px 10px;

/* ---------- Schwebende Pillenleiste ---------- */
.tabbar { position: absolute; left: var(--pad); right: var(--pad); bottom: 18px; height: 58px;
