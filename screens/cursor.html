<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{

  --canvas:#f7f7f4; --canvas-soft:#fafaf7; --card:#ffffff; --strong:#e6e5e0;
  --hair:#e6e5e0; --hair-soft:#efeee8; --hair-strong:#cfcdc4;
  /* Schrift */
  --ink:#26251e; --body:#5a5852; --muted:#807d72; --muted-soft:#a09c92;
  /* Akzent */
  --primary:#f54e00; --primary-active:#d04200; --on-primary:#ffffff;
  /* Stufen-Pastelle */
  --st-think:#dfa88f; --st-grep:#9fc9a2; --st-read:#9fbbe0; --st-edit:#c0a8dd; --st-done:#c08532;
  /* Radien */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:9999px;
  /* Abstände */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
  --gutter:18px;
  /* Schrift-Familien */
  --sans:Inter,sans-serif; --mono:"DejaVu Sans Mono",monospace;
  /* Bewegung */
  --dur-s:120ms; --dur-m:220ms; --ease:cubic-bezier(.2,.8,.2,1);
}

/* ---------- Grundgerüst ---------- */
.phone{ background:var(--canvas); color:var(--ink); font-family:var(--sans); }
.sb{ color:var(--ink); }
.hi{ color:var(--ink); }
.pad{ padding:0 var(--gutter); }
.ic-l{ stroke-width:1.5; stroke-linecap:square; stroke-linejoin:miter; }

/* ---------- Typografie ---------- */
.dsp-lg{ font-size:29px; font-weight:400; line-height:1.15; letter-spacing:-.015em; }
.dsp-md{ font-size:25px; font-weight:400; line-height:1.2; letter-spacing:-.013em; }
.dsp-sm{ font-size:21px; font-weight:400; line-height:1.3; letter-spacing:-.005em; }
.ttl{ font-size:15px; font-weight:600; line-height:1.35; }
.txt{ font-size:15px; font-weight:400; line-height:1.5; color:var(--body); }
.cap{ font-size:13px; font-weight:400; line-height:1.4; color:var(--muted); }
.ucase{ font-size:11px; font-weight:600; line-height:1.4; letter-spacing:.088em; text-transform:uppercase; color:var(--muted); }
.mono{ font-family:var(--mono); font-size:12.5px; font-weight:400; line-height:1.5; letter-spacing:-.01em; }

/* ---------- Obere Reiter ---------- */
.top{ display:flex; align-items:center; gap:18px; padding:0 var(--gutter); height:50px;
  border-bottom:1px solid var(--hair); }
.mark{ width:17px; height:17px; border:1.5px solid var(--ink); border-radius:var(--r-xs); flex:none;
  position:relative; }
.mark::after{ content:""; position:absolute; inset:4px; background:var(--primary); border-radius:1px; }
.tabs{ display:flex; gap:16px; align-items:center; flex:1; }
.tab{ font-size:14px; font-weight:500; color:var(--muted); padding:15px 0 14px; position:relative; }
.tab.on{ color:var(--ink); font-weight:600; }
.tab.on::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); }
.ava{ width:27px; height:27px; border-radius:var(--r-pill); flex:none; border:1px solid var(--hair-strong); }

/* ---------- Befehlszeile unten ---------- */
.cmd{ position:absolute; left:var(--gutter); right:var(--gutter); bottom:26px; height:46px;
  background:var(--card); border:1px solid var(--hair-strong); border-radius:var(--r-md);
  display:flex; align-items:center; gap:10px; padding:0 7px 0 12px; z-index:20; }
.kbd{ font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--strong);
  border-radius:var(--r-xs); padding:3px 6px; flex:none; }
.cmd .ph{ flex:1; min-width:0; color:var(--muted-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.send{ width:32px; height:32px; border-radius:var(--r-sm); background:var(--primary); color:var(--on-primary);
  display:grid; place-items:center; font-size:15px; flex:none; transition:background var(--dur-s) var(--ease); }
.send:active{ background:var(--primary-active); }
.cmd-scrim{ position:absolute; left:0; right:0; bottom:0; height:88px; background:var(--canvas);
  border-top:1px solid var(--hair); z-index:10; }

/* ---------- Panels ---------- */
.panel{ background:var(--card); border:1px solid var(--hair); border-radius:var(--r-lg); padding:var(--s4); }
.inset{ background-color:var(--canvas-soft); border:1px solid var(--hair); border-radius:var(--r-md); }
.badge{ display:inline-block; background:var(--strong); color:var(--ink); border-radius:var(--r-pill);
  padding:3px 9px; font-size:10.5px; font-weight:600; letter-spacing:.088em; text-transform:uppercase; }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:40px; padding:0 18px;
  border-radius:var(--r-md); font-size:14px; font-weight:500; transition:background var(--dur-s) var(--ease); }
.btn-pri{ background:var(--primary); color:var(--on-primary); }
.btn-pri:active{ background:var(--primary-active); }
.btn-sec{ background:var(--card); color:var(--ink); border:1px solid var(--hair-strong); }
.btn-ic{ width:40px; height:40px; padding:0; background:var(--card); color:var(--ink);
  border:1px solid var(--hair-strong); border-radius:var(--r-md); display:grid; place-items:center; font-size:16px; }

/* ---------- Stufen-Zeitleiste ---------- */
.tl{ position:relative; padding-left:0; }
.tl-row{ display:flex; align-items:center; gap:10px; padding:9px 0; }
.tl-row + .tl-row{ border-top:1px solid var(--hair-soft); }
.pillst{ border-radius:var(--r-pill); padding:3px 8px; font-size:10px; font-weight:600; letter-spacing:.088em;
  text-transform:uppercase; color:var(--ink); flex:none; width:86px; text-align:center; }
.p-read{ background:var(--st-read); } .p-grep{ background:var(--st-grep); }
.p-think{ background:var(--st-think); } .p-edit{ background:var(--st-edit); }
.p-done{ background:var(--st-done); color:#fff; }
.tl-path{ flex:1; min-width:0; color:var(--body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tl-val{ color:var(--muted); flex:none; }

/* ---------- Tabelle ---------- */
.thead{ display:flex; align-items:center; gap:10px; padding:0 var(--gutter) 7px;
  border-bottom:1px solid var(--hair); }
.trow{ display:flex; align-items:center; gap:10px; padding:12px var(--gutter);
  border-bottom:1px solid var(--hair-soft); }
.tpic{ width:32px; height:32px; border-radius:var(--r-xs); flex:none; border:1px solid var(--hair);
  background-color:var(--canvas-soft); }
.tname{ flex:1; min-width:0; display:flex; flex-direction:column; }
.tname .n{ font-size:14.5px; font-weight:600; line-height:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tname .k{ font-family:var(--mono); font-size:11px; line-height:15px; color:var(--muted-soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tnum{ font-family:var(--mono); font-size:12.5px; color:var(--ink); width:56px; text-align:right; flex:none; }
.tdate{ font-family:var(--mono); font-size:12.5px; color:var(--muted); width:62px; text-align:right; flex:none; }
.th{ font-size:10.5px; font-weight:600; letter-spacing:.088em; text-transform:uppercase; color:var(--muted); }

/* ---------- Filter ---------- */
.filters{ display:flex; gap:6px; padding:0 var(--gutter); overflow:hidden; }
.fchip{ background:var(--card); border:1px solid var(--hair-strong); color:var(--body); border-radius:var(--r-sm);
  padding:6px 11px; font-size:13px; font-weight:500; white-space:nowrap; }
.fchip.on{ background:var(--ink); border-color:var(--ink); color:var(--canvas); font-weight:600; }

/* ---------- Detail ---------- */
.crumbs{ display:flex; align-items:center; gap:6px; padding:11px var(--gutter) 10px; color:var(--muted-soft); }
.crumbs b{ color:var(--ink); font-weight:400; }
.shot-pane{ padding:7px; }
.shot-pane .img{ height:166px; border-radius:var(--r-md); border:1px solid var(--hair); background-color:var(--canvas-soft); }
.subtabs{ display:flex; gap:18px; border-bottom:1px solid var(--hair); padding:0 var(--gutter); }
.subtab{ font-size:14px; font-weight:500; color:var(--muted); padding:9px 0; position:relative; display:flex; gap:6px; align-items:baseline; }
.subtab span{ font-family:var(--mono); font-size:11px; color:var(--muted-soft); }
.subtab.on{ color:var(--ink); font-weight:600; }
.subtab.on::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); }
.pgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.pgrid div{ aspect-ratio:1; border-radius:var(--r-xs); border:1px solid var(--hair); background-color:var(--canvas-soft); }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference){

  .stag > *:nth-child(2){ animation-delay:30ms; }

  .stag > *:nth-child(6){ animation-delay:150ms; }
  @keyframes in{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
}
