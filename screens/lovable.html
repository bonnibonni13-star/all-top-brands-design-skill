<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

/* ==========================================================================

   Werte aus references/lovable.md; App-Muster, Icons und Bewegung = Empfehlung

:root {
  /* Pergament statt Weiß – Fläche, Karte, Feld und Leiste teilen sich denselben Ton */
  --cream: #f7f4ed;
  --off-white: #fcfbf8;
  --charcoal: #1c1c1c;

  --ink-40: rgba(28, 28, 28, .4);
  --ink-04: rgba(28, 28, 28, .04);
  --ink-03: rgba(28, 28, 28, .03);
  --muted: #5f5f5d;
  --border: #eceae4;
  /* Tiefe: nur Inset-Kante und weicher Fokusschatten */
  --inset: rgba(255, 255, 255, .2) 0 .5px 0 0 inset, rgba(0, 0, 0, .2) 0 0 0 .5px inset, rgba(0, 0, 0, .05) 0 1px 2px 0;
  --focus: rgba(0, 0, 0, .1) 0 4px 12px;
  /* Schrift: humanistische Grotesk (Camera Plain Variable → Carlito) */
  --font: Carlito, "DejaVu Sans", sans-serif;
  /* Radien */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-card: 12px;
  --r-lg: 16px;
  --r-pill: 9999px;
  /* Abstände (8-px-Basis) */
  --s-1: 8px;
  --s-2: 10px;
  --s-3: 12px;
  --s-4: 16px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;
  /* Bewegung (Empfehlung) */
  --dur-s: 150ms;
  --dur-m: 260ms;
  --ease: cubic-bezier(.32, .72, 0, 1);
}

/* ---------- Grundlage ---------- */
.phone { background: var(--cream); color: var(--charcoal); font: 400 16px/1.5 var(--font); }
.phone .sb, .phone .hi { color: var(--charcoal); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow: hidden; }
.pad { padding-left: var(--s-6); padding-right: var(--s-6); }

/* ---------- Typografie ---------- */
.t-display { font-size: 36px; font-weight: 600; line-height: 1.08; letter-spacing: -.9px; }
.t-display-sm { font-size: 28px; font-weight: 600; line-height: 1.12; letter-spacing: -.6px; }
.t-card { font-size: 19px; font-weight: 400; line-height: 1.25; }
.t-body { font-size: 16px; font-weight: 400; line-height: 1.5; color: var(--ink-82); }

.btn-dark { background: var(--charcoal); color: var(--off-white); box-shadow: var(--inset); }
.btn-ghost { border: 1px solid var(--ink-40); color: var(--charcoal); }
.btn-cream { background: var(--cream); color: var(--charcoal); }
.btn:active { opacity: .8; }
.pill-btn { width: 38px; height: 38px; border-radius: var(--r-pill); background: var(--cream); color: var(--ink-82);
  border: 1px solid var(--border); display: grid; place-items: center; font-size: 19px; flex: none;
  transition: opacity var(--dur-s) var(--ease), box-shadow var(--dur-s) var(--ease); }
.pill-btn:active { opacity: .8; }
.pill-btn.dark { background: var(--charcoal); color: var(--off-white); border-color: var(--charcoal); box-shadow: var(--inset); }
.pill-btn.sm { width: 34px; height: 34px; font-size: 17px; }

/* ---------- Kopfleiste ---------- */

.avatar { width: 38px; height: 38px; border-radius: var(--r-pill); border: 1px solid var(--border); background-size: cover; flex: none; }

/* ---------- Signatur: großes Eingabefeld mit Pillen-Fußzeile ---------- */
.prompt { margin: var(--s-4) var(--s-6) 0; border: 1px solid var(--border); border-radius: var(--r-lg);

.stats { display: flex; gap: var(--s-6); padding: var(--s-6) var(--s-6) 0; }

.stats .num { font-size: 28px; font-weight: 600; letter-spacing: -.6px; line-height: 1.1; }

.nav-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: var(--cream);
  border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around;

.nav-item { display: grid; place-items: center; width: 46px; height: 40px; border-radius: var(--r-pill);

.nav-item .face { width: 22px; height: 22px; border-radius: var(--r-pill); background-size: cover; opacity: .55; filter: grayscale(1); }
.nav-item.is-active .face { opacity: 1; filter: none; }

/* ---------- Suche und Galerie ---------- */
.searchfield { display: flex; align-items: center; gap: var(--s-3); margin: var(--s-4) var(--s-6) 0;
  border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  color: var(--muted); font-size: 16px; }
.searchfield .spacer { flex: 1; }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); padding: var(--s-6) var(--s-6) 0; }
.g-card { border: 1px solid var(--border); border-radius: var(--r-card); padding: 7px; background: var(--cream);

/* ---------- Detail ---------- */
