<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }

<style>
:root{
  /* Farben aus der Markendatei */
  --black:#000000; --deep:#030303; --surf:#1a1a1a; --line-d:#27272a;
  --white:#ffffff; --near-white:#fefefe; --cloud:#e9ecf2;
  --line-l:#c9ccd1; --line-l2:#d0d4d4;
  --char:#404040; --slate:#767d88; --mid:#7d848e; --muted:#a7a7a7;
  /* Form: klein gerundet, nie Pill */
  --r-btn:4px; --r-img:8px; --r-box:16px;
  /* Raster 8 px */
  --pad:20px; --gap-s:6px; --gap-m:16px; --gap-l:28px;
  /* Bewegung */
  --dur-s:200ms; --dur-m:500ms; --ease:cubic-bezier(.25,.1,.25,1);
  --fs:Inter,"DejaVu Sans",sans-serif;
  --fd:"Inter Display",Inter,"DejaVu Sans",sans-serif;
}

/* ---------- Grundlagen ---------- */
.phone{background:var(--black);color:var(--white);font-family:var(--fs);
  font-size:16px;line-height:1.3;letter-spacing:-.16px;}
.ic-l{stroke-width:1.25;}

/* Versal-Label – der einzige Wegweiser */
.lbl{font:500 11px/1.3 var(--fs);text-transform:uppercase;letter-spacing:.5px;color:var(--mid);}
.lbl-14{font-size:14px;letter-spacing:.35px;font-weight:500;}
.on-dark .lbl,.lbl-on{color:rgba(255,255,255,.72);}

.meta{font:400 13px/1.3 var(--fs);letter-spacing:-.26px;color:var(--slate);}
.rule{height:1px;background:var(--line-l2);}
.rule-d{height:1px;background:var(--line-d);}

/* Buttons: 4 px, nie Pill */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;
  padding:0 16px;border-radius:var(--r-btn);font:600 14px/1 var(--fs);letter-spacing:-.16px;
  transition:opacity var(--dur-s) var(--ease);}
.btn:active{opacity:.7;}
.btn-light{background:var(--white);color:var(--black);}
.btn-dark{background:var(--black);color:var(--white);}
.btn-ghost{background:rgba(0,0,0,.35);color:var(--white);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-btn);box-shadow:inset 0 0 0 1px var(--line-l);color:var(--char);
  font-size:18px;transition:opacity var(--dur-s) var(--ease);}
.tlink{display:inline-flex;align-items:center;gap:6px;font:600 14px/1 var(--fs);letter-spacing:-.16px;}

/* ---------- Bühne (randlos, kein Radius) ---------- */
.stage-hero{position:relative;overflow:hidden;}
.stage-hero::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.58) 0,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 42%,rgba(0,0,0,.86) 100%);}
.hero-plain::before{background:linear-gradient(180deg,rgba(0,0,0,.62) 0,rgba(0,0,0,.34) 14%,rgba(0,0,0,0) 36%,rgba(0,0,0,0) 74%,rgba(0,0,0,.52) 100%);}
.stage-hero > *{position:relative;z-index:2;}
.stage-hero.grain{--grain:.1;}
.stage-hero.grain::after{z-index:1;}

/* Textnavigation oben – keine Leiste unten */
.topnav{display:flex;align-items:center;gap:22px;height:44px;padding:0 var(--pad);}
.mark{width:20px;height:20px;display:block;flex:none;color:var(--white);}
.nv{font:500 12px/1 var(--fs);text-transform:uppercase;letter-spacing:.35px;
  color:rgba(255,255,255,.62);padding-bottom:6px;border-bottom:1px solid transparent;
  transition:color var(--dur-s) var(--ease);}
.nv.is-on{color:var(--white);border-bottom-color:var(--white);}
.avatar{width:28px;height:28px;border-radius:50%;margin-left:auto;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);}

.hero-foot{position:absolute;left:var(--pad);right:var(--pad);bottom:22px;}
.hero-title{font:400 44px/1 var(--fd);letter-spacing:-1.2px;color:var(--white);margin-top:10px;}
.hero-meta{font:400 13px/1.3 var(--fs);letter-spacing:-.26px;color:rgba(255,255,255,.7);margin-top:10px;}
.scrub{height:2px;background:rgba(255,255,255,.28);margin-top:16px;}
.scrub span{display:block;height:2px;width:61%;background:var(--white);}
.times{display:flex;justify-content:space-between;margin-top:7px;}
.times span{font:450 11px/1.3 var(--fs);letter-spacing:.5px;color:rgba(255,255,255,.72);
  font-variant-numeric:tabular-nums;}
.btn-row{display:flex;gap:8px;margin-top:16px;}

/* ---------- Helles Leseband ---------- */
.band{background:var(--cloud);color:var(--char);padding:20px var(--pad) 18px;}
.band-w{background:var(--near-white);}
.ed-row{display:flex;gap:16px;margin-top:12px;}
.ed-img{width:96px;height:120px;border-radius:var(--r-img);flex:none;}
.ed-ttl{font:400 24px/1 var(--fd);letter-spacing:-.4px;color:var(--char);}
.ed-txt{display:flex;flex-direction:column;}
.ed-txt .meta{margin-top:10px;}
.ed-txt .tlink{margin-top:auto;color:var(--black);}

.src{display:flex;align-items:baseline;gap:8px;margin-top:14px;}
.src-names{font:400 13px/1.3 var(--fs);letter-spacing:-.26px;color:var(--char);margin-left:auto;}
.bar{height:2px;background:var(--line-l);margin-top:9px;}
.bar span{display:block;height:2px;width:69%;background:var(--char);}
.src-meta{font:450 11px/1.3 var(--fs);text-transform:uppercase;letter-spacing:.5px;
  color:var(--mid);margin-top:7px;}

/* ---------- Mosaik ---------- */
.sec-dark{background:var(--black);padding:18px 0 0 var(--pad);}
.strip{display:flex;gap:var(--gap-s);margin-top:12px;overflow:hidden;}
.strip-item{position:relative;width:128px;height:94px;flex:none;border-radius:var(--r-img);
  overflow:hidden;}
.strip-item::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.8) 100%);}
.strip-cap{position:absolute;left:10px;right:8px;bottom:9px;z-index:2;white-space:nowrap;
  font:500 10px/1.25 var(--fs);text-transform:uppercase;letter-spacing:.5px;color:var(--white);}

/* ---------- Bibliothek ---------- */
.head{padding:14px var(--pad) 0;}
.screen-title{font:400 40px/1 var(--fd);letter-spacing:-1px;color:var(--white);}
.field{display:flex;align-items:center;gap:10px;height:44px;margin:18px var(--pad) 0;
  padding:0 14px;background:var(--surf);border:1px solid var(--line-d);border-radius:var(--r-btn);
  transition:border-color var(--dur-s) var(--ease);}
.field i,.field .ic{font-size:18px;color:var(--mid);}
.field span{font:400 14px/1 var(--fs);letter-spacing:-.16px;color:var(--mid);}
.tabs{display:flex;gap:20px;margin:16px var(--pad) 0;border-bottom:1px solid var(--line-d);}
.tab{font:500 12px/1 var(--fs);text-transform:uppercase;letter-spacing:.35px;color:var(--slate);
  padding-bottom:11px;border-bottom:1px solid transparent;margin-bottom:-1px;
  transition:color var(--dur-s) var(--ease);}
.tab.is-on{color:var(--white);border-bottom-color:var(--white);}
.tabs-l{border-bottom-color:var(--line-l);}
.tabs-l .tab{color:var(--mid);}
.tabs-l .tab.is-on{color:var(--black);border-bottom-color:var(--black);}
.count{display:flex;justify-content:space-between;margin:13px var(--pad) 0;}

.mos{padding:0 var(--pad);margin-top:13px;display:flex;flex-direction:column;gap:var(--gap-s);}
.mos-row{display:flex;gap:var(--gap-s);}
.mos-col{display:flex;flex-direction:column;gap:var(--gap-s);}
.tile{position:relative;overflow:hidden;border-radius:var(--r-img);}
.tile::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.8) 100%);}
.tile-txt{position:absolute;left:12px;right:10px;bottom:11px;z-index:2;}
.tile-ttl{font:400 20px/1 var(--fd);letter-spacing:-.3px;color:var(--white);}
.tile-ttl.sm{font-size:16px;}
.tile-meta{font:450 11px/1.3 var(--fs);text-transform:uppercase;letter-spacing:.5px;
  color:rgba(255,255,255,.76);margin-top:6px;}
.dur{position:absolute;right:8px;top:8px;z-index:2;padding:3px 6px;border-radius:var(--r-btn);
  background:rgba(0,0,0,.55);font:450 11px/1.2 var(--fs);letter-spacing:.5px;
  text-transform:uppercase;color:var(--white);}

/* ---------- Detail ---------- */
.back{position:absolute;left:14px;top:52px;z-index:3;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--white);
  transition:opacity var(--dur-s) var(--ease);}
.frame-no{position:absolute;right:var(--pad);bottom:18px;z-index:3;
  font:450 11px/1.2 var(--fs);text-transform:uppercase;letter-spacing:.5px;
  color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums;}
.det-ttl{font:400 48px/1 var(--fd);letter-spacing:-1.2px;color:var(--char);margin-top:10px;}
.det-meta{margin-top:11px;}
.act{display:flex;gap:8px;margin-top:20px;}
.act .btn-dark{flex:1;}
.music{display:flex;align-items:center;gap:12px;margin-top:14px;}
.music-img{width:40px;height:40px;border-radius:var(--r-btn);flex:none;}
.music-ttl{font:400 16px/1.2 var(--fs);letter-spacing:-.16px;color:var(--char);margin-top:5px;}
.music .tlink{margin-left:auto;color:var(--black);font-size:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px;}
.photo{height:114px;border-radius:var(--r-btn);}

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion:no-preference){
  .stage-hero > *{animation:rw-rise var(--dur-m) var(--ease) both;}
  .hero-foot{animation-delay:120ms;}
  .mos-row,.strip-item{animation:rw-fade 600ms var(--ease) both;}
  .mos-row:nth-child(2){animation-delay:60ms;}
  .mos-row:nth-child(3){animation-delay:120ms;}
  .mos-row:nth-child(4){animation-delay:180ms;}
  @keyframes rw-rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @keyframes rw-fade{from{opacity:0;}to{opacity:1;}}
}
</style></head>
