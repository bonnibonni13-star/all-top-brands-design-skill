<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--grain, .18); mix-blend-mode: overlay;

<style>
:root{
  /* Farben – jeder Neutralton trägt Wärme */
  --canvas:#fffefb; --soft:#f8f4f0; --soft-press:#efe9e2;
  --ink:#201515; --ink-soft:#2f2a26; --body:#605d52; --body-mid:#939084; --mute:#c5c0b1;
  --orange:#ff4f00; --orange-press:#e64700; --on-ink:#fffefb;
  /* Form – ein Radius trägt fast alles */
  --r-sm:6px; --r-md:12px; --r-pill:9999px;
  /* Raster */
  --s-xxs:2px; --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-2xl:32px;
  --pad:20px;
  /* Schrift: Display = Degular-Ersatz, Text = Inter */
  --font:"Inter","DejaVu Sans",sans-serif;
  --font-display:"Inter Display","Inter",sans-serif;
  /* Bewegung */
  --dur-s:140ms; --dur-m:260ms; --ease:cubic-bezier(.2,.8,.2,1);
}

.phone{ font-family:var(--font); background:var(--canvas); color:var(--ink); }

/* ---------- Typografie ---------- */
.eyebrow{ font-family:var(--font-display); font-size:12.5px; font-weight:600; line-height:1;
  letter-spacing:1px; text-transform:uppercase; color:var(--ink); }
.eyebrow.sub{ color:var(--body-mid); }
.display{ font-family:var(--font-display); font-size:32px; font-weight:500; line-height:1.06;
  letter-spacing:-.4px; color:var(--ink); }
.title{ font-size:16px; font-weight:600; line-height:1.3; letter-spacing:-.2px; }
.body-md{ font-size:15px; font-weight:400; line-height:1.5; color:var(--body); }
.meta{ font-size:13px; font-weight:400; line-height:1.4; color:var(--body-mid); }

/* ---------- Icons: kräftige Phosphor-Bold-Linien ---------- */
.ic{ font-size:20px; }

/* ---------- Knöpfe: ein Radius, nie Pille, nie eckig ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:46px; padding:0 20px;
  border-radius:var(--r-md); font-size:15px; font-weight:600; line-height:1; letter-spacing:-.1px;
  transition:background-color var(--dur-s) var(--ease); }
.btn .ic{ font-size:18px; }
.btn-primary{ background:var(--orange); color:var(--on-ink); }
.btn-primary:active{ background:var(--orange-press); }
.btn-dark{ background:var(--ink); color:var(--on-ink); }
.btn-outline{ background:var(--canvas); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
.icon-btn{ width:44px; height:44px; flex:none; display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-md); background:var(--canvas); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink);
  transition:background-color var(--dur-s) var(--ease); }
.icon-btn:active{ background:var(--soft); }
.icon-btn.sm{ width:38px; height:38px; }
.icon-btn.sm .ic{ font-size:18px; }

/* ---------- Kopfleiste ---------- */
.topbar{ height:56px; display:flex; align-items:center; gap:10px; padding:0 var(--pad); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.mark{ width:30px; height:30px; flex:none; border-radius:var(--r-md); background:var(--ink);
  display:flex; align-items:center; justify-content:center; }
.mark i{ display:block; width:11px; height:11px; border-radius:50%;
  box-shadow:inset 0 0 0 3px var(--on-ink); }
.hello{ font-size:15px; font-weight:600; letter-spacing:-.2px; }
.hello span{ color:var(--body-mid); font-weight:400; }
.avatar{ width:34px; height:34px; flex:none; border-radius:var(--r-md); background-color:var(--soft);
  background-size:cover; background-position:50% 22%; box-shadow:inset 0 0 0 1px var(--mute); }

/* ---------- Inhaltsfläche ---------- */
.content{ padding:4px var(--pad) 0; }

/* ---------- Flächenkarte: cremeweich auf Creme, kein Schatten ---------- */
.card{ background:var(--soft); border-radius:var(--r-md); padding:12px; }
.card .pic{ height:116px; border-radius:var(--r-md); }
.card .foot{ display:flex; align-items:center; gap:12px; margin-top:12px; }
.card .foot .txt{ min-width:0; }
.card .foot .btn{ margin-left:auto; flex:none; }

/* ---------- Kaffee-Block: der Gegenpol ---------- */
.ink-band{ margin:14px calc(var(--pad) * -1) 0; background:var(--ink); color:var(--on-ink);
  padding:16px var(--pad) 16px; }
.ink-band .eyebrow{ color:rgba(255,254,251,.55); }
.stats{ display:flex; gap:10px; margin-top:12px; }
.stats div{ flex:1; }
.stats b{ display:block; font-family:var(--font-display); font-size:25px; font-weight:500; line-height:1.1;
  letter-spacing:-.6px; }
.stats span{ display:block; margin-top:3px; font-size:12px; color:rgba(255,254,251,.6); }
.bar{ height:4px; border-radius:var(--r-pill); background:rgba(255,254,251,.22); margin-top:12px; overflow:hidden; }
.bar i{ display:block; height:100%; width:69%; border-radius:var(--r-pill); background:var(--orange); }
.bar-note{ display:flex; justify-content:space-between; margin-top:8px; font-size:12px;
  color:rgba(255,254,251,.6); }

/* ---------- Ablaufkette: Schiene links, Knoten, Schritt-Blöcke rechts ---------- */
.chain{ position:relative; margin-top:10px; }
.chain::before{ content:""; position:absolute; left:13px; top:29px; bottom:29px; width:2px; background:var(--mute); }
.step{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.step:last-child{ margin-bottom:0; }
.rail{ width:28px; flex:none; display:flex; align-items:center; justify-content:center; }
.node{ width:12px; height:12px; border-radius:50%; background:var(--canvas);
  box-shadow:inset 0 0 0 2.5px var(--ink); }
.step.off .node{ box-shadow:inset 0 0 0 2.5px var(--mute); }
.box{ flex:1; min-width:0; display:flex; align-items:center; gap:10px; height:58px; padding:0 10px;
  background:var(--soft); border-radius:var(--r-md); }
.tile{ width:36px; height:36px; flex:none; border-radius:var(--r-md); background:var(--canvas);
  display:flex; align-items:center; justify-content:center; color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--mute); }
.tile .ic{ font-size:19px; }
.step .txt{ min-width:0; flex:1; }
.step .txt b{ display:block; font-size:14.5px; font-weight:600; letter-spacing:-.1px; }
.step .txt span{ display:block; font-size:12.5px; color:var(--body-mid); margin-top:2px; }
.switch{ width:44px; height:26px; flex:none; border-radius:var(--r-pill); background:var(--mute);
  position:relative; transition:background-color var(--dur-s) var(--ease); }
.switch i{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
  background:var(--canvas); transition:left var(--dur-s) var(--ease); }
.switch.on{ background:var(--orange); }
.switch.on i{ left:21px; }

/* ---------- Suchfeld: harter 1-px-Ink-Umriss, 6 px ---------- */
.search{ display:flex; align-items:center; gap:10px; height:48px; padding:0 14px; border-radius:var(--r-sm);
  background:var(--canvas); box-shadow:inset 0 0 0 1px var(--ink); color:var(--body-mid); font-size:15px; }
.search .ic{ font-size:19px; color:var(--ink); }

/* ---------- Segment-Umschalter: Umriss, aktiv kippt auf Kaffee ---------- */
.segment{ display:flex; height:38px; border-radius:var(--r-md); box-shadow:inset 0 0 0 1px var(--ink);
  overflow:hidden; }
.segment button{ flex:1; font-size:12.5px; font-weight:600; letter-spacing:-.1px; color:var(--ink);
  border-left:1px solid var(--ink); transition:background-color var(--dur-s) var(--ease); }
.segment button:first-child{ border-left:0; }
.segment button.on{ background:var(--ink); color:var(--on-ink); }

/* ---------- Liste: einzelne flache Blöcke, keine Trennlinien ---------- */
.group{ display:flex; align-items:baseline; gap:8px; margin:16px 0 10px; }
.group .n{ font-size:12px; font-weight:600; color:var(--body-mid); }
.row{ display:flex; align-items:center; gap:12px; padding:8px; background:var(--soft);
  border-radius:var(--r-md); margin-bottom:8px; }
.row .thumb{ width:52px; height:52px; flex:none; border-radius:var(--r-md); }
.row .txt{ min-width:0; flex:1; }
.row .txt b{ display:block; font-size:15px; font-weight:600; letter-spacing:-.2px; }
.row .txt span{ display:block; font-size:12.5px; color:var(--body-mid); margin-top:3px; }
.row .ic{ font-size:16px; color:var(--mute); flex:none; }
.pill{ flex:none; padding:4px 10px; border-radius:var(--r-pill); background:var(--canvas); color:var(--ink);
  font-size:11px; font-weight:700; letter-spacing:.2px; box-shadow:inset 0 0 0 1px var(--mute); }

/* ---------- Detail ---------- */
.hero-shot{ height:176px; border-radius:var(--r-md); margin-top:14px; }
.actions{ display:flex; gap:8px; margin-top:14px; }
.actions .btn-primary{ flex:1; }
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.grid .photo{ aspect-ratio:1/1; border-radius:var(--r-md); }

/* ---------- Kaffee-Leiste unten (Detail) ---------- */
.music-bar{ position:absolute; left:0; right:0; bottom:0; height:92px; background:var(--ink); color:var(--on-ink);
  display:flex; align-items:center; gap:12px; padding:0 var(--pad) 18px; }
.music-bar .eyebrow{ color:rgba(255,254,251,.55); }
.music-bar .txt{ flex:1; min-width:0; }
.music-bar .txt b{ display:block; margin-top:6px; font-size:15px; font-weight:600; letter-spacing:-.2px; }
.wave{ display:block; flex:none; opacity:.8; }
.play{ width:44px; height:44px; flex:none; border-radius:var(--r-md); background:var(--orange);
  color:var(--on-ink); display:flex; align-items:center; justify-content:center; }

/* ---------- Leiste unten: aktiv = Kaffee-Block ---------- */
.nav{ position:absolute; left:0; right:0; bottom:0; height:76px; background:var(--canvas);
  border-top:1px solid var(--mute); display:flex; align-items:flex-start; justify-content:space-between;
  padding:9px 16px 0; }
.nav a{ width:72px; height:50px; border-radius:var(--r-md); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; color:var(--body-mid);
  transition:background-color var(--dur-s) var(--ease); }
.nav a .ic{ font-size:20px; }
.nav a span{ font-size:11px; font-weight:600; letter-spacing:-.1px; }
.nav a.on{ background:var(--ink); color:var(--on-ink); }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference){
  .content > *, .nav{ animation:rise var(--dur-m) var(--ease) both; }
  .step{ animation:rise var(--dur-s) var(--ease) both; }
  .step:nth-child(2){ animation-delay:60ms; }
  .step:nth-child(3){ animation-delay:120ms; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
}
</style></head>
