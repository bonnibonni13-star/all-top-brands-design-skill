<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--grain, .18); mix-blend-mode: overlay;

<style>
:root{
  /* Farben */
  --ink:#000000; --body:#222222; --charcoal:#333333; --mute:#666666; --ash:#8a8a8a; --stone:#c4c4c4;
  --yellow:#ffed00; --yellow-deep:#e6d200; --on-yellow:#000000;
  --canvas:#ffffff; --soft:#f7f7f7; --dark:#000000; --deep:#111111;
  --hair:#f2f2f2; --hair-strong:#000000; --div-dark:rgba(255,255,255,.16);
  --on-dark:#ffffff; --on-dark-mute:rgba(255,255,255,.72);
  /* Form */
  --r-none:0px; --r-xs:2px; --r-sm:3px; --r-pill:46px;
  /* Raster */
  --pad:20px; --gap-xs:8px; --gap-sm:12px; --gap-md:16px; --gap-lg:20px; --gap-xl:24px;
  /* Schrift: NouvelR-Ersatz, schmal, nur 400/700 */
  --font:"TeX Gyre Heros Cn","Inter",sans-serif;
  /* Bewegung */
  --dur-s:160ms; --dur-m:320ms; --ease:cubic-bezier(.33,0,.2,1);
}

.phone{ font-family:var(--font); background:var(--canvas); color:var(--ink); }

/* ---------- Typografie ---------- */
.overline{ font-size:10px; font-weight:700; line-height:1.45; letter-spacing:.09em; text-transform:uppercase; }
.display{ font-size:40px; font-weight:700; line-height:.95; letter-spacing:0; text-transform:uppercase; }
.display-md{ font-size:32px; font-weight:700; line-height:.95; text-transform:uppercase; }
.h-lg{ font-size:20px; font-weight:700; line-height:.95; text-transform:uppercase; }
.h-sm{ font-size:16px; font-weight:700; line-height:1.05; }
.body-md{ font-size:15px; font-weight:400; line-height:1.4; }
.meta{ font-size:13px; font-weight:400; line-height:1.4; color:var(--mute); }
.meta-dark{ font-size:13px; font-weight:400; line-height:1.4; color:var(--on-dark-mute); }

/* ---------- Icons: eckig, 1,75 px ---------- */
.ic{ stroke-width:1.75; stroke-linecap:square; stroke-linejoin:miter; }
.sb .ic{ stroke-width:0; }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 24px;
  border-radius:var(--r-xs); font-size:14.4px; font-weight:700; letter-spacing:.144px; text-transform:uppercase;
  cursor:pointer; transition:background-color var(--dur-s) var(--ease), color var(--dur-s) var(--ease); }
.btn-primary{ background:var(--yellow); color:var(--on-yellow); }
.btn-primary:active{ background:var(--yellow-deep); }
.btn-outline-light{ background:var(--dark); color:var(--on-dark); box-shadow:inset 0 0 0 1px var(--on-dark); }
.btn-outline-dark{ background:var(--canvas); color:var(--ink); box-shadow:inset 0 0 0 1px var(--hair-strong); }
.sq{ width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; flex:none;
  border-radius:var(--r-xs); font-size:18px; background:var(--canvas); color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--hair-strong); transition:background-color var(--dur-s) var(--ease); }
.sq-dark{ background:var(--dark); color:var(--on-dark); box-shadow:inset 0 0 0 1px var(--on-dark); }

/* ---------- Pillen (nur Filter / Unterebene) ---------- */
.pill{ height:36px; padding:0 16px; display:inline-flex; align-items:center; flex:none;
  border-radius:var(--r-pill); font-size:13px; font-weight:400; line-height:1;
  background:var(--canvas); color:var(--ink); box-shadow:inset 0 0 0 1px var(--hair-strong);
  transition:background-color var(--dur-s) var(--ease), color var(--dur-s) var(--ease); }
.pill.is-on{ background:var(--ink); color:var(--canvas); font-weight:700; }
.pill-dark{ background:transparent; color:var(--on-dark); box-shadow:inset 0 0 0 1px var(--on-dark-mute); }
.pill-dark.is-on{ background:var(--canvas); color:var(--ink); font-weight:700; box-shadow:none; }
.badge-new{ position:absolute; left:0; bottom:0; background:var(--yellow); color:var(--on-yellow);
  font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:5px 12px; border-radius:var(--r-pill); margin:8px; }

/* ---------- Kopfleiste ---------- */
.appbar{ height:56px; display:flex; align-items:center; gap:12px; padding:0 var(--pad);
  background:var(--canvas); border-bottom:1px solid var(--hair-strong); }
.mark{ width:20px; height:20px; flex:none; background:var(--ink); position:relative; }
.mark::after{ content:""; position:absolute; inset:6px 6px 6px 6px; background:var(--canvas); }
.appbar-title{ font-size:18px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.appbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.avatar{ width:34px; height:34px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px var(--hair-strong); }

/* ---------- Schwarze Bühne ---------- */
.stage-band{ background:var(--dark); color:var(--on-dark); }
.stage-photo{ width:100%; height:168px; border-radius:var(--r-none); }
.stage-text{ padding:14px var(--pad) 16px; }
.stage-text .overline{ color:var(--on-dark-mute); }
.stage-text .display{ margin-top:6px; }
.stage-text .meta-dark{ margin-top:8px; }
.cta-row{ display:flex; gap:8px; margin-top:18px; }
.cta-row .btn{ flex:1 1 auto; padding:0 14px; }

/* ---------- Gelb-Band ---------- */
.yellow-band{ background:var(--yellow); color:var(--on-yellow); padding:14px var(--pad) 12px; }
.yb-top{ display:flex; align-items:flex-end; justify-content:space-between; }
.kpi{ font-size:28px; font-weight:700; line-height:.95; text-transform:uppercase; }
.kpi small{ font-size:14px; font-weight:400; text-transform:none; }
.kpi-pct{ font-size:14px; font-weight:700; letter-spacing:.06em; }
.bar{ height:8px; background:rgba(0,0,0,.18); margin-top:12px; }
.bar > span{ display:block; height:100%; background:var(--ink); }
.src-row{ display:flex; align-items:center; gap:14px; margin-top:12px; font-size:12px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; }
.src{ display:inline-flex; align-items:center; gap:5px; }
.src .ic{ font-size:14px; }

/* ---------- Abschnittskopf ---------- */
.sec-head{ display:flex; align-items:center; justify-content:space-between; padding:12px var(--pad) 10px;
  border-top:1px solid var(--hair-strong); }
.sec-head .ic{ font-size:18px; }

/* ---------- Foto-Kacheln (Text unter dem Bild) ---------- */
.tiles{ gap:12px; padding-left:var(--pad); }
.tile{ width:150px; flex:none; }
.tile-photo{ width:150px; height:108px; border-radius:var(--r-none); position:relative; }
.tile h4{ font-size:16px; font-weight:700; line-height:1.1; margin-top:10px; }
.tile p{ font-size:12px; font-weight:400; line-height:1.3; color:var(--mute); margin-top:4px; }

/* ---------- Suche ---------- */
.search{ display:flex; align-items:center; gap:10px; height:48px; margin:0 var(--pad);
  border-bottom:1px solid var(--hair-strong); border-radius:var(--r-none); }
.search .ic{ font-size:19px; }
.search span{ font-size:16px; font-weight:400; color:var(--ash); }

/* ---------- Filterreihe ---------- */
.filters{ gap:8px; padding:0 var(--pad); }

/* ---------- Katalogliste ---------- */
.list-head{ display:flex; align-items:center; justify-content:space-between; padding:9px var(--pad);
  background:var(--soft); border-top:1px solid var(--hair-strong); color:var(--charcoal); }
.row{ display:flex; align-items:center; gap:14px; height:68px; padding:0 var(--pad);
  border-bottom:1px solid var(--hair); transition:background-color var(--dur-s) var(--ease); }
.row-thumb{ width:54px; height:54px; flex:none; border-radius:var(--r-none); }
.row-txt{ min-width:0; flex:1 1 auto; }
.row-txt h4{ font-size:16px; font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-txt p{ font-size:12.5px; font-weight:400; line-height:1.3; color:var(--mute); margin-top:3px; }
.row-end{ display:flex; align-items:center; gap:10px; flex:none; }
.row-date{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--charcoal); }
.row-end .ic{ font-size:16px; color:var(--stone); }
.tag-new{ display:inline-block; vertical-align:2px; margin-left:6px; background:var(--yellow); color:var(--on-yellow);
  font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:3px 9px; border-radius:var(--r-pill); }

/* ---------- Tableiste unten (schwarz) ---------- */
.tabbar{ position:absolute; left:0; right:0; bottom:0; height:86px; background:var(--dark); color:var(--on-dark);
  display:flex; align-items:flex-start; padding:8px 8px 0; }
.tab{ flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--on-dark-mute);
  transition:color var(--dur-s) var(--ease); }
.tab i{ font-size:22px; }
.tab span{ font-size:10px; font-weight:400; letter-spacing:.09em; text-transform:uppercase; }
.tab-box{ width:42px; height:42px; display:flex; align-items:center; justify-content:center; border-radius:var(--r-xs); }
.tab.is-on{ color:var(--on-dark); }
.tab.is-on .tab-box{ background:var(--canvas); color:var(--ink); }
.tab.is-on span{ font-weight:700; }

/* ---------- Detail ---------- */
.hero{ position:absolute; inset:0 0 auto 0; height:300px; }
.hero-photo{ position:absolute; inset:0; }
.hero-bar{ position:absolute; left:var(--pad); right:var(--pad); top:56px; display:flex; align-items:center; }
.hero-bar .right{ margin-left:auto; display:flex; gap:8px; }
.count{ position:absolute; right:var(--pad); bottom:12px; background:var(--dark); color:var(--on-dark);
  font-size:11px; font-weight:700; letter-spacing:.06em; padding:5px 10px; border-radius:var(--r-xs); }
.detail-body{ position:absolute; left:0; right:0; top:300px; bottom:0; background:var(--dark); color:var(--on-dark); }
.detail-head{ padding:18px var(--pad) 0; }
.detail-head .overline{ color:var(--on-dark-mute); }
.detail-head .display{ margin-top:6px; }
.detail-head .meta-dark{ margin-top:8px; }
.detail-actions{ display:flex; gap:8px; padding:18px var(--pad) 0; }
.detail-actions .btn-primary{ flex:1 1 auto; padding:0 16px; }
.switch{ gap:8px; padding:18px var(--pad) 0; }
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:18px; }
.grid div{ aspect-ratio:1/1; border-radius:var(--r-none); }
.music{ position:absolute; left:0; right:0; bottom:0; height:96px; background:var(--dark);
  border-top:1px solid var(--div-dark); display:flex; align-items:center; gap:14px; padding:0 var(--pad) 18px; }
.swatch{ width:48px; height:48px; border-radius:50%; flex:none; box-shadow:0 0 0 1px var(--on-dark); }
.music-txt{ flex:1 1 auto; min-width:0; }
.music-txt .overline{ color:var(--on-dark-mute); }
.music-txt h4{ font-size:16px; font-weight:700; margin-top:4px; }

/* ---------- Bewegung (Endzustand ohne Animation sichtbar) ---------- */
@media (prefers-reduced-motion: no-preference){
  .stage-band,.yellow-band,.sec-head,.tiles,.list-head,.row,.detail-body{
    animation:band-in var(--dur-m) var(--ease) both; }
  .yellow-band{ animation-delay:60ms; } .sec-head{ animation-delay:120ms; } .tiles{ animation-delay:180ms; }
  @keyframes band-in{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
}
</style></head>
