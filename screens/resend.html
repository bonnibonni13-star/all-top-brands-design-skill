<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }

<style>
:root{
  /* Flächen */
  --canvas:#000000;
  --card:#0a0a0c;
  --elev:#101012;
  --deep:#06060a;
  /* Text */
  --ink:#fcfdff;
  --body:rgba(252,253,255,.86);
  --charcoal:rgba(252,253,255,.7);
  --mute:#a1a4a5;
  --ash:#888e90;
  --stone:#464a4d;
  --on-light:#000000;
  --on-light-mute:rgba(0,0,51,.7);
  /* Haarlinien statt Schatten */
  --hair:rgba(255,255,255,.06);
  --hair2:rgba(255,255,255,.14);
  --hair-soft:rgba(255,255,255,.04);
  /* Akzente – nur als Glühen */
  --orange:#ff801f; --orange-glow:rgba(255,89,0,.22);
  --blue:#3b9eff;   --blue-glow:rgba(0,117,255,.34);
  --green:#11ff99;  --green-glow:rgba(34,255,153,.18);
  --red:#ff2047;    --yellow:#ffc53d;
  /* Form */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
  /* Schrift */
  --serif:"Lora","TeX Gyre Pagella",serif;
  --ui:"Inter","DejaVu Sans",sans-serif;
  --mono:"DejaVu Sans Mono",monospace;
  /* Bewegung */
  --dur-s:140ms; --dur-m:240ms; --ease:cubic-bezier(.2,.6,.2,1);
}

/* ---------- Grundgerüst ---------- */
.phone{background:var(--canvas);font-family:var(--ui);color:var(--ink);}
.glow{position:absolute;left:0;right:0;top:0;height:380px;pointer-events:none;z-index:0;}
.glow-orange{background:radial-gradient(125% 100% at 50% -12%,var(--orange-glow),transparent 62%);}
.glow-blue{background:radial-gradient(125% 100% at 50% -12%,var(--blue-glow),transparent 62%);opacity:.5;}
.glow-green{background:radial-gradient(125% 100% at 50% -12%,var(--green-glow),transparent 62%);opacity:.85;}
.sheet{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;}
.scroll{flex:1;min-height:0;overflow:hidden;}
.pad{padding:0 24px;}

/* ---------- Kopfzeile ---------- */
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;}
.mark{width:18px;height:18px;border-radius:var(--r-full);border:1px solid var(--hair2);position:relative;}
.mark::after{content:"";position:absolute;inset:4px;border-radius:var(--r-full);background:var(--ink);opacity:.9;}
.iconbtn{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--mute);
  font-size:18px;transition:color var(--dur-s) var(--ease),background var(--dur-s) var(--ease);}
.iconbtn.ghost{background:var(--elev);border:1px solid var(--hair2);color:var(--body);}
.topbar-right{display:flex;align-items:center;gap:6px;}

/* ---------- Typografie ---------- */
.display{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;letter-spacing:-1.2px;color:var(--ink);}
.display-xl{font-family:var(--serif);font-weight:400;font-size:50px;line-height:1;letter-spacing:-1.6px;}
.display-sm{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1;letter-spacing:-1px;}
.sub{font-size:13px;line-height:1.5;color:var(--mute);}
.eyebrow{font-size:11px;line-height:1;letter-spacing:.6px;color:var(--ash);text-transform:uppercase;}
.rule{height:1px;background:var(--hair);}

/* ---------- Helle Karten-Insel (Signatur) ---------- */
.inset{margin-top:12px;background:var(--ink);border-radius:var(--r-lg);overflow:hidden;color:var(--on-light);}
.inset-img{height:78px;filter:saturate(.96);}
.inset-body{padding:12px 16px 14px;}
.inset-kicker{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--on-light-mute);}
.inset-title{font-family:var(--serif);font-size:22px;line-height:1.1;letter-spacing:-.5px;margin-top:6px;}
.inset-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.inset-meta{font-size:12px;color:var(--on-light-mute);font-variant-numeric:tabular-nums;}
.btn-dark{background:var(--canvas);color:var(--ink);font-size:13px;font-weight:500;border-radius:var(--r-md);
  padding:8px 14px;display:inline-flex;align-items:center;gap:7px;}

/* ---------- Code-Fenster (Signatur) ---------- */
.well{margin-top:16px;background:var(--deep);border:1px solid var(--hair2);border-radius:var(--r-lg);overflow:hidden;}
.well-chrome{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hair);}
.lights{display:flex;gap:5px;}
.lights i{width:8px;height:8px;border-radius:var(--r-full);display:block;}
.l-red{background:var(--red);} .l-yellow{background:var(--yellow);} .l-green{background:var(--green);}
.well-tab{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--card);border-radius:var(--r-sm);
  padding:4px 9px;border-bottom:1px solid var(--hair2);}
.well-tab.off{color:var(--stone);background:none;border-bottom-color:transparent;}
.well-store{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ash);font-variant-numeric:tabular-nums;}
.well-body{padding:10px 14px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--body);}
.log{display:flex;align-items:center;gap:8px;padding:2px 0;}
.dot{width:7px;height:7px;border-radius:var(--r-full);flex:none;}
.d-green{background:var(--green);} .d-yellow{background:var(--yellow);} .d-stone{background:var(--stone);}
.log-key{color:var(--mute);width:104px;flex:none;}
.log-val{color:var(--ink);flex:1;font-variant-numeric:tabular-nums;}
.log-state{color:var(--ash);}
.meter{margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);}
.meter-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--mute);}
.meter-row b{color:var(--ink);font-weight:400;}
.bar{height:2px;background:var(--hair2);margin-top:8px;}
.bar span{display:block;height:2px;background:var(--ink);width:69%;}

/* ---------- Gerahmte Bildtafeln ---------- */
.tile-row{margin-top:10px;gap:12px;padding-left:24px;}
.tile{width:94px;flex:none;}
.tile-img{width:94px;height:112px;border-radius:var(--r-lg);border:1px solid var(--hair2);
  filter:saturate(.92) brightness(.95);}
.tile-title{font-family:var(--serif);font-size:13px;line-height:1.2;margin-top:8px;color:var(--ink);height:32px;}
.tile-meta{font-family:var(--mono);font-size:10.5px;color:var(--ash);margin-top:2px;}

/* ---------- Leiste unten ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:74px;background:var(--canvas);
  border-top:1px solid var(--hair);display:flex;z-index:20;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  color:var(--mute);position:relative;padding-bottom:12px;}
.tab i.ic{font-size:20px;}
.tab span{font-size:10px;letter-spacing:.35px;}
.tab.on{color:var(--ink);}
.tab.on::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:24px;height:1px;background:var(--ink);}
.avatar{width:21px;height:21px;border-radius:var(--r-full);border:1px solid var(--hair2);}
.tab.on .avatar{border-color:var(--ink);}

/* ---------- Bibliothek ---------- */
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;padding-top:14px;}
.field{margin-top:18px;height:46px;background:var(--card);border:1px solid var(--hair2);border-radius:var(--r-md);
  display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mute);font-size:14px;}
.chips{display:flex;gap:7px;margin-top:14px;}
.chip{border-radius:var(--r-full);padding:6px 13px;font-size:13px;font-weight:500;letter-spacing:.35px;
  border:1px solid var(--hair2);color:var(--charcoal);transition:background var(--dur-s) var(--ease);}
.chip.on{background:var(--ink);color:var(--on-light);border-color:var(--ink);}
.list{margin-top:16px;}
.item{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--hair);}
.item:first-child{border-top:0;}
.item-img{width:40px;height:50px;border-radius:var(--r-md);border:1px solid var(--hair2);flex:none;
  filter:saturate(.92) brightness(.95);}
.item-txt{flex:1;min-width:0;}
.item-title{font-family:var(--serif);font-size:17px;line-height:1.2;letter-spacing:-.2px;color:var(--ink);}
.item-meta{font-size:12px;color:var(--mute);margin-top:5px;}
.item-val{font-family:var(--mono);font-size:11.5px;color:var(--ash);font-variant-numeric:tabular-nums;}
.item-chev{font-size:14px;color:var(--stone);}
.listhead{display:flex;align-items:center;justify-content:space-between;margin-top:20px;}

/* ---------- Detail ---------- */
.backrow{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 20px;}
.back{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13px;}
.metaline{font-size:13px;color:var(--mute);margin-top:12px;padding-bottom:14px;border-bottom:1px solid var(--hair);}
.plate{margin-top:18px;border-radius:var(--r-lg);border:1px solid var(--hair2);height:200px;
  filter:saturate(.94) brightness(.97);}
.actions{display:flex;gap:8px;margin-top:18px;}
.btn-white{background:var(--ink);color:var(--on-light);font-size:14px;font-weight:500;border-radius:var(--r-md);
  height:44px;padding:0 18px;display:flex;align-items:center;gap:9px;flex:1;justify-content:center;
  transition:background var(--dur-s) var(--ease);}
.btn-ghost{width:44px;height:44px;border-radius:var(--r-md);background:var(--elev);border:1px solid var(--hair2);
  display:grid;place-items:center;color:var(--body);font-size:18px;}
.tabs{display:flex;gap:20px;margin-top:22px;border-bottom:1px solid var(--hair);}
.ttab{padding-bottom:11px;font-size:14px;color:var(--mute);position:relative;}
.ttab b{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--stone);margin-left:6px;}
.ttab.on{color:var(--ink);}
.ttab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--ink);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;}
.grid div{height:136px;border-radius:var(--r-md);border:1px solid var(--hair);filter:saturate(.92) brightness(.95);}
.musicbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--card);border-top:1px solid var(--hair2);
  display:flex;align-items:center;gap:12px;padding:0 20px 14px;z-index:20;}
.musicbar .cover{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--hair2);flex:none;}
.music-kicker{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ash);}
.music-title{font-family:var(--serif);font-size:15px;margin-top:3px;color:var(--ink);}
.btn-outline{border:1px solid var(--hair2);border-radius:var(--r-md);height:34px;padding:0 13px;
  display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--body);}

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference){
  .rise{animation:rise var(--dur-m) var(--ease) both;}
  .rise:nth-of-type(2){animation-delay:40ms;}
  .rise:nth-of-type(3){animation-delay:80ms;}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .glow{animation:glowin 600ms var(--ease) both;}
  @keyframes glowin{from{opacity:0}to{opacity:1}}
}
