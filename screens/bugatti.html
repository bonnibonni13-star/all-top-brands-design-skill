<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Farben – reines Monochrom, Farbe kommt allein aus dem Foto */
  --weiss:#ffffff; --body:#cccccc; --body-stark:#e6e6e6;
  --gedaempft:#999999; --gedaempft-weich:#666666;
  --haar:#262626; --haar-stark:#3a3a3a;
  --canvas:#000000; --flaeche-weich:#0d0d0d; --flaeche-karte:#141414; --flaeche-hoch:#1f1f1f;
  --link:#c3d9f3;
  /* Radien: binär – 0 oder Pille */
  --r-0:0px; --r-pille:9999px;
  /* Abstände */
  --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:24px; --s-xl:40px; --s-xxl:64px;
  /* Dreiklang der Schriften */
  --f-display:"TeX Gyre Heros Cn","Liberation Sans",sans-serif;
  --f-text:"TeX Gyre Pagella","DejaVu Serif",serif;
  --f-mono:"DejaVu Sans Mono","Liberation Mono",monospace;
  /* Bewegung */
  --dur-s:400ms; --dur-m:700ms; --ease:cubic-bezier(.16,1,.3,1);
}

.phone{ background:var(--canvas); color:var(--weiss); font-family:var(--f-display); }
.sb{ font-family:var(--f-mono); font-weight:400; font-size:13px; letter-spacing:1px; }

.ic{ stroke-width:1.25; stroke-linecap:square; stroke-linejoin:miter; }

/* ---------- Kopfzeile ---------- */
.top-nav{ height:56px; display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; background:transparent; }
.nav-link{ font-family:var(--f-mono); font-size:12px; line-height:1.4; letter-spacing:2px;
  text-transform:uppercase; color:var(--weiss); }
.wordmark{ font-family:var(--f-display); font-size:14px; line-height:1; letter-spacing:6px;
  text-transform:uppercase; }
.nav-ic{ font-size:18px; display:flex; gap:18px; align-items:center; }

/* ---------- Foto-Bänder ---------- */
.band{ width:390px; }

.band-detail{ height:180px; background-position:50% 66%; }

/* ---------- Textblock unter dem Foto ---------- */
.block{ padding:20px 24px 0; }
.eyebrow{ font-family:var(--f-mono); font-size:11px; line-height:1.4; letter-spacing:2px;
  text-transform:uppercase; color:var(--gedaempft); }
.display-xl{ font-family:var(--f-display); font-size:40px; font-weight:400; line-height:1.1;
  letter-spacing:3px; text-transform:uppercase; margin-top:10px; }
.display-lg{ font-family:var(--f-display); font-size:34px; font-weight:400; line-height:1.1;
  letter-spacing:3px; text-transform:uppercase; margin-top:8px; }
.display-md{ font-family:var(--f-display); font-size:32px; font-weight:400; line-height:1.2;
  letter-spacing:2px; text-transform:uppercase; }
.lead{ font-family:var(--f-text); font-size:16px; line-height:1.5; color:var(--body); margin-top:10px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 32px;
  border:1px solid var(--weiss); border-radius:var(--r-pille); background:transparent; color:var(--weiss);

.btn:active{ opacity:.6; }
.btn-ic{ width:40px; height:40px; padding:0; border-radius:50%; font-size:17px; }

.specs{ display:flex; border-top:1px solid var(--haar); border-bottom:1px solid var(--haar);

  letter-spacing:1px; text-transform:uppercase; }
.spec span{ display:block; font-family:var(--f-mono); font-size:10px; line-height:1.4; letter-spacing:2px;
  text-transform:uppercase; color:var(--gedaempft); margin-top:5px; }

.rail-head{ padding:22px 24px 0; }
.rail{ display:flex; gap:16px; overflow:hidden; padding:14px 24px 0; }
.rail-card{ flex:none; width:228px; }
.rail-card .pic{ height:104px; }
.rail-card h3{ font-family:var(--f-display); font-size:18px; font-weight:400; line-height:1.3;

.rail-card p{ font-family:var(--f-mono); font-size:10px; line-height:1.4; letter-spacing:2px;
  text-transform:uppercase; color:var(--gedaempft); margin-top:5px; }

/* ---------- untere Navigation: Mono-Labels, aktiv mit Strich ---------- */
.tabs{ position:absolute; left:0; right:0; bottom:0; height:74px; display:flex;
  border-top:1px solid var(--haar); background:var(--canvas); z-index:20; }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding-top:16px; font-family:var(--f-mono); font-size:10px; line-height:1.4; letter-spacing:2px;
  text-transform:uppercase; color:var(--gedaempft); }
.tab i.rule{ display:block; width:22px; height:1px; background:transparent; margin-bottom:9px; }
.tab-on{ color:var(--weiss); }
.tab-on i.rule{ background:var(--weiss); }

/* ---------- Bibliothek ---------- */
.title-band{ padding:34px 24px 0; }
.suche{ margin:26px 24px 0; height:44px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--haar-stark); }
.suche span{ font-family:var(--f-text); font-size:16px; color:var(--gedaempft); }
.suche .ic{ font-size:17px; color:var(--gedaempft); }
.filter{ display:flex; gap:20px; padding:22px 24px 0; }
.filter span{ font-family:var(--f-mono); font-size:11px; line-height:1.4; letter-spacing:2px;
  text-transform:uppercase; color:var(--gedaempft); padding-bottom:6px; border-bottom:1px solid transparent; }
.filter .on{ color:var(--weiss); border-bottom-color:var(--weiss); }

.liste{ margin-top:16px; }
.zeile{ display:flex; align-items:center; gap:16px; padding:15px 24px; border-top:1px solid var(--haar); }
.zeile .pic{ width:72px; height:41px; flex:none; }
.zeile .txt{ flex:1; min-width:0; }
.zeile h3{ font-family:var(--f-display); font-size:18px; font-weight:400; line-height:1.3;
  letter-spacing:1.5px; text-transform:uppercase; }
.zeile p{ font-family:var(--f-mono); font-size:10px; line-height:1.4; letter-spacing:2px;
  text-transform:uppercase; color:var(--gedaempft); margin-top:4px; }
.zeile .ic{ font-size:16px; color:var(--gedaempft); flex:none; }

/* ---------- Detail ---------- */
.aktionen{ display:flex; align-items:center; gap:14px; padding:18px 24px 0; }
.umschalter{ display:flex; gap:20px; padding:20px 24px 0; }
.raster{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-top:14px; }
.raster div{ height:104px; }
.c1{ background-size:300%; background-position:14% 10%; }
.c2{ background-size:240%; background-position:50% 30%; }
.c3{ background-size:420%; background-position:42% 88%; }
.c4{ background-size:180%; background-position:80% 100%; }
.c5{ background-size:560%; background-position:62% 52%; }
.c6{ background-size:200%; background-position:92% 2%; }

.musik{ position:absolute; left:0; right:0; bottom:0; height:76px; z-index:20;
  display:flex; align-items:center; justify-content:space-between; padding:0 24px 16px;
  background:var(--canvas); border-top:1px solid var(--haar); }
.musik .lbl{ font-family:var(--f-mono); font-size:10px; letter-spacing:2px; text-transform:uppercase;
  color:var(--gedaempft); }
.musik .val{ font-family:var(--f-display); font-size:18px; line-height:1.3; letter-spacing:1.5px;
  text-transform:uppercase; margin-top:5px; }
.musik .aendern{ font-family:var(--f-mono); font-size:10px; letter-spacing:2px; text-transform:uppercase;
  color:var(--weiss); border-bottom:1px solid var(--weiss); padding-bottom:3px; }

@media (prefers-reduced-motion: no-preference){
  .block, .specs, .rail-head, .rail, .title-band, .liste, .aktionen{

  .specs{ animation-delay:120ms; }
  .rail-head, .rail{ animation-delay:240ms; }
  @keyframes auf{ from{ opacity:0; } to{ opacity:1; } }
}
