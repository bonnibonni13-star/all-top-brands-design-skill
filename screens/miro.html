<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }

<style>
/* =====================================================================
   Musterscreens im Stil von Miro – weiße Leinwand, schwarze Pillen,
   Pastellkarten mit 28 px Radius und das Produkt selbst als Bild:
   gepunktete Leinwand, leicht gedrehte Zettel, Auswahlrahmen und ein
   fremder Zeiger mit Namensschild. Werte aus der Markendatei;
   App-Muster (schwebende Pillenleiste, Leinwand als Inhaltsfläche)
   sind als Empfehlung aus den Komponenten abgeleitet.
   ===================================================================== */
:root {
  /* Farben (Markendatei) */
  --ink: #1c1c1e;
  --ink-deep: #050038;
  --charcoal: #2c2c34;
  --slate: #555a6a;
  --steel: #6b6f7e;
  --stone: #8e91a0;
  --muted: #a5a8b5;
  --canvas: #ffffff;
  --surface: #f7f8fa;
  --surface-soft: #fafbfc;
  --hairline: #e0e2e8;
  --hairline-soft: #eef0f3;
  --hairline-strong: #c7cad5;
  --yellow: #ffd02f;
  --yellow-surface: #fff8e0;
  --yellow-dark: #746019;
  --coral: #ffc6c6;
  --coral-dark: #600000;
  --teal: #c3faf5;
  --moss: #187574;
  --rose: #fde0f0;
  --orange: #ffe6cd;
  --blue: #4262ff;
  --lavender: #f5f3ff;

  /* Schrift: Roobert PRO → Poppins (geometrisch, leicht rund) */
  --font: Poppins, "DejaVu Sans", sans-serif;

  /* Radien */
  --r-6: 6px; --r-8: 8px; --r-12: 12px; --r-16: 16px; --r-20: 20px;
  --r-28: 28px; --r-32: 32px; --r-full: 9999px;

  /* Abstände */
  --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-20: 20px;
  --s-24: 24px; --s-32: 32px;
  --gutter: 20px;

  /* Schatten mit blauem Unterton */
  --sh-1: rgba(5, 0, 56, .04) 0 1px 2px 0;
  --sh-2: rgba(5, 0, 56, .06) 0 4px 12px 0;
  --sh-3: rgba(5, 0, 56, .08) 0 12px 32px -4px;
  --sh-4: rgba(5, 0, 56, .12) 0 16px 48px -8px;

  /* Bewegung (Empfehlung – Datei nennt nur 150–200 ms) */
  --dur-s: 180ms;
  --dur-m: 240ms;
  --ease: cubic-bezier(.2, .8, .3, 1);
}

/* ---------- Grundlagen ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 400 16px/1.5 var(--font); }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }
.sb, .hi { color: var(--ink); }
.ic { stroke-width: 2; }

/* Gepunktete Leinwand – ersetzt bei dieser Marke jeden Verlauf */
.board-bg { background-color: var(--surface-soft);
  background-image: radial-gradient(circle, #d6d9e3 1.2px, transparent 1.3px);
  background-size: 18px 18px; background-position: 0 0; }

/* ---------- Kopf ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 var(--gutter); height: 48px; }
.mark { width: 26px; height: 26px; border-radius: var(--r-8); background: var(--yellow); }
.top-right { display: flex; align-items: center; gap: 10px; }
.circ { width: 36px; height: 36px; border-radius: var(--r-full); border: 1px solid var(--hairline);
  background: var(--canvas); display: grid; place-items: center; font-size: 19px; color: var(--ink); flex: none;
  transition: transform var(--dur-s) var(--ease); }
.circ:active { transform: scale(.95); }
.avatar { width: 36px; height: 36px; border-radius: var(--r-full); background-color: var(--surface); flex: none; }

/* ---------- Titel ---------- */
.lede { padding: 10px var(--gutter) 0; }
.lede h1 { font: 500 32px/1.05 var(--font); letter-spacing: -1px; }
.lede h1.page { font-size: 28px; letter-spacing: -.6px; }
.lede p { margin-top: 8px; font: 400 14px/1.5 var(--font); color: var(--slate); }

/* ---------- Buttons ---------- */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--r-full); font: 500 14px/1.3 var(--font); padding: 12px 24px;
  transition: background var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); }
.pill:active { transform: scale(.97); }
.pill.dark { background: var(--ink); color: #fff; }
.pill.dark:active { background: var(--charcoal); }
.pill.outline { border: 1px solid var(--hairline-strong); color: var(--ink); }
.pill.sm { padding: 9px 16px; font-size: 13px; }

/* ---------- Tags ---------- */
.tag { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-full);
  font: 600 13px/1.4 var(--font); padding: 4px 10px; }
.tag.yellow { background: var(--yellow-surface); color: var(--yellow-dark); }
.tag.purple { background: var(--lavender); color: var(--blue); }
.tag.coral { background: var(--coral); color: var(--coral-dark); }
.tag.teal { background: var(--teal); color: var(--moss); }

/* ---------- Board-Mockup (Signatur) ---------- */
.mockup { margin: 12px var(--gutter) 0; background: var(--canvas); border: 1px solid var(--hairline-soft);
  border-radius: var(--r-16); box-shadow: var(--sh-3); overflow: hidden; }
.mockup .canvas { position: relative; height: 150px; }
.sticky { position: absolute; border-radius: var(--r-6); box-shadow: var(--sh-2);
  font: 500 11px/1.3 var(--font); color: var(--ink); padding: 8px; }
.sel-wrap { position: absolute; }
.note-tile { position: absolute; inset: 0; border-radius: var(--r-8); border: 4px solid #fff; box-shadow: var(--sh-2);
  background-color: #fff; overflow: hidden; }
.note-tile > span { display: block; height: 100%; }
.sel { position: absolute; inset: -7px; border: 1.5px dashed var(--blue); border-radius: var(--r-12); }
.sel i { position: absolute; width: 7px; height: 7px; background: #fff; border: 1.5px solid var(--blue); border-radius: 2px; }
.sel i:nth-child(1) { left: -4px; top: -4px; } .sel i:nth-child(2) { right: -4px; top: -4px; }
.sel i:nth-child(3) { left: -4px; bottom: -4px; } .sel i:nth-child(4) { right: -4px; bottom: -4px; }
.cursor { position: absolute; display: flex; align-items: flex-start; gap: 2px; }
.cursor .name { background: var(--blue); color: #fff; font: 500 10px/1 var(--font);
  padding: 4px 7px; border-radius: var(--r-full); margin-top: 10px; }
.mockup .foot { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--hairline-soft); }
.mockup .foot .t { font: 500 16px/1.3 var(--font); }
.mockup .foot .m { font: 400 13px/1.3 var(--font); color: var(--steel); margin-top: 1px; }
.mockup .foot .grow { flex: 1; min-width: 0; }

/* ---------- Abschnitte ---------- */
.sec-head { display: flex; align-items: center; justify-content: space-between; padding: 16px var(--gutter) 0; }
.sec-head h2 { font: 500 18px/1.4 var(--font); }
.sec-head .more { font: 500 13px/1.4 var(--font); color: var(--blue); }

/* Pastellkacheln */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px var(--gutter) 0; }
.tile { border-radius: var(--r-28); padding: 12px 12px 14px; }
.tile .ic { font-size: 20px; }
.tile .t { font: 500 13px/1.25 var(--font); margin-top: 10px; }
.tile .v { font: 400 12px/1.3 var(--font); opacity: .66; margin-top: 2px; }
.tile.yellow { background: var(--yellow); }
.tile.teal { background: var(--teal); }
.tile.coral { background: var(--coral); }

/* Vorlagenkarten-Reihe */
.strip { gap: 12px; padding: 10px 0 0 var(--gutter); }
.tcard { flex: none; width: 152px; background: var(--canvas); border: 1px solid var(--hairline);
  border-radius: var(--r-16); padding: 10px; }
.tcard .pic { height: 82px; border-radius: var(--r-12); background-color: var(--surface); }
.tcard .t { font: 500 14px/1.3 var(--font); margin-top: 10px; }
.tcard .m { font: 400 12px/1.3 var(--font); color: var(--steel); margin-top: 2px; }

/* ---------- Bibliothek: Kartenraster auf der Leinwand ---------- */
.sheet { position: absolute; left: 0; right: 0; top: 196px; bottom: 0; padding: 14px var(--gutter) 0; overflow: hidden; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bcard { border-radius: var(--r-20); background: var(--canvas); border: 1px solid var(--hairline-soft);
  box-shadow: var(--sh-2); padding: 8px 8px 12px; }
.bcard .pic { height: 94px; border-radius: var(--r-12); background-color: var(--surface); }
.bcard .t { font: 500 15px/1.3 var(--font); margin: 10px 4px 0; }
.bcard .m { font: 400 12px/1.35 var(--font); color: var(--steel); margin: 2px 4px 0; }
.bcard .tag { margin: 8px 4px 0; font-size: 11px; padding: 3px 9px; }
.bcard.pastel-rose { background: var(--rose); border-color: transparent; }
.bcard.pastel-teal { background: var(--teal); border-color: transparent; }
.bcard.pastel-orange { background: var(--orange); border-color: transparent; }

.head-fixed { position: relative; z-index: 5; background: var(--canvas); }
.searchbar { display: flex; align-items: center; gap: 10px; height: 40px; margin: 12px var(--gutter) 0;
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-8);
  padding: 0 12px; font: 400 14px/1 var(--font); color: var(--steel); }
.tabs { gap: 8px; padding: 12px var(--gutter) 14px; }
.ptab { flex: none; border-radius: var(--r-full); border: 1px solid var(--hairline);
  background: var(--canvas); color: var(--steel); font: 500 14px/1 var(--font); padding: 9px 16px; }
.ptab.on { background: var(--ink); border-color: var(--ink); color: #fff; }

/* ---------- Schwebende Pillenleiste ---------- */
.dock { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px; height: 60px; padding: 0 8px;
  background: var(--ink); border-radius: var(--r-full); box-shadow: var(--sh-4); z-index: 20; }
.dock a { width: 48px; height: 44px; display: grid; place-items: center; border-radius: var(--r-full);
  color: #fff; font-size: 21px; }
.dock a.on { background: #fff; color: var(--ink); width: 44px; height: 44px; }

/* ---------- Detail ---------- */
.shot-frame { margin: 14px var(--gutter) 0; height: 176px; border-radius: var(--r-16);
  box-shadow: var(--sh-3); position: relative; }
.chips { display: flex; gap: 8px; padding: 14px var(--gutter) 0; }
.actions { display: flex; align-items: center; gap: 8px; padding: 16px var(--gutter) 0; }
.actions .pill.dark { flex: 1; padding: 14px 20px; font-size: 15px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px var(--gutter) 0; }
.grid3 .photo { height: 86px; border-radius: var(--r-12); background-color: var(--surface); }
.music { display: flex; align-items: center; gap: 12px; margin: 14px var(--gutter) 0;
  background: var(--yellow); border-radius: var(--r-28); padding: 14px 16px; }
.music .t { font: 500 15px/1.3 var(--font); }
.music .m { font: 400 13px/1.3 var(--font); color: rgba(28,28,30,.7); margin-top: 1px; }
.music .play { width: 44px; height: 44px; border-radius: var(--r-full); background: var(--ink);
  color: #fff; display: grid; place-items: center; font-size: 18px; flex: none; }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference) {
  .mockup, .tile, .tcard, .bcard, .shot-frame, .music { animation: pop var(--dur-m) var(--ease) both; }
  .tile:nth-child(2) { animation-delay: 35ms; }
  .tile:nth-child(3) { animation-delay: 70ms; }
  .sticky, .cursor { animation: pop var(--dur-s) var(--ease) both; animation-delay: 160ms; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
}
</style></head>
