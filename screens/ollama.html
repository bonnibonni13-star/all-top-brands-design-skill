<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<title>Musterscreens Ollama</title>
<style>
:root{
  /* Farben – Schwarz, Weiß, drei Grau */
  --ink:#000000; --ink-deep:#090909; --charcoal:#525252; --body:#737373; --mute:#a3a3a3;
  --canvas:#ffffff; --soft:#fafafa; --dark:#171717; --hairline:#e5e5e5; --hairline-strong:#d4d4d4;
  --on-dark:#ffffff; --on-dark-mute:rgba(255,255,255,.7);
  --term-red:#ff5f56; --term-yellow:#ffbd2e; --term-green:#27c93f;
  /* Form: nur Pille, 12 px Karte, 6 px Inline-Code */
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:9999px;
  /* Abstand */
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-xxl:32px; --s-sec:48px;
  --pad:24px;
  /* Bewegung */
  --dur-s:120ms; --dur-m:180ms; --ease:cubic-bezier(.4,0,.2,1);
}

.phone{background:var(--canvas); color:var(--ink);
  font-family:Inter,"DejaVu Sans",sans-serif; font-weight:400; letter-spacing:0}
.sb{color:var(--ink)}
.hi{color:var(--ink)}
.col{padding:0 var(--pad)}

/* ---------- Schrift ---------- */
.d-xl{font-family:"TeX Gyre Adventor",Poppins,sans-serif; font-size:33px; font-weight:400; line-height:1.08}
.d-lg{font-family:"TeX Gyre Adventor",Poppins,sans-serif; font-size:30px; font-weight:400; line-height:1.2}
.h-lg{font-family:"TeX Gyre Adventor",Poppins,sans-serif; font-size:22px; font-weight:700; line-height:1.33}
.h-md{font-size:20px; font-weight:500; line-height:1.4}
.b-md{font-size:16px; font-weight:400; line-height:1.5}
.b-strong{font-size:16px; font-weight:500; line-height:1.5}
.b-sm{font-size:14px; font-weight:400; line-height:1.43}
.b-sm-strong{font-size:14px; font-weight:500; line-height:1.43}
.cap{font-size:12px; font-weight:400; line-height:1.33}
.grey{color:var(--body)}
.mono{font-family:"DejaVu Sans Mono","Liberation Mono",monospace; font-size:13px; line-height:1.5}

/* ---------- Kopfleiste ---------- */
.nav{height:56px; display:flex; align-items:center; gap:4px; padding:0 var(--pad)}
.nav .mark{width:26px; height:26px; margin-right:10px; color:var(--ink)}
.nav a{font-size:14px; font-weight:400; line-height:1; color:var(--body); padding:9px 12px;
  border-radius:var(--r-full); transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease)}
.nav a.on{background:var(--soft); color:var(--ink); font-weight:500}
.nav .avatar{width:28px; height:28px; border-radius:var(--r-full); margin-left:auto}

/* ---------- Pillen ---------- */
.pill{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:var(--r-full);
  height:36px; padding:0 20px; font-size:14px; font-weight:500; line-height:1;
  transition:background var(--dur-s) var(--ease), border-color var(--dur-s) var(--ease)}
.pill-ink{background:var(--ink); color:#fff}
.pill-ink:active{background:var(--ink-deep)}
.pill-sec{background:var(--canvas); color:var(--ink); border:1px solid var(--hairline-strong)}
.pill-white{background:#fff; color:var(--ink)}
.pill-icon{width:36px; height:36px; padding:0; font-size:17px}

/* ---------- Mono-Pille (Signatur) ---------- */
.snippet{display:flex; align-items:center; gap:12px; background:var(--soft); border-radius:var(--r-full);
  height:48px; padding:0 8px 0 20px; color:var(--ink)}
.snippet .mono{flex:1; min-width:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.snippet .copy{width:32px; height:32px; border-radius:var(--r-full); display:grid; place-items:center;
  font-size:16px; color:var(--charcoal); flex:none}

/* ---------- Karten ---------- */
.card{border:1px solid var(--hairline); border-radius:var(--r-lg); background:var(--canvas); padding:18px}
.card-dark{background:var(--dark); border-color:var(--dark); color:var(--on-dark)}
.card-dark .mono{color:var(--mute)}
.card-row{display:flex; gap:14px; align-items:center}
.card-row .thumb{width:60px; height:60px; border-radius:var(--r-lg); flex:none}

/* ---------- Terminal-Karte ---------- */
.term{padding:16px}
.dots{display:flex; gap:6px}
.dots i{width:11px; height:11px; border-radius:var(--r-full); display:block}
.term-out{margin-top:14px}
.term-out p{display:flex; font-size:13px; line-height:1.5;
  font-family:"DejaVu Sans Mono","Liberation Mono",monospace}
.term-out p span:first-child{width:118px; flex:none}
.term-out p span:nth-child(2){width:92px; flex:none; color:var(--body)}
.term-out p span:last-child{flex:1; text-align:right}
.term-out .cmt{color:var(--mute); display:block}

/* ---------- Haarlinien-Liste ---------- */
.rows{margin-top:8px}
.row{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--hairline)}
.row .thumb{width:48px; height:48px; border-radius:var(--r-lg); flex:none}
.row .t{flex:1; min-width:0}
.row .t b{display:block; font-size:16px; font-weight:500; line-height:1.4;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .t span{display:block; font-size:14px; font-weight:400; line-height:1.43; color:var(--body); margin-top:1px}
.row .n{font-family:"DejaVu Sans Mono","Liberation Mono",monospace; font-size:13px; color:var(--body); flex:none}

/* ---------- Befehls-Chips ---------- */
.chips{display:flex; gap:8px; padding:0 var(--pad)}
.chip{font-family:"DejaVu Sans Mono","Liberation Mono",monospace; font-size:13px; line-height:1.43;
  background:var(--soft); color:var(--ink); border-radius:var(--r-full); padding:7px 11px;
  transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease)}
.chip.on{background:var(--ink); color:#fff}

/* ---------- Häkchenliste ---------- */
.checks li{display:flex; align-items:flex-start; gap:10px; font-size:14px; line-height:1.43;
  color:var(--charcoal); margin-top:9px}
.checks li .ic{font-size:15px; color:var(--ink); margin-top:1px; flex:none}

/* ---------- Detail ---------- */
.shotimg{width:100%; height:190px; border-radius:var(--r-lg); border:1px solid var(--hairline)}
.actions{display:flex; align-items:center; gap:8px}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 var(--pad)}
.grid i{display:block; aspect-ratio:1/1; border-radius:var(--r-lg)}

/* ---------- Bewegung: nur Farbwechsel und ein ruhiges Einblenden ---------- */
@media (prefers-reduced-motion: no-preference){
  .col, .chips, .grid{animation:fade 150ms var(--ease) both}
  @keyframes fade{from{opacity:0} to{opacity:1}}
}
</style></head>
