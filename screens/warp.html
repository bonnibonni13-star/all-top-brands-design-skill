<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Nur zwei Flächen – warm, nie schwarz */
  --canvas:#2b2622; --soft:#383330; --hair:#3f3a36;
  /* Text */
  --ink:#f7f5f0; --body-strong:#dad2c1; --body:#c9c0ad; --mute:#aea69c;
  --on-primary:#2b2622;
  /* Radien – fast rechteckig */
  --r-xxs:1px; --r-xs:2px; --r-sm:3px; --r-md:4px; --r-lg:6px; --r-pill:9999px;
  /* Abstände (4-px-Basis) */
  --s-xxs:2px; --s-xs:4px; --s-sm:8px; --s-md:10px; --s-lg:16px; --s-xl:24px; --s-2xl:32px;
  --gut:16px;
  /* Schriften */
  --sans:Inter,"DejaVu Sans",sans-serif;
  --mono:"DejaVu Sans Mono","Liberation Mono",monospace;
  --serif:"TeX Gyre Termes","DejaVu Serif",serif;
  /* Bewegung */
  --dur-s:150ms; --dur-m:240ms; --ease:cubic-bezier(.4,0,.2,1);
  /* Bildton – zieht jedes Foto in die warme Palette */
  --warm:sepia(.5) saturate(.62) contrast(1.03) brightness(.93);
}

.phone{background:var(--canvas);color:var(--body);font-family:var(--sans)}
.sb{color:var(--ink)}
.hi{color:var(--mute)}
.scroll{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column}
.scroll > *{flex:none}

/* ---------- Mono- und Serif-Stimme ---------- */
.mono{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--body);letter-spacing:0}
.mono.dim{color:var(--mute)}
.eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.serif{font-family:var(--serif);font-style:italic;color:var(--body-strong)}

/* ---------- Signatur: Terminal-Reiter oben ---------- */
.tabs{display:flex;border-bottom:1px solid var(--hair);flex:none}
.tab{flex:1;position:relative;height:38px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--mono);font-size:12px;color:var(--mute);
  border-right:1px solid var(--hair);
  transition:background var(--dur-s) var(--ease),color var(--dur-s) var(--ease)}
.tab:last-child{border-right:0}
.tab.is-on{background:var(--soft);color:var(--ink)}
.tab.is-on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ink)}
.tab .ava{width:13px;height:13px;border-radius:var(--r-pill);background-color:var(--soft);filter:var(--warm)}

/* ---------- Kopfblock ---------- */
.head{padding:16px var(--gut) 0}
.head h1{font-size:34px;font-weight:400;line-height:1.08;letter-spacing:-1.2px;color:var(--ink);margin-top:10px}
.head h1.sm{font-size:28px;letter-spacing:-.8px}
.head .path{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- Abschnittskopf ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:0 var(--gut);margin:20px 0 9px}
.meter{height:2px;background:var(--hair);margin:0 var(--gut) 12px}
.meter i{display:block;height:100%;width:69%;background:var(--body-strong)}

/* ---------- Mockup-Karte: Befehl und Ausgabe ---------- */
.mock{margin:0 var(--gut);background:var(--soft);border:1px solid var(--hair);border-radius:var(--r-md);overflow:hidden}
.mock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 10px;border-bottom:1px solid var(--hair);background:var(--canvas)}
.mock-head .ch{color:var(--ink)}
.mock .pic{height:132px;filter:var(--warm);border-bottom:1px solid var(--hair)}
.mock-txt{display:flex;align-items:flex-end;gap:12px;padding:11px 12px}
.mock-txt .col{flex:1;min-width:0}
.mock-txt .serif{font-size:19px;line-height:1.2}
.mock-txt h2{font-size:21px;font-weight:500;letter-spacing:-.4px;color:var(--ink);margin:2px 0 4px}

/* ---------- Knöpfe ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;
  background:var(--ink);color:var(--on-primary);border-radius:var(--r-sm);
  font-size:13.5px;font-weight:500;letter-spacing:0;flex:none;
  transition:opacity var(--dur-s) var(--ease)}
.btn-lg{height:38px;font-size:14px;padding:0 18px}
.btn-ghost{background:none;color:var(--ink);border:1px solid var(--hair)}
.circ{width:34px;height:34px;flex:none;border-radius:var(--r-pill);border:1px solid var(--hair);
  display:grid;place-items:center;font-size:17px;color:var(--body-strong);background:var(--canvas);
  transition:background var(--dur-s) var(--ease)}
.circ-sm{width:28px;height:28px;font-size:14px}

/* ---------- 3-up-Kacheln (Quellen) ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 var(--gut)}
.tile{background:var(--soft);border:1px solid var(--hair);border-radius:var(--r-md);
  padding:11px 10px;display:flex;flex-direction:column;gap:7px}
.tile .ic{font-size:19px;color:var(--body-strong)}
.tile .nm{font-size:12.5px;font-weight:500;color:var(--ink);letter-spacing:-.1px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;align-self:flex-start;height:17px;padding:0 7px;
  border:1px solid var(--hair);border-radius:var(--r-pill);
  font-family:var(--mono);font-size:10px;color:var(--mute);background:var(--canvas)}
.pill.on{color:var(--ink);border-color:var(--body)}

/* ---------- Vollbreite Linienzeilen ---------- */
.lrow{display:flex;align-items:center;gap:12px;margin:0 var(--gut);padding:10px 0;
  border-bottom:1px solid var(--hair)}
.lrow .thumb{width:46px;height:32px;flex:none;border-radius:var(--r-sm);background-color:var(--soft);filter:var(--warm)}
.lrow .col{flex:1;min-width:0}
.lrow .t{font-size:15px;font-weight:500;color:var(--ink);letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .m{display:block;margin-top:2px}
.lrow .r{flex:none;text-align:right}

/* ---------- Tabelle ---------- */
.thead{display:flex;align-items:center;gap:8px;padding:7px var(--gut);
  background:var(--soft);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.trow{position:relative;display:flex;align-items:center;gap:8px;padding:9px var(--gut);
  border-bottom:1px solid var(--hair);
  transition:background var(--dur-s) var(--ease)}
.trow.is-on{background:var(--soft)}
.trow.is-on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ink)}
.c-file{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.c-file .thumb{width:34px;height:34px;flex:none;border-radius:var(--r-sm);background-color:var(--soft);filter:var(--warm)}
.c-file .t{font-size:14.5px;font-weight:500;color:var(--ink);letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-file .m{display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-art{width:54px;flex:none}
.c-date{width:72px;flex:none;text-align:right;font-size:11px}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px var(--gut)}

/* ---------- Textschalter (Filter, Umschalter) ---------- */
.switch{display:flex;gap:4px;padding:0 var(--gut);white-space:nowrap}
.sw{padding:5px 9px;border-radius:var(--r-sm);font-size:13px;color:var(--body);letter-spacing:-.1px;
  transition:background var(--dur-s) var(--ease),color var(--dur-s) var(--ease)}
.sw.is-on{background:var(--soft);color:var(--ink);font-weight:500}
.sw .n{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-left:5px}

/* ---------- Detail ---------- */
.back{display:flex;align-items:center;gap:11px;padding:4px var(--gut) 0;height:42px}
.back .path{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back .path b{color:var(--ink);font-weight:400}
.dhead{padding:14px var(--gut) 0}
.dhead h1{font-size:30px;font-weight:400;letter-spacing:-.9px;color:var(--ink);line-height:1.1}
.dhead .sub{margin-top:4px;font-size:18px}
.dacts{display:flex;align-items:center;gap:9px;padding:14px var(--gut) 0}
.dacts .btn{flex:1}
.cmdline{display:flex;align-items:center;gap:10px;margin:16px var(--gut) 0;padding:10px 0;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cmdline .col{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px var(--gut) 0}
.grid span{aspect-ratio:1/1;border-radius:var(--r-md);background-color:var(--soft);filter:var(--warm)}

/* ---------- Signatur: Eingabezeile unten ---------- */
.prompt{position:absolute;left:0;right:0;bottom:0;height:70px;padding:0 var(--gut) 24px;z-index:20;
  display:flex;align-items:center;gap:10px;background:var(--canvas);border-top:1px solid var(--hair)}
.field{flex:1;min-width:0;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--soft);border:1px solid var(--hair);border-radius:var(--r-sm)}
.field .ch{font-family:var(--mono);font-size:13px;color:var(--ink);flex:none}
.field .ph{font-family:var(--mono);font-size:11.5px;color:var(--mute);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden}
.cursor{width:7px;height:15px;background:var(--body-strong);flex:none;margin-right:1px}

/* ---------- Bewegung: ruhig, nur Deckkraft ---------- */
@media (prefers-reduced-motion: no-preference){
  @keyframes appear{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
  .head,.mock,.sec,.meter,.tiles,.lrow,.thead,.trow,.switch,.dhead,.dacts,.cmdline,.grid,.tfoot{
    animation:appear var(--dur-m) var(--ease) both}
  .lrow:nth-of-type(2){animation-delay:30ms}
  .lrow:nth-of-type(3){animation-delay:60ms}
  .cursor{animation:blink 1s steps(1,end) infinite}
}
</style></head>
