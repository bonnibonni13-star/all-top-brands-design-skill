<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<title>Musterscreens OpenCode</title>
<style>
:root{
  /* Flächen – nur Creme, eine dunkle Fläche je Screen */
  --canvas:#fdfcfc;
  --soft:#f8f7f7;
  --card:#f1eeee;
  --dark:#201d1d;
  --dark-elev:#302c2c;
  /* Text */
  --ink:#201d1d;
  --ink-deep:#0f0000;
  --charcoal:#302c2c;
  --body:#424245;
  --mute:#646262;
  --stone:#6e6e73;
  --ash:#9a9898;
  --on-dark:#fdfcfc;
  --on-dark-mute:#9a9898;
  /* Linien */
  --hair:rgba(15,0,0,.12);
  --hair-strong:#646262;
  /* Semantik – ausschließlich im dunklen TUI-Block */
  --accent:#007aff; --success:#30d158; --warning:#ff9f0a; --danger:#ff3b30;
  /* Form */
  --r-none:0px; --r-sm:4px; --r-full:9999px;
  /* Schrift: eine Monospace für alles */
  --mono:"DejaVu Sans Mono","Liberation Mono",monospace;
  /* Bewegung: Zustände springen */
  --dur-s:90ms; --ease:linear;
}

/* ---------- Grundgerüst ---------- */
.phone{background:var(--canvas);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;}
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;}
.scroll{flex:1;min-height:0;overflow:hidden;}
.pad{padding:0 24px;}
.hair{height:1px;background:var(--hair);}

/* ---------- Kopfzeile ---------- */
.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  border-bottom:1px solid var(--hair);}
.pixmark{display:grid;grid-template-columns:repeat(3,4px);grid-auto-rows:4px;gap:2px;}
.pixmark i{background:var(--ink);display:block;}
.pixmark i.off{background:var(--hair);}
.btn-ink{background:var(--ink);color:var(--on-dark);border-radius:var(--r-sm);padding:0 14px;height:32px;
  display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;
  transition:background var(--dur-s) var(--ease);}
.btn-line{border:1px solid var(--hair-strong);border-radius:var(--r-sm);padding:0 14px;height:32px;
  display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink);}

/* ---------- Typografie ---------- */
.h-display{font-size:26px;font-weight:700;line-height:1.35;letter-spacing:0;}
.h-title{font-size:24px;font-weight:700;line-height:1.35;}
.metaline{font-size:12.5px;color:var(--mute);}
.seclabel{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:700;}
.seclabel span.count{font-weight:400;color:var(--ash);}
.mk{color:var(--mute);}

/* ---------- Dunkler TUI-Block (einmal je Screen) ---------- */
.tui{background:var(--dark);color:var(--on-dark);padding:14px 24px 16px;}
.tui-path{font-size:11.5px;color:var(--on-dark-mute);display:flex;justify-content:space-between;}
.tui-path b{color:var(--success);font-weight:400;}
.tui-kicker{font-size:11.5px;color:var(--on-dark-mute);margin-top:10px;}
.tui-prompt{background:var(--dark-elev);border-radius:var(--r-sm);padding:9px 12px;margin-top:7px;
  display:flex;align-items:center;gap:10px;font-size:15px;}
.tui-prompt .bar{color:var(--accent);}
.tui-prompt .name{font-weight:700;flex:1;}
.tui-prompt .val{font-size:12px;color:var(--on-dark-mute);}
.tui-keys{margin-top:12px;font-size:11.5px;color:var(--on-dark-mute);display:flex;gap:18px;}
.tui-keys b{color:var(--on-dark);font-weight:400;}

/* ---------- Zeilen mit ASCII-Marker ---------- */
.rows{margin-top:10px;}
.row{display:flex;align-items:baseline;gap:9px;padding:3px 0;font-size:12.5px;}
.row .name{color:var(--ink);font-weight:500;flex:1;}
.row .val{color:var(--mute);}
.row .state{color:var(--ash);width:62px;text-align:right;}
.meter{display:flex;align-items:baseline;gap:9px;margin-top:8px;padding-top:8px;border-top:1px solid var(--hair);
  font-size:12.5px;color:var(--mute);}
.meter .bar{color:var(--ink);letter-spacing:-.5px;}
.meter .val{margin-left:auto;color:var(--ink);}

/* ---------- Abbildungen ---------- */
.figrow{margin-top:12px;gap:10px;padding-left:24px;}
.fig{width:112px;flex:none;}
.fig-img{width:112px;height:80px;border:1px solid var(--hair);filter:saturate(.9);}
.fig-cap{font-size:10.5px;line-height:1.3;color:var(--ash);margin-top:6px;}
.fig-name{font-size:12px;line-height:1.3;color:var(--ink);font-weight:500;margin-top:2px;}
.fig-meta{font-size:10.5px;line-height:1.3;color:var(--mute);margin-top:2px;}

/* ---------- Leiste unten: reine Mono-Labels ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:66px;background:var(--canvas);
  border-top:1px solid var(--hair);display:flex;align-items:flex-start;justify-content:space-between;
  padding:13px 24px 0;z-index:20;}
.tab{font-size:13px;color:var(--mute);font-weight:400;}
.tab.on{color:var(--ink);font-weight:700;}
.tabkeys{position:absolute;left:0;right:0;bottom:66px;padding:0 24px 6px;font-size:10.5px;color:var(--ash);
  display:flex;gap:16px;background:var(--canvas);z-index:20;}
.tabkeys b{color:var(--mute);font-weight:400;}

/* ---------- Bibliothek ---------- */
.titlerow{display:flex;align-items:baseline;justify-content:space-between;padding-top:16px;}
.field{margin-top:16px;height:44px;background:var(--soft);border:1px solid var(--hair);border-radius:var(--r-sm);
  display:flex;align-items:center;gap:9px;padding:0 12px;color:var(--mute);font-size:13px;}
.field .prompt{color:var(--ink);}
.tabs{display:flex;gap:17px;margin-top:18px;border-bottom:1px solid var(--hair-strong);}
.ttab{font-size:13px;color:var(--mute);padding-bottom:9px;position:relative;}
.ttab.on{color:var(--ink);font-weight:700;}
.ttab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ash);}
.ttab b{font-weight:400;color:var(--ash);}
.colhead{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ash);margin-top:13px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-top:10px;}
.cell-img{width:100%;height:150px;border:1px solid var(--hair);filter:saturate(.9);}

/* ---------- Detail ---------- */
.pathrow{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;
  color:var(--mute);}
.pathrow .here{color:var(--ink);font-weight:500;}
.pathrow .tools{display:flex;gap:14px;color:var(--mute);}
.plate{width:100%;height:190px;border:1px solid var(--hair);filter:saturate(.92);margin-top:14px;}
.actions{display:flex;gap:8px;margin-top:16px;}
.btn-main{flex:1;background:var(--ink);color:var(--on-dark);border-radius:var(--r-sm);height:42px;
  display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:500;
  transition:background var(--dur-s) var(--ease);}
.btn-sq{width:42px;height:42px;border:1px solid var(--hair-strong);border-radius:var(--r-sm);
  display:grid;place-items:center;font-size:13px;color:var(--ink);}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:12px;}
.grid3 div{height:110px;border:1px solid var(--hair);filter:saturate(.9);}
.musicbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--dark);color:var(--on-dark);
  display:flex;align-items:center;gap:12px;padding:0 24px 12px;z-index:20;}
.musicbar .kick{font-size:10.5px;color:var(--on-dark-mute);}
.musicbar .name{font-size:14px;font-weight:500;margin-top:2px;}
.btn-ondark{border:1px solid var(--on-dark-mute);border-radius:var(--r-sm);height:32px;padding:0 12px;
  display:flex;align-items:center;font-size:12.5px;color:var(--on-dark);}

/* ---------- Bewegung: nur Zustandswechsel, keine Animation ---------- */
@media (prefers-reduced-motion: no-preference){
  .btn-ink:active,.btn-main:active{background:var(--ink-deep);}
}
</style></head>
