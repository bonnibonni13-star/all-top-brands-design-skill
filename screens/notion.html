<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

  --lila:#7b3ff2; --lila-300:#d6b6f6; --lila-800:#391c57;
  --teal:#2a9d99; --gruen:#1aae39; --gelb:#f5d75e; --braun:#523410;

  /* Abstände */

  --font:Inter,"DejaVu Sans",sans-serif;
}

.phone{ background:var(--canvas); font-family:var(--font); color:var(--ink); }
.phone .sb{ color:var(--ink); }

/* ---------- Typo ---------- */
.h2{ font-size:28px; font-weight:600; line-height:1.2; letter-spacing:-.5px; color:var(--ink); }
.h3{ font-size:22px; font-weight:600; line-height:1.28; letter-spacing:-.3px; }
.h4{ font-size:18px; font-weight:600; line-height:1.35; }
.body{ font-size:14px; font-weight:400; line-height:1.5; color:var(--slate); }
.klein{ font-size:12px; font-weight:400; line-height:1.45; color:var(--steel); }
.mikro{ font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--stone); }

/* ---------- Icons: ein Stil (Phosphor Regular) ---------- */

.ws{ display:flex; align-items:center; gap:9px; }
.ws-mark{ width:26px; height:26px; border-radius:var(--r-sm); background:var(--t-lavendel);

.avatar{ width:26px; height:26px; border-radius:var(--r-full); }

/* ---------- Begrüßung ---------- */
.gruss{ padding:8px var(--rand) 14px; }
.gruss .body{ margin-top:5px; }

/* ---------- Navy-Hero mit Mockup-Karte ---------- */
.hero-wrap{ padding:0 var(--rand); }
.hero{ position:relative; background:var(--navy); border-radius:var(--r-xl); padding:18px 20px 40px;
  overflow:hidden; color:var(--auf-dunkel); }
.hero-deko{ position:absolute; inset:0; pointer-events:none; }
.hero-deko .draehte{ position:absolute; top:0; right:0; width:180px; height:90px; opacity:.9; }
.hero-deko .dot{ position:absolute; border-radius:var(--r-full); }
.badge{ display:inline-block; border-radius:var(--r-full); padding:4px 10px;
  font-size:12px; font-weight:600; line-height:1.3; }
.badge-lila{ background:var(--primary); color:#fff; }
.hero .h3{ margin-top:11px; }
.hero .sub{ font-size:14px; font-weight:400; line-height:1.5; color:var(--auf-dunkel-muted); margin-top:6px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px;

  transition:background var(--dur-s) var(--ease); }
.btn .ic{ font-size:15px; }
.btn-primaer{ background:var(--primary); color:#fff; }
.btn-primaer:active{ background:var(--primary-pressed); }
.btn-auf-dunkel{ background:transparent; color:#fff; box-shadow:inset 0 0 0 1px var(--auf-dunkel-muted); }
.btn-sek{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--linie-stark); }
.hero-btns{ display:flex; gap:9px; margin-top:16px; }
.mockup{ margin:-28px var(--rand) 0; position:relative; z-index:5; background:var(--canvas);
  border:1px solid var(--linie); border-radius:var(--r-lg); padding:9px;

.mockup .bild{ width:92px; height:62px; border-radius:var(--r-md); flex:none; }

.k-grau{ background:var(--t-grau); color:var(--steel); }
.zeile .txt{ flex:1; min-width:0; }

.zeile .m{ font-size:12px; font-weight:400; line-height:1.4; color:var(--steel); margin-top:2px; }

/* ---------- Quellen als Pastellkarten ---------- */
.quellen{ display:flex; gap:9px; padding:4px var(--rand) 0; }
.q{ flex:1; border-radius:var(--r-lg); padding:10px 10px 11px; }

.listkopf{ display:flex; align-items:center; justify-content:space-between; padding:16px var(--rand) 8px; }

.cover{ position:relative; height:158px; }

.seitenkopf{ padding:0 var(--rand); margin-top:-26px; position:relative; z-index:5; }
.seitenicon{ width:56px; height:56px; border-radius:var(--r-lg); background:var(--t-pfirsich);

.seitentitel{ font-size:32px; font-weight:600; line-height:1.15; letter-spacing:-.5px; margin-top:12px; }
.props{ padding:12px var(--rand) 0; }
.prop{ display:flex; align-items:center; gap:10px; padding:5px 0; }
.prop .label{ display:flex; align-items:center; gap:7px; width:104px; flex:none;
  font-size:13px; font-weight:400; color:var(--steel); }

.prop .wert{ font-size:13px; font-weight:400; color:var(--charcoal); }
.prop .wert.link{ color:var(--link); font-weight:500; }
.trenner{ height:1px; background:var(--linie-soft); margin:14px var(--rand) 0; }

.reiter button.aktiv{ color:var(--ink); font-weight:600; border-bottom-color:var(--ink); }
.galerie{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:14px var(--rand) 0; }
