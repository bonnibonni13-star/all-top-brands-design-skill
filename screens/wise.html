<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Farben */
  --primary:#9fe870; --primary-active:#cdffad; --primary-neutral:#c5edab; --primary-pale:#e2f6d5;
  --ink:#0e0f0c; --ink-deep:#163300; --body:#454745; --mute:#868685;
  --canvas:#ffffff; --canvas-soft:#e8ebe6;
  --positive-deep:#054d28; --warning:#ffd11a;
  /* Radien */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-pill:9999px;
  /* Abstände */
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-2xl:32px;
  --gutter:20px;
  /* Schrift */
  --display:"Inter Display",Inter,sans-serif; --text:Inter,sans-serif;
  /* Bewegung */
  --dur-s:180ms; --dur-m:280ms; --ease:cubic-bezier(.2,0,0,1);
}

/* ---------- Grundgerüst ---------- */
.phone{ background:var(--canvas-soft); color:var(--ink); font-family:var(--text); font-size:16px; }
.sb{ color:var(--ink); }
.hi{ color:var(--ink); }
.scroll{ position:absolute; inset:46px 0 0 0; overflow:hidden; }
.pad{ padding:0 var(--gutter); }

/* ---------- Typografie ---------- */
.d-xl{ font-family:var(--display); font-weight:900; font-size:40px; line-height:.88; letter-spacing:-.022em; }
.d-md{ font-family:var(--display); font-weight:900; font-size:34px; line-height:.92; letter-spacing:-.02em; }
.d-sm{ font-family:var(--display); font-weight:900; font-size:26px; line-height:1; letter-spacing:-.02em; }
.t-lead{ font-size:14px; line-height:20px; color:var(--body); }
.t-mute{ font-size:13px; line-height:18px; color:var(--mute); }
.t-strong{ font-size:16px; font-weight:600; line-height:22px; letter-spacing:-.01em; }
.t-sm-strong{ font-size:14px; font-weight:600; line-height:20px; }
.eyebrow{ font-size:11px; font-weight:700; line-height:14px; letter-spacing:.07em; text-transform:uppercase; }

/* ---------- Kopfzeile ---------- */
.head{ display:flex; align-items:center; justify-content:space-between; padding:6px var(--gutter) 0; }
.mark{ width:30px; height:30px; border-radius:var(--r-pill); background:var(--primary);
  display:grid; place-items:center; }
.mark span{ width:11px; height:11px; border-radius:var(--r-pill); background:var(--ink); }
.avatar{ width:38px; height:38px; border-radius:var(--r-pill); background-color:var(--canvas); }
.icon-btn{ width:38px; height:38px; border-radius:var(--r-pill); background:var(--canvas);
  display:grid; place-items:center; font-size:18px; color:var(--ink); transition:transform var(--dur-s) var(--ease); }
.icon-btn:active{ transform:scale(.94); }

/* ---------- Blöcke ---------- */
.block{ background:var(--canvas); border-radius:var(--r-xl); padding:var(--s-xl); }
.block-dark{ background:var(--ink); border-radius:var(--r-xl); padding:var(--s-xl); color:var(--primary); }
.block-sage{ background:var(--canvas-soft); border-radius:var(--r-xl); padding:var(--s-xl); }
.block-bordered{ background:var(--canvas); border-radius:var(--r-xl); padding:18px var(--s-xl);
  border:1px solid var(--ink); }
.block + .block, .block-dark + .block, .block + .block-bordered, .block-bordered + .block{ margin-top:var(--s-lg); }

/* ---------- Aufmacher (dunkler Block) ---------- */
.feature{ padding:var(--s-lg); }
.feature-img{ height:104px; border-radius:var(--r-lg); background-color:#1a1c18; filter:saturate(.92) brightness(.94); }
.feature-badge{ display:inline-flex; align-items:center; gap:6px; background:var(--primary-pale);
  color:var(--positive-deep); border-radius:var(--r-pill); padding:4px 10px; font-size:12px; font-weight:600; }
.feature-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s-md); margin-top:var(--s-md); }
.feature h2{ color:var(--primary); margin-top:10px; }
.feature .sub{ color:#9d9f99; font-size:13px; line-height:18px; margin-top:6px; }
.btn-round{ width:52px; height:52px; border-radius:var(--r-pill); background:var(--primary); color:var(--ink);
  display:grid; place-items:center; font-size:22px; flex:none; transition:transform var(--dur-s) var(--ease); }
.btn-round:active{ transform:scale(.95); background:var(--primary-active); }

/* ---------- Kennzahlen-Karte ---------- */
.meter-head{ display:flex; align-items:baseline; justify-content:space-between; }
.meter-split{ display:flex; margin-top:10px; }
.meter-cell{ flex:1; }
.meter-cell + .meter-cell{ border-left:1px solid var(--canvas-soft); padding-left:var(--s-lg); }
.meter-val{ font-family:var(--display); font-weight:900; font-size:28px; line-height:1; letter-spacing:-.02em; }
.meter-unit{ font-size:12px; font-weight:600; color:var(--mute); margin-top:5px; letter-spacing:.04em; text-transform:uppercase; }
.bar{ height:8px; border-radius:var(--r-sm); background:var(--primary-pale); margin-top:12px; overflow:hidden; }
.bar i{ display:block; height:100%; width:69%; background:var(--primary); border-radius:var(--r-sm); }

/* ---------- Quellen-Kacheln ---------- */
.sources{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.source{ background:var(--canvas); border-radius:var(--r-xl); padding:13px 12px; text-align:left; }
.source-ic{ width:32px; height:32px; border-radius:var(--r-pill); background:var(--canvas-soft);
  display:grid; place-items:center; font-size:17px; }
.source-name{ font-size:13px; font-weight:600; line-height:17px; letter-spacing:-.01em; margin-top:9px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.source-state{ font-size:11px; font-weight:600; line-height:15px; margin-top:3px; }
.row-main{ min-width:0; flex:1; }
.pill-pos{ background:var(--primary-pale); color:var(--positive-deep); border-radius:var(--r-pill);
  padding:3px 10px; font-size:12px; font-weight:600; white-space:nowrap; }
.pill-mute{ background:var(--canvas-soft); color:var(--body); border-radius:var(--r-pill);
  padding:3px 10px; font-size:12px; font-weight:600; white-space:nowrap; }

/* ---------- Navigation ---------- */
.nav{ position:absolute; left:0; right:0; bottom:0; height:80px; background:var(--canvas);
  display:flex; align-items:flex-start; padding:10px 6px 0; z-index:20; }
.nav a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--mute); }
.nav .cap{ width:44px; height:26px; border-radius:var(--r-pill); display:grid; place-items:center; font-size:20px; }
.nav .lb{ font-size:11px; font-weight:600; letter-spacing:-.01em; }
.nav a.on{ color:var(--ink); }
.nav a.on .cap{ background:var(--primary); }
.nav a.on .lb{ font-weight:700; }

/* ---------- Bibliothek ---------- */
.search{ display:flex; align-items:center; gap:10px; background:var(--canvas); border:1px solid var(--ink);
  border-radius:var(--r-md); padding:12px var(--s-lg); font-size:15px; color:var(--mute); }
.chips{ display:flex; gap:8px; overflow:hidden; padding:0 var(--gutter); }
.chip{ border:1px solid var(--ink); background:var(--canvas); color:var(--ink); border-radius:var(--r-pill);
  padding:7px 12px; font-size:13px; font-weight:600; white-space:nowrap; transition:transform var(--dur-s) var(--ease); }
.chip.on{ background:var(--ink); color:var(--canvas); border-color:var(--ink); }
.chip:active{ transform:scale(.97); }

.list{ background:var(--canvas); border-radius:var(--r-xl); padding:0 var(--s-lg); }
.item{ display:flex; align-items:center; gap:var(--s-md); padding:11px 0; }
.item + .item{ border-top:1px solid var(--canvas-soft); }
.thumb{ width:46px; height:46px; border-radius:var(--r-md); flex:none; background-color:var(--canvas-soft); }
.item-main{ min-width:0; flex:1; }
.item-title{ font-size:15px; font-weight:600; line-height:20px; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-sub{ font-size:13px; line-height:18px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.amount{ text-align:right; flex:none; }
.amount b{ font-family:var(--display); font-weight:900; font-size:19px; line-height:1; letter-spacing:-.02em; display:block; }
.amount span{ font-size:11px; font-weight:600; color:var(--mute); letter-spacing:.04em; text-transform:uppercase; display:block; margin-top:4px; }

.sum{ display:flex; align-items:center; justify-content:space-between; padding:0 var(--gutter); }

/* ---------- Detail ---------- */
.hero{ position:relative; margin:0 var(--gutter); height:206px; border-radius:var(--r-xl); overflow:hidden; }
.hero-bar{ position:absolute; left:12px; right:12px; top:12px; display:flex; justify-content:space-between; }
.hero-bar .right{ display:flex; gap:8px; }
.count{ position:absolute; right:12px; bottom:12px; background:rgba(255,255,255,.92); color:var(--ink);
  border-radius:var(--r-pill); padding:5px 12px; font-size:12px; font-weight:600; }

.cta{ display:flex; gap:10px; align-items:center; }
.btn-primary{ flex:1; height:50px; border-radius:var(--r-xl); background:var(--primary); color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:9px; font-size:16px; font-weight:600;
  transition:transform var(--dur-s) var(--ease), background var(--dur-s) var(--ease); }
.btn-primary:active{ transform:scale(.97); background:var(--primary-active); }
.btn-circle{ width:50px; height:50px; border-radius:var(--r-pill); background:var(--canvas); color:var(--ink);
  display:grid; place-items:center; font-size:20px; flex:none; }

.seg{ display:flex; background:var(--canvas); border-radius:var(--r-pill); padding:4px; gap:4px; }
.seg button{ flex:1; height:38px; border-radius:var(--r-pill); font-size:14px; font-weight:600; color:var(--body); }
.seg button.on{ background:var(--ink); color:var(--canvas); }

.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
.photo{ aspect-ratio:1; border-radius:var(--r-md); background-color:var(--canvas-soft); }

.music{ display:flex; align-items:center; gap:var(--s-md); }
.music-art{ width:46px; height:46px; border-radius:var(--r-md); flex:none; }
.play{ width:42px; height:42px; border-radius:var(--r-pill); background:var(--primary); color:var(--ink);
  display:grid; place-items:center; font-size:18px; flex:none; }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference){
  .stagger > *{ animation:rise var(--dur-m) var(--ease) both; }
  .stagger > *:nth-child(2){ animation-delay:50ms; }
  .stagger > *:nth-child(3){ animation-delay:100ms; }
  .stagger > *:nth-child(4){ animation-delay:150ms; }
  .stagger > *:nth-child(5){ animation-delay:200ms; }
  @keyframes rise{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none; } }
}
