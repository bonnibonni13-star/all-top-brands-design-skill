<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Farben aus der Markendatei */
  --carbon:#21242e; --canvas:#7a8aba; --periwinkle:#8ba1d4; --sky:#9fbee7; --lavender:#acace7;
  --ice:#c0d5e6; --indigo:#3d4f97; --muted-indigo:#60619c; --platinum:#dedede; --white:#fff;
  --hairline:#5a5f8c; --edge-light:#c3d0ef;
  --gold:#e48600; --amber:#ecab37; --signal:#f68d1f; --red:#e60012;
  /* Arial -> Liberation Sans */
  --f:"Liberation Sans", Arial, sans-serif;
  --dots:radial-gradient(rgba(255,255,255,.14) .8px, transparent .9px);
  --dur-s:120ms; --dur-m:200ms; --ease:cubic-bezier(.2,0,0,1);
}

/* ---------- Chassis ---------- */
.phone{ background:var(--canvas); color:var(--carbon); font-family:var(--f);
  background-image:linear-gradient(180deg, #8292c0 0%, #7a8aba 38%, #7080b0 100%); }
.sb{ background-color:var(--carbon); background-image:var(--dots); background-size:3px 3px; color:#fff; }

/* ---------- Doppelte Kopfnavigation ---------- */
.navbar{ display:flex; align-items:stretch; gap:2px; height:34px; padding:0 8px;
  background-color:var(--carbon); background-image:var(--dots); background-size:3px 3px;
  box-shadow:inset 0 -1px 0 #0d0f15; }
.mark{ display:flex; align-items:center; margin-right:4px; }
.mark-pill{ background:#fff; border-radius:9999px; padding:3px 6px; display:flex; align-items:center; }
.nav-word{ display:flex; align-items:center; padding:0 9px; color:var(--gold);
  font:700 11.5px/1 var(--f); text-transform:uppercase; letter-spacing:.5px;
  transition:background var(--dur-s) var(--ease); }
.nav-word.is-on{ color:var(--carbon); background:linear-gradient(#b9c6e9,#8ba1d4);
  clip-path:polygon(7px 0, 100% 0, 100% 100%, 0 100%); box-shadow:inset 0 1px 0 #e3eaff; }

/* ---------- Hellblauer Unterleisten-Streifen ---------- */
.substrip{ display:flex; align-items:center; gap:8px; padding:5px 10px; background:var(--sky);
  box-shadow:inset 0 1px 0 #d4e6fb, inset 0 -1px 0 var(--indigo); min-height:30px; }
.src{ display:flex; align-items:center; gap:4px; font:700 10px/1 var(--f);
  text-transform:uppercase; letter-spacing:.5px; color:var(--carbon); }
.src .ic{ font-size:12px; color:var(--indigo); }
.substrip .right{ margin-left:auto; font:700 10px/1 var(--f); color:var(--indigo);
  text-transform:uppercase; letter-spacing:.5px; }
.sep{ width:1px; align-self:stretch; background:var(--hairline); opacity:.5; }
.field{ flex:1; display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--hairline);
  border-radius:2px; padding:4px 7px; font:400 11.5px/1.2 var(--f); color:#555c70;
  box-shadow:inset 0 1px 2px rgba(33,36,46,.22); }
.field .ic{ font-size:12px; color:var(--indigo); }
.chip{ background:var(--amber); color:var(--carbon); border-radius:2px; padding:5px 10px;
  font:700 10px/1 var(--f); text-transform:uppercase; letter-spacing:.5px;
  box-shadow:inset 0 1px 0 #f9e0ab, 0 1px 0 #a9761a;
  transition:transform var(--dur-s) var(--ease); }
.chip:active{ transform:translateY(1px); }
.back{ display:flex; align-items:center; gap:6px; font:700 10px/1 var(--f);
  text-transform:uppercase; letter-spacing:.5px; color:var(--carbon); }
.go{ width:22px; height:22px; flex:none; border-radius:9999px; background:var(--signal); color:#fff;
  display:grid; place-items:center; font-size:12px;
  box-shadow:inset 0 1px 0 #ffc281, 0 1px 0 #a35707; }

/* ---------- Masthead: Avatar mit Sprechblase ---------- */
.masthead{ display:flex; align-items:center; gap:8px; padding:7px 10px 0; }
.avatar{ width:30px; height:30px; flex:none; border:2px solid var(--indigo); border-radius:4px;
  clip-path:polygon(7px 0, 100% 0, 100% 100%, 0 100%, 0 7px); }
.bubble{ position:relative; background:#fff; border-radius:10px; padding:6px 11px;
  font:700 11px/1.2 var(--f); color:var(--carbon); box-shadow:0 1px 0 var(--indigo); }
.bubble::before{ content:""; position:absolute; left:-5px; top:11px; width:0; height:0;
  border:5px solid transparent; border-right-color:#fff; border-left:0; }
.masthead .right{ margin-left:auto; font:700 10px/1.2 var(--f); color:var(--indigo);
  text-transform:uppercase; letter-spacing:.5px; text-align:right; }

/* ---------- Hero-Platte ---------- */
.hero{ position:relative; margin:10px; height:172px; overflow:hidden; background:var(--lavender);
  border:2px solid var(--indigo);
  clip-path:polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%, 0 14px); }
.hero-img{ position:absolute; inset:0; }
.hero-grad{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(33,36,46,0) 32%, rgba(33,36,46,.82) 100%); }
.hero-txt{ position:absolute; left:12px; right:12px; bottom:10px; }
.wm{ position:relative; display:inline-block; font:700 35px/1 var(--f);
  text-transform:uppercase; letter-spacing:-.01em; }
.wm-o{ position:absolute; left:0; top:0; z-index:0; color:var(--carbon);
  -webkit-text-stroke:6px var(--carbon); text-shadow:4px 4px 0 rgba(33,36,46,.65); }
.wm-f{ position:relative; z-index:1; color:#fff; }
.hero-tag{ font:700 12.5px/1.3 var(--f); color:#fff; margin-top:5px; text-shadow:0 1px 2px rgba(33,36,46,.9); }
.hero .go{ position:absolute; right:12px; bottom:14px; width:30px; height:30px; font-size:15px; }
.badge{ position:absolute; left:12px; top:12px; background:var(--amber); color:var(--carbon);
  border-radius:2px; padding:4px 7px; font:700 10px/1 var(--f); text-transform:uppercase;
  letter-spacing:.5px; box-shadow:inset 0 1px 0 #f9e0ab, 0 1px 0 #a9761a; }

/* ---------- Module: Platte mit Kopfleiste ---------- */
.split{ display:flex; gap:5px; padding:0 10px 0 0; }
.vtabs{ width:24px; flex:none; display:flex; flex-direction:column; gap:5px; padding-top:2px; }
.vtab{ writing-mode:vertical-rl; transform:rotate(180deg); background-color:var(--carbon);
  background-image:var(--dots); background-size:3px 3px; color:var(--sky); border-radius:0 4px 4px 0;
  padding:9px 4px; font:700 9px/1 var(--f); text-transform:uppercase; letter-spacing:.6px;
  box-shadow:inset 0 0 0 1px #3a3f52; }
.col{ flex:1; min-width:0; }
.module{ border:1px solid var(--indigo); border-radius:6px; overflow:hidden; margin-bottom:9px;
  background:var(--periwinkle); box-shadow:inset 0 1px 0 var(--edge-light), 0 1px 0 rgba(33,36,46,.3); }
.sec-head{ display:flex; align-items:center; gap:6px; padding:6px 9px; color:var(--carbon);
  background:linear-gradient(#93a7da,#7a8aba); border-bottom:1px solid var(--indigo);
  font:700 11px/1.1 var(--f); text-transform:uppercase; letter-spacing:.5px;
  box-shadow:inset 0 1px 0 var(--edge-light); }
.sec-head .ic{ font-size:12px; color:var(--carbon); }
.sec-head .count{ margin-left:auto; font-size:10px; color:#1d2b5e; }
.rows{ padding:5px; display:flex; flex-direction:column; gap:4px; }

/* ---------- Platin-Listenzeile ---------- */
.row{ display:flex; align-items:center; gap:9px; background:var(--platinum); border-radius:4px;
  padding:6px 7px; box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 #b4b4b4; }
.row-thumb{ width:58px; height:39px; flex:none; border:2px solid var(--indigo); border-radius:4px; }
.row-main{ flex:1; min-width:0; }
.row-title{ font:700 12px/1.25 var(--f); color:var(--indigo); }
.row-meta{ font:400 10px/1.3 var(--f); color:#3a3f52; margin-top:2px; }
.chip-arrow{ width:18px; height:18px; flex:none; border-radius:2px; background:var(--signal); color:#fff;
  display:grid; place-items:center; font-size:11px;
  box-shadow:inset 0 1px 0 #ffc281, 0 1px 0 #a35707; }

/* ---------- Aktionsreihe aus Carbon-Slabs ---------- */
.rail{ display:flex; gap:5px; margin-bottom:9px; }
.slab{ flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
  background-color:var(--carbon); background-image:var(--dots); background-size:3px 3px; color:#fff;
  padding:8px 4px; font:700 10px/1.1 var(--f); text-transform:uppercase; letter-spacing:.5px;
  box-shadow:inset 0 1px 0 #4b5166, 0 1px 0 var(--indigo);
  transition:transform var(--dur-s) var(--ease); }
.slab:active{ transform:translateY(1px); }
.slab .ic{ font-size:13px; color:var(--amber); }
.btn-submit{ display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
  background:var(--signal); color:#fff; border-radius:2px; padding:11px 10px;
  font:700 13px/1 var(--f); text-transform:uppercase; letter-spacing:.6px;
  box-shadow:inset 0 1px 0 #ffc281, 0 2px 0 #a35707; margin-bottom:9px; }
.btn-submit .ic{ font-size:15px; }

/* ---------- Reiterreihe ---------- */
.tabs{ display:flex; gap:3px; margin-bottom:9px; }
.tab{ flex:1; text-align:center; padding:7px 2px; background:var(--muted-indigo); color:#ccd8f3;
  font:700 10.5px/1 var(--f); text-transform:uppercase; letter-spacing:.5px;
  clip-path:polygon(6px 0, 100% 0, 100% 100%, 0 100%); box-shadow:inset 0 1px 0 #7b7cb4; }
.tab.is-on{ background:var(--amber); color:var(--carbon); box-shadow:inset 0 1px 0 #f9e0ab, 0 1px 0 #a9761a; }

/* ---------- Info-Kasten mit Bernstein-Reiter ---------- */
.info{ background:#fff; border:1px solid var(--indigo); border-radius:4px; overflow:hidden;
  margin-bottom:9px; }
.info-tab{ display:inline-block; background:var(--amber); color:var(--carbon); padding:4px 9px;
  font:700 10px/1 var(--f); text-transform:uppercase; letter-spacing:.5px;
  box-shadow:inset 0 1px 0 #f9e0ab; }
.info-body{ padding:7px 9px 9px; font:400 11px/1.35 var(--f); color:var(--carbon); }
.meter{ position:relative; height:11px; margin-top:6px; background:var(--platinum);
  border:1px solid var(--hairline); border-radius:2px; overflow:hidden; }
.meter span{ position:absolute; left:0; top:0; bottom:0; width:69%;
  background:linear-gradient(#ffb15e,#f68d1f); }
.dotted{ border-top:1px dotted var(--muted-indigo); margin:7px 0; }

/* ---------- Auswahlplatte (Radio) ---------- */
.choice{ padding:7px 9px 9px; }
.opt{ display:flex; align-items:center; gap:7px; padding:4px 0; font:400 11.5px/1.3 var(--f); }
.dot{ width:12px; height:12px; flex:none; border-radius:9999px; background:#fff;
  border:1px solid var(--hairline); box-shadow:inset 0 1px 1px rgba(33,36,46,.3); position:relative; }
.opt.is-on .dot::after{ content:""; position:absolute; inset:2.5px; border-radius:9999px; background:var(--signal); }
.opt.is-on{ font-weight:700; }
.opt .num{ margin-left:auto; font:400 10px/1 var(--f); color:#3a3f52; }

/* ---------- Bildraster ---------- */
.grid{ padding:5px; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.grid > div{ aspect-ratio:4/3; border:2px solid var(--indigo); border-radius:4px; }

/* ---------- Carbon-Fußplatte ---------- */
.footer{ position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:8px;
  background-color:var(--carbon); background-image:var(--dots); background-size:3px 3px;
  color:var(--sky); padding:11px 12px 20px; font:400 10px/1.35 var(--f);
  clip-path:polygon(0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
.footer b{ color:#fff; font-weight:700; }
.footer .badge-f{ margin-left:auto; background:var(--amber); color:var(--carbon); border-radius:2px;
  padding:3px 7px; font:700 9.5px/1.2 var(--f); text-transform:uppercase; letter-spacing:.5px;
  text-align:center; box-shadow:inset 0 1px 0 #f9e0ab; }

.stack{ padding:0 10px; }

/* ---------- Kachelregal ---------- */
.shelf{ flex-direction:row; padding:5px; gap:5px; }
.tile{ width:108px; flex:none; background:var(--platinum); border-radius:4px; padding:4px;
  box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 #b4b4b4; }
.tile-img{ height:70px; border:2px solid var(--indigo); border-radius:4px; }
.tile-name{ font:700 10.5px/1.2 var(--f); color:var(--indigo); margin-top:4px; }
.tile-meta{ font:400 9.5px/1.2 var(--f); color:#3a3f52; margin-top:2px; }

/* ---------- Quellenzeile ---------- */
.row-src{ gap:7px; }
.row-src .ic{ font-size:15px; color:var(--indigo); }
.state{ margin-left:auto; font:700 9.5px/1 var(--f); text-transform:uppercase; letter-spacing:.5px;
  color:var(--carbon); background:#c9c9c9; border-radius:2px; padding:4px 6px;
  box-shadow:inset 0 1px 0 #efefef; }
.state.on{ background:var(--signal); color:#fff; box-shadow:inset 0 1px 0 #ffc281; }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference){
  .hero, .module, .rail, .tabs, .btn-submit{ animation:plate-in var(--dur-m) var(--ease) both; }
  .module{ animation-delay:40ms; }
  .rail, .tabs{ animation-delay:80ms; }
  @keyframes plate-in{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }
}
