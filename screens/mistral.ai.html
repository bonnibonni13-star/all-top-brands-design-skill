<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--grain, .18); mix-blend-mode: overlay;

<style>
/* ==========================================================================
   Mistral AI – Designsprache als App-Vorlage
   Werte aus references/mistral.ai.md (Farben, Typo-Leiter, Radien, Abstände).
   App-Muster, Icons und Bewegung = Empfehlung aus dem Profil.
   ========================================================================== */
:root {
  /* Sonnenuntergang – Akzent und Streifen */
  --primary: #fa520f;
  --primary-deep: #cc3a05;
  --sun-500: #ffb83e;
  --sun-700: #ffa110;
  --sun-900: #ff8a00;
  --yellow: #ffd900;
  /* Warme Neutralflächen */
  --cream: #fff8e0;
  --cream-soft: #fffaeb;
  --cream-deep: #fff0c2;
  --beige: #e6d5a8;
  /* Weiß und Haarlinien */
  --canvas: #ffffff;
  --surface: #fafafa;
  --hairline: #e5e5e5;
  --hairline-soft: #ededed;
  --hairline-strong: #c7c7c7;
  /* Text */
  --ink: #1f1f1f;
  --ink-tint: #3d3d3d;
  --slate: #4a4a4a;
  --steel: #6a6a6a;
  --stone: #8a8a8a;
  /* Schrift: Editorial-Serif für Titel, Inter für alles andere */
  --font-display: "TeX Gyre Pagella", "Lora", serif;
  --font: "Inter", sans-serif;
  /* Radien: 8 Buttons · 12 Karten · Pille nur für Abzeichen */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 9999px;
  /* Abstände */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --gutter: 20px;
  /* Tiefe */
  --sh-card: 0 4px 12px rgba(0, 0, 0, .04);
  --sh-float: 0 12px 24px -4px rgba(0, 0, 0, .08);
  /* Bewegung (Empfehlung) */
  --dur-s: 150ms;
  --dur-m: 220ms;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

/* ---------- Grundlage ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 400 15px/1.55 var(--font); }
.phone .sb { color: var(--ink); }
.phone .hi { color: var(--ink); }
:where(.phone) :where(h1, h2, h3, p) { margin: 0; }
.ic-l { stroke-width: 1.75; }

/* Typografie-Stimmen */
.serif { font-family: var(--font-display); font-weight: 400; }
.display { font: 400 40px/1.08 var(--font-display); letter-spacing: -1px; }
.display--sm { font-size: 32px; letter-spacing: -.6px; }
.h-sec { font: 500 20px/1.3 var(--font); letter-spacing: -.3px; }
.eyebrow { font: 600 11px/1.4 var(--font); letter-spacing: 1px; text-transform: uppercase; color: var(--steel); }
.lead { font: 400 15px/1.5 var(--font); color: var(--slate); }
.cap { font: 400 13px/1.4 var(--font); color: var(--steel); }
.link-more { display: inline-flex; align-items: center; gap: 3px; font: 500 14px/1.4 var(--font); color: var(--primary); }
.link-more .ic { font-size: 15px; }

/* ---------- Bühne: randloses Bild mit Sonnenuntergangs-Verlauf ---------- */
.stage-hero { position: relative; isolation: isolate; }
.stage-hero > .bg { position: absolute; inset: 0; z-index: -2; }
.stage-hero > .wash { position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(160deg, var(--sun-700) 0%, var(--sun-900) 55%, var(--primary) 100%);
  opacity: .37; mix-blend-mode: multiply; }
.stage-hero > .lift { position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(255, 248, 224, .30) 0%, rgba(255, 248, 224, 0) 36%,
    rgba(255, 226, 164, .58) 78%, rgba(255, 240, 194, .92) 100%); }
.stage-body { padding: 0 var(--gutter) 22px; }

/* ---------- Kopfzeile über der Bühne ---------- */
.top { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--gutter) 0; height: 44px; }
.avatar { width: 36px; height: 36px; border-radius: var(--r-md); background-color: var(--cream);
  border: 1px solid var(--beige); }

/* ---------- Buttons: 8 px, nie Pille ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); height: 44px;
  padding: 0 20px; border-radius: var(--r-md); font: 500 14px/1.3 var(--font); white-space: nowrap;
  transition: background-color var(--dur-s) var(--ease), border-color var(--dur-s) var(--ease); }
.btn .ic { font-size: 17px; }
.btn--ink { background: var(--ink); color: #fff; }
.btn--ink:active { background: #000; }
.btn--primary { background: var(--primary); color: #fff; }
.btn--primary:active { background: var(--primary-deep); }
.btn--onlight { background: var(--canvas); color: var(--ink); border: 1px solid var(--beige); }
.btn--outline { background: transparent; color: var(--ink); border: 1px solid var(--hairline-strong); }
.btn-sq { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r-md);
  border: 1px solid var(--hairline-strong); background: var(--canvas); color: var(--ink); font-size: 19px;
  transition: background-color var(--dur-s) var(--ease); }
.btn-sq--onimage { border-color: rgba(31, 31, 31, .18); background: rgba(255, 255, 255, .82); }
.btn-sq:active { background: var(--cream); }

/* ---------- Abzeichen: die einzige Pille ---------- */
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: var(--r-full);
  font: 600 11px/1 var(--font); background: var(--cream-deep); color: var(--ink); }
.badge--ink { background: var(--ink); color: #fff; }
.badge--orange { background: var(--primary); color: #fff; }

/* ---------- Karten ---------- */
.card { background: var(--canvas); border: 1px solid var(--hairline-soft); border-radius: var(--r-lg);
  box-shadow: var(--sh-card); overflow: hidden; }
.card-img { aspect-ratio: 16 / 10; background-color: var(--cream); }
.card-body { padding: 12px 14px 14px; }
.card-title { font: 400 18px/1.25 var(--font-display); letter-spacing: -.2px; }
.card-meta { margin-top: 4px; font: 400 12px/1.35 var(--font); color: var(--steel);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Angeschnittene Kartenreihe */
.row-x { gap: var(--s-3); padding: 14px var(--gutter) 2px; }
.row-x .card { width: 196px; flex: none; }

/* ---------- Creme-Panel mit Beige-Rahmen ---------- */
.panel { margin: 14px var(--gutter) 0; background: var(--cream); border: 1px solid var(--beige);
  border-radius: var(--r-lg); padding: 16px 18px 18px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; }
.stat { font: 400 38px/1 var(--font-display); letter-spacing: -1px; }
.bar { margin-top: 12px; height: 6px; border-radius: var(--r-full); background: rgba(31, 31, 31, .1); overflow: hidden; }
.bar > i { display: block; height: 6px; width: 69%; border-radius: var(--r-full);
  background: linear-gradient(90deg, var(--primary), var(--sun-700) 70%, var(--sun-500)); }
.srcs { display: flex; gap: var(--s-2); margin-top: 14px; }
.src { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: var(--r-md);
  background: var(--canvas); border: 1px solid var(--beige); font: 500 12px/1 var(--font); color: var(--ink); }
.src .ic { font-size: 14px; color: var(--steel); }
.src--off { color: var(--stone); }
.src--off .ic { color: var(--stone); }

/* ---------- Suche und Unterstrich-Tabs ---------- */
.search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px;
  background: var(--canvas); border: 1px solid var(--hairline-strong); border-radius: var(--r-md);
  color: var(--stone); font-size: 15px; transition: border-color var(--dur-s) var(--ease); }
.search:focus-within { border: 2px solid var(--primary); padding: 0 13px; }
.search .ic { font-size: 18px; color: var(--steel); }
.tabs { display: flex; gap: 2px; padding: 0 var(--gutter); border-bottom: 1px solid var(--hairline);
  overflow: hidden; }
.tab { position: relative; padding: 10px 12px 11px; font: 400 14px/1.4 var(--font); color: var(--steel);
  white-space: nowrap; transition: color var(--dur-s) var(--ease); }
.tab:first-child { padding-left: 0; }
.tab.is-on { color: var(--primary); font-weight: 500; }
.tab.is-on::after { content: ""; position: absolute; left: 0; right: 12px; bottom: -1px; height: 2px;
  background: var(--primary); }
.tab:first-child.is-on::after { right: 12px; }

/* ---------- Raster der Bibliothek ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px var(--gutter) 0; }
.grid2 .card-title { font-size: 17px; }
.card-tag { position: absolute; left: 10px; top: 10px; }
.card-img-wrap { position: relative; }

/* ---------- Detail ---------- */
.detail-top { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--gutter); height: 44px; }
.detail-actions { display: flex; gap: var(--s-2); }
.meta-row { display: flex; align-items: center; gap: var(--s-2); margin-top: 8px; }
.actions { display: flex; gap: var(--s-2); margin-top: 16px; }
.actions .btn--primary { flex: 1; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 14px var(--gutter) 0; }
.grid3 .photo { aspect-ratio: 4 / 3; border-radius: var(--r-sm); background-color: var(--cream); }

/* Creme-Leiste über dem Streifen (Musik zur Diashow) */
.musicbar { position: absolute; left: 0; right: 0; bottom: 77px; z-index: 18; display: flex; align-items: center;
  gap: var(--s-3); padding: 9px var(--gutter); background: var(--cream-soft); border-top: 1px solid var(--beige); }
.musicbar .mb-img { width: 42px; height: 42px; border-radius: var(--r-md); background-color: var(--cream);
  border: 1px solid var(--beige); flex: none; }
.mb-txt { flex: 1; min-width: 0; }
.mb-title { font: 400 17px/1.2 var(--font-display); }

/* ---------- Fuß: Sonnenuntergangs-Streifen + creme Leiste ---------- */
.sunset-stripe { position: absolute; left: 0; right: 0; bottom: 72px; height: 5px; z-index: 20;
  background: linear-gradient(90deg, var(--primary) 0%, var(--sun-900) 26%, var(--sun-500) 52%,
    var(--yellow) 76%, var(--cream) 100%); }
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; z-index: 20; display: flex;
  background: var(--cream); }
.nav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding-top: 11px; gap: 5px; color: var(--steel); font: 400 11px/1 var(--font);
  transition: color var(--dur-s) var(--ease); }
.nav .ic { font-size: 21px; }
.nav .is-on { color: var(--primary); font-weight: 500; }
.nav .is-on span { position: relative; }
.nav .is-on span::after { content: ""; position: absolute; left: -3px; right: -3px; bottom: -5px; height: 2px;
  background: var(--primary); }
.fade-out { position: absolute; left: 0; right: 0; bottom: 77px; height: 48px; z-index: 15; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0), var(--canvas) 86%); }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference) {
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes settle { from { transform: scale(1.04); } to { transform: none; } }
  .stage-body, .row-x, .panel, .grid2, .grid3, .tabs { animation: rise var(--dur-m) var(--ease) both; }
  .row-x { animation-delay: 60ms; }
  .panel { animation-delay: 120ms; }
  .stage-hero > .bg { animation: settle 600ms var(--ease) both; }
}
