<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Flächenleiter – Tiefe entsteht nur hierüber, nie über Schatten */
  --canvas:#07080a; --surface:#0d0d0d; --elev:#101111; --card:#121212;
  --hair:#242728; --hair-soft:rgba(255,255,255,.08); --hair-strong:rgba(255,255,255,.16);
  /* Text */
  --ink:#f4f4f6; --body:#cdcdcd; --mute:#9c9c9d; --ash:#6a6b6c; --stone:#434345;
  --on-dark-mute:rgba(255,255,255,.72);
  /* Aktion */
  --white:#ffffff; --on-primary:#000000;
  /* Akzente – ausschließlich in Icon-Kacheln */
  --blue:#57c1ff; --blue-soft:rgba(87,193,255,.15);
  --red:#ff6161;  --red-soft:rgba(255,97,97,.15);
  --green:#59d499;--green-soft:rgba(89,212,153,.15);
  --yellow:#ffc533;--yellow-soft:rgba(255,197,51,.15);
  --stripe-a:#ff5757; --stripe-b:#a1131a;
  /* Radien */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:16px; --r-full:9999px;
  /* Abstände */
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px;
  --gut:16px;
  /* Bewegung */
  --dur-s:120ms; --dur-m:180ms; --ease:cubic-bezier(.2,0,0,1);
}

/* ---------- Grundfläche ---------- */
.phone{
  background:var(--canvas); color:var(--body);
  font-family:Inter,"DejaVu Sans",sans-serif;
  font-feature-settings:"calt","kern","liga","ss03";
  letter-spacing:.1px;
}
.sb{color:var(--ink)}
.hi{color:var(--ash)}
.scroll{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column}
.scroll > *{flex:none}

/* ---------- Signatur: rotes Streifenband, genau einmal ganz oben ---------- */
.stripes{position:absolute;left:0;right:0;top:0;height:150px;overflow:hidden;z-index:0;
  -webkit-mask-image:linear-gradient(180deg,#000 0 62%,transparent 100%);}
.stripes i{position:absolute;left:-28%;width:156%;display:block;
  background:linear-gradient(90deg,var(--stripe-a),var(--stripe-b));transform:rotate(10deg);transform-origin:center}
.stripes i:nth-child(1){top:22px;height:32px;opacity:1}
.stripes i:nth-child(2){top:60px;height:16px;opacity:.72}
.stripes i:nth-child(3){top:86px;height:9px;opacity:.42}
.stripes::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(7,8,10,.88) 0,rgba(7,8,10,.62) 34px,rgba(7,8,10,.1) 54px,rgba(7,8,10,0) 100px)}

/* ---------- Befehlsleiste oben ---------- */
.cmd{position:relative;z-index:2;display:flex;align-items:center;gap:9px;
  height:44px;margin:0 var(--gut);padding:0 8px 0 11px;
  background:var(--elev);border:1px solid var(--hair);border-radius:var(--r-md)}
.cmd.is-focus{border-color:var(--hair-strong)}
.cmd .lead{font-size:16px;color:var(--mute);flex:none}
.cmd .ph{flex:1;font-size:15px;color:var(--ash);white-space:nowrap;overflow:hidden}
.cmd .scope-chip{display:inline-flex;align-items:center;gap:5px;flex:none;
  background:var(--card);border:1px solid var(--hair);border-radius:var(--r-xs);
  padding:2px 7px;font-size:12.5px;font-weight:500;color:var(--on-dark-mute)}
.caret{width:1.5px;height:17px;background:var(--ink);flex:none;margin-right:-4px}

/* ---------- Bereichsleiste: Navigation mit Tastenkürzeln ---------- */
.scope{position:relative;z-index:2;display:flex;align-items:center;gap:4px;
  padding:10px 12px 2px;white-space:nowrap}
.tab{display:inline-flex;align-items:center;gap:5px;
  padding:5px 9px;border-radius:var(--r-full);
  font-size:13px;font-weight:500;color:var(--body);letter-spacing:.2px;
  transition:background var(--dur-s) var(--ease),color var(--dur-s) var(--ease)}
.tab .ic{font-size:14px;color:var(--mute)}
.tab .ava{width:14px;height:14px;border-radius:var(--r-full);background-color:var(--card);
  outline:1px solid var(--hair-soft);outline-offset:-1px;flex:none}
.tab.is-on{background:var(--elev);color:#fff}
.tab.is-on .ic{color:#fff}
.tab .key{margin-left:2px}

/* ---------- Tastenkappe ---------- */
.key{display:inline-flex;align-items:center;justify-content:center;
  font-family:Inter,"DejaVu Sans",sans-serif;
  height:19px;min-width:19px;padding:0 5px;
  background:linear-gradient(180deg,#121212,#0d0d0d);
  border:1px solid var(--hair);border-radius:var(--r-xs);
  font-size:11.5px;font-weight:500;line-height:1;color:var(--body);letter-spacing:.2px}
.key-inv{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.26);color:#18191a}

/* ---------- Gruppenüberschrift ---------- */
.grp{display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--gut);margin:20px 0 6px;
  font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.grp b{color:var(--stone);font-weight:500}

/* ---------- Befehlszeile ---------- */
.row{display:flex;align-items:center;gap:11px;margin:0 10px;padding:7px 10px;
  border-radius:var(--r-sm);
  transition:background var(--dur-s) var(--ease)}
.row.is-sel{background:var(--card);outline:1px solid var(--hair);outline-offset:-1px}
.tile{width:34px;height:34px;flex:none;border-radius:var(--r-md);background-color:var(--card);
  outline:1px solid var(--hair-soft);outline-offset:-1px;filter:saturate(.95)}
.tile-lg{width:44px;height:44px}
.tile-ic{display:grid;place-items:center;font-size:17px}
.acc-blue{color:var(--blue);background:var(--blue-soft)}
.acc-green{color:var(--green);background:var(--green-soft)}
.acc-yellow{color:var(--yellow);background:var(--yellow-soft)}
.acc-red{color:var(--red);background:var(--red-soft)}
.row-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-t{font-size:15px;font-weight:500;color:var(--ink);letter-spacing:.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-kind{font-size:12px;color:var(--stone);flex:none;letter-spacing:.2px}
.row-tag{flex:none;font-size:11.5px;color:var(--on-dark-mute);
  background:var(--elev);border:1px solid var(--hair);border-radius:var(--r-xs);padding:2px 6px}

/* ---------- Haarlinien-Karte (gruppierte Daten) ---------- */
.card{margin:0 var(--gut);background:var(--surface);border:1px solid var(--hair);
  border-radius:var(--r-lg);overflow:hidden}
.c-row{display:flex;align-items:center;gap:11px;padding:9px 11px;border-bottom:1px solid var(--hair)}
.c-row:last-child{border-bottom:0}
.c-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.c-t{font-size:14px;font-weight:500;color:var(--ink)}
.c-m{font-size:12px;color:var(--mute)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--body);flex:none}
.dot{width:6px;height:6px;border-radius:var(--r-full);background:var(--green);flex:none}
.dot-y{background:var(--yellow)}
.dot-off{background:none;box-sizing:border-box;border:1px solid var(--stone)}
.state-off{color:var(--stone)}
.c-foot{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--elev)}
.c-foot .lbl{font-size:12px;color:var(--mute);flex:none}
.bar{flex:1;height:3px;border-radius:2px;background:var(--hair);overflow:hidden}
.bar i{display:block;height:100%;width:69%;background:var(--body)}
.c-foot .val{font-size:12px;color:var(--body);flex:none;font-variant-numeric:tabular-nums}

/* ---------- Aktionsleiste unten (statt Tab-Leiste) ---------- */
.act{position:absolute;left:0;right:0;bottom:0;height:56px;padding:0 13px 12px;z-index:20;

  background:var(--canvas);border-top:1px solid var(--hair)}
.act-l{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--body)}
.act-r{display:inline-flex;align-items:center;gap:9px}
.act-i{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--body)}
.act-i.dim{color:var(--ash)}
.sep{width:1px;height:16px;background:var(--hair)}
.mark{width:18px;height:18px;flex:none;color:var(--mute)}

/* ---------- Startscreen ---------- */
.hello{position:relative;z-index:2;padding:56px var(--gut) 0}
.hello h1{font-family:"Inter Display",Inter,sans-serif;font-size:30px;font-weight:600;

.hello p{margin-top:6px;font-size:13px;color:var(--mute);letter-spacing:.1px}
.hello p b{color:var(--body);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- Filterpillen ---------- */
.chips{display:flex;gap:6px;padding:10px var(--gut) 0;white-space:nowrap}
.chip{padding:4px 10px;border-radius:var(--r-full);font-size:13px;color:var(--body);

.chip.is-on{background:var(--elev);color:#fff;font-weight:500}

/* ---------- Detail ---------- */
.crumb{position:relative;z-index:2;display:flex;align-items:center;gap:9px;padding:2px var(--gut) 0;height:40px}
.icon-btn{width:30px;height:30px;flex:none;border-radius:var(--r-md);
  background:var(--elev);border:1px solid var(--hair);
  display:grid;place-items:center;font-size:14px;color:var(--body);
  transition:background var(--dur-s) var(--ease)}
.cr-t{flex:1;min-width:0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-t .sl{color:var(--stone);margin:0 6px;font-style:normal}
.cr-t b{color:var(--ink);font-weight:500}
.frame{margin:10px var(--gut) 0;border:1px solid var(--hair);border-radius:var(--r-xl);
  overflow:hidden;background:var(--surface)}
.frame .pic{height:196px;filter:saturate(.93)}
.d-head{padding:14px var(--gut) 0}
.d-head h1{font-family:"Inter Display",Inter,sans-serif;font-size:26px;font-weight:600;
  line-height:1.15;letter-spacing:.2px;color:var(--ink)}
.badges{display:flex;gap:6px;margin-top:9px}
.badge{display:inline-flex;align-items:center;gap:5px;
  background:var(--elev);border:1px solid var(--hair);border-radius:var(--r-xs);
  padding:3px 7px;font-size:12px;color:var(--on-dark-mute)}
.badge .ic{font-size:13px;color:var(--mute)}
.acts{display:flex;align-items:center;gap:8px;padding:14px var(--gut) 0}
.btn-pri{flex:1;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--white);color:var(--on-primary);border-radius:var(--r-md);
  font-size:14px;font-weight:500;letter-spacing:.2px;
  transition:background var(--dur-s) var(--ease)}
.btn-ter{width:38px;height:38px;flex:none;border-radius:var(--r-md);
  background:var(--elev);border:1px solid var(--hair);
  display:grid;place-items:center;font-size:16px;color:var(--body)}
.tracks .c-row{padding:7px 11px}
.time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px var(--gut) 0}
.grid .ph{aspect-ratio:1/1;border-radius:var(--r-sm);background-color:var(--card);
  outline:1px solid var(--hair-soft);outline-offset:-1px;filter:saturate(.95)}

/* ---------- Bewegung: nüchtern, schnell, ohne Nachfedern ---------- */
@media (prefers-reduced-motion: no-preference){

  .stripes{animation:band 240ms var(--ease) both}

  .row:nth-of-type(3){animation-delay:40ms}

}
