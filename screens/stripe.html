<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Farben */
  --indigo:#533afd; --indigo-deep:#4434d4; --indigo-press:#2e2b8c; --indigo-soft:#665efd; --indigo-pale:#b9b9f9;
  --navy:#1c1e54; --ink:#0d253d; --ink-2:#273951; --mute:#64748d; --mute-2:#61718a;
  --canvas:#fff; --soft:#f6f9fc; --cream:#f5e9d4; --line:#e3e8ee; --line-input:#a8c3de;
  --ruby:#ea2261; --magenta:#f96bee; --sherbet:#f7b979; --lavender:#c8b8ff;
  /* Form */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-pill:9999px;
  /* Abstand */
  --s-xxs:2px; --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-xxl:32px;
  --pad:24px;
  /* Tiefe */
  --sh-1:0 1px 3px rgba(0,55,112,.08);
  --sh-2:0 8px 24px rgba(0,55,112,.08), 0 2px 6px rgba(0,55,112,.04);
  /* Bewegung */
  --dur-s:150ms; --dur-m:250ms; --dur-l:320ms; --ease:cubic-bezier(.2,.6,.3,1);
}

/* ---------- Grundlage ---------- */
.phone{
  background:var(--canvas); color:var(--ink);
  font-family:Inter,"DejaVu Sans",sans-serif; font-weight:300;
  font-feature-settings:"ss01"; letter-spacing:0;
}
.sb{color:var(--ink)}
.hi{color:var(--ink)}
.num{font-feature-settings:"tnum","ss01"; letter-spacing:-.39px}

.display{font-size:36px; font-weight:300; line-height:1.03; letter-spacing:-.9px}
.title{font-size:32px; font-weight:300; line-height:1.1; letter-spacing:-.64px}
.h-md{font-size:20px; font-weight:300; line-height:1.4; letter-spacing:-.2px}
.body{font-size:15px; font-weight:300; line-height:1.4}
.cap{font-size:13px; font-weight:400; line-height:1.4; letter-spacing:-.39px; color:var(--mute)}
.eyebrow{font-size:10px; font-weight:400; line-height:1.15; letter-spacing:.1px;
  text-transform:uppercase; color:var(--mute)}
.link{color:var(--indigo); font-size:15px; font-weight:400; line-height:1}

/* ---------- Verlaufs-Mesh ---------- */
.mesh{position:absolute; top:0; left:0; right:0; height:330px; overflow:hidden; z-index:0}
.mesh::before{
  content:""; position:absolute; inset:-120px -80px -70px;
  filter:blur(40px);
  background:
    radial-gradient(46% 76% at 0% 30%, #f8e6c4 0%, rgba(248,230,196,0) 70%),
    radial-gradient(36% 62% at 20% 62%, rgba(247,164,96,.92) 0%, rgba(247,164,96,0) 66%),
    radial-gradient(30% 50% at 40% 14%, rgba(252,214,172,.9) 0%, rgba(252,214,172,0) 68%),
    radial-gradient(32% 60% at 58% 70%, rgba(190,170,255,.9) 0%, rgba(190,170,255,0) 68%),
    radial-gradient(28% 44% at 76% 22%, rgba(249,130,230,.5) 0%, rgba(249,130,230,0) 68%),
    radial-gradient(30% 50% at 86% 84%, rgba(83,58,253,.46) 0%, rgba(83,58,253,0) 70%),
    radial-gradient(26% 42% at 100% 40%, rgba(234,34,97,.4) 0%, rgba(234,34,97,0) 70%),
    linear-gradient(180deg,#fdf6ec 0%,#faf2fb 58%,#fff 100%);
}
.mesh::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.74) 74%, #fff 100%);
}
.screen{position:relative; z-index:1; padding:0 var(--pad)}

/* ---------- Kopfzeile ---------- */
.top{display:flex; align-items:center; justify-content:space-between; height:36px}
.avatar{width:32px; height:32px; border-radius:var(--r-pill); border:1px solid rgba(13,37,61,.12)}
.ghost{width:32px; height:32px; border-radius:var(--r-pill); background:rgba(255,255,255,.72);
  border:1px solid var(--line); display:grid; place-items:center; font-size:17px; color:var(--ink-2);
  transition:background var(--dur-s) var(--ease), border-color var(--dur-s) var(--ease)}
.ghost:active{background:var(--soft); border-color:var(--line-input)}
.top-acts{display:flex; gap:8px; align-items:center}

/* ---------- Buttons ---------- */
.pill{display:inline-flex; align-items:center; gap:8px; border-radius:var(--r-pill);
  font-size:16px; font-weight:400; line-height:1; padding:12px 20px; min-height:44px;
  transition:background var(--dur-s) var(--ease), transform var(--dur-s) var(--ease)}
.pill-primary{background:var(--indigo); color:#fff}
.pill-primary:active{background:var(--indigo-press); transform:scale(.98)}
.pill-secondary{background:var(--canvas); color:var(--indigo); border:1px solid var(--indigo)}
.pill-sm{font-size:14px; padding:8px 16px; min-height:0}

/* ---------- Tag-Pill ---------- */
.tag{display:inline-block; background:var(--indigo-pale); color:var(--indigo-deep);
  font-size:10px; font-weight:400; line-height:1.15; letter-spacing:.1px; text-transform:uppercase;
  border-radius:var(--r-pill); padding:3px 8px; vertical-align:1px}

/* ---------- Kennzahlen-Karte ---------- */
.card{background:var(--canvas); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1)}
.stats{display:flex; padding:16px 0 14px}
.stat{flex:1; padding:0 16px; border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block; font-size:26px; font-weight:300; line-height:1.12; letter-spacing:-.26px;
  font-feature-settings:"tnum","ss01"; margin-top:4px}
.storage{border-top:1px solid var(--line); padding:14px 16px 16px}
.storage-head{display:flex; justify-content:space-between; align-items:baseline}
.bar{height:6px; border-radius:var(--r-pill); background:var(--soft); margin-top:10px; overflow:hidden}
.bar i{display:block; height:100%; width:69%; border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--indigo-soft),var(--indigo))}

/* ---------- Creme-Band ---------- */
.cream{background:var(--cream); border-radius:var(--r-lg); padding:14px; display:flex; gap:14px; align-items:flex-start}
.cream .thumb{width:100px; height:108px; border-radius:var(--r-md); flex:none}
.cream-body{min-width:0; flex:1}
.cream .pill-primary{box-shadow:none}

/* ---------- Haarlinien-Tabelle ---------- */
.sec-head{display:flex; align-items:center; justify-content:space-between; padding:0 0 8px}
.thead{display:flex; align-items:center; height:28px; background:var(--soft);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:0 calc(var(--pad) * -1); padding:0 var(--pad)}
.thead span{flex:1}
.thead span+span{flex:none}
.trow{display:flex; align-items:center; gap:12px; height:62px; border-bottom:1px solid var(--line)}
.trow .thumb{width:44px; height:33px; border-radius:var(--r-xs); flex:none}
.tmain{flex:1; min-width:0}
.tmain p{font-size:15px; font-weight:300; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tmeta{margin-top:3px; display:flex; align-items:center; gap:6px}
.tright{text-align:right; flex:none}
.tright b{display:block; font-size:14px; font-weight:400; line-height:1.3;
  font-feature-settings:"tnum","ss01"; letter-spacing:-.42px}
.tright span{display:block; font-size:11px; font-weight:300; line-height:1.4; color:var(--mute);
  font-feature-settings:"tnum","ss01"}

/* ---------- Quellen ---------- */
.src{display:flex; align-items:center; gap:10px; height:46px; border-bottom:1px solid var(--line); font-size:15px}
.src .ic{font-size:18px; color:var(--mute); flex:none}
.src .state{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--mute);
  letter-spacing:-.39px}
.dot{width:6px; height:6px; border-radius:var(--r-pill); background:var(--indigo); flex:none}
.dot.off{background:var(--mute)}

/* ---------- Suche ---------- */
.search{display:flex; align-items:center; gap:8px; height:40px; background:var(--canvas);
  border:1px solid var(--line-input); border-radius:var(--r-sm); padding:0 12px;
  transition:border-color var(--dur-s) var(--ease), box-shadow var(--dur-s) var(--ease)}
.search .ic{font-size:17px; color:var(--mute)}
.search span{font-size:15px; color:var(--mute)}
.search:focus-within{border-color:var(--indigo); box-shadow:0 0 0 3px rgba(83,58,253,.12)}

/* ---------- Segment-Schalter ---------- */
.seg{display:flex; background:var(--soft); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px}
.seg button{flex:1; text-align:center; font-size:13px; font-weight:300; color:var(--mute);
  padding:7px 4px; border-radius:var(--r-pill); letter-spacing:-.1px;
  transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease)}
.seg button.on{background:var(--canvas); color:var(--ink); font-weight:400;
  border:1px solid var(--line); box-shadow:var(--sh-1); padding:6px 4px}

/* ---------- Detail ---------- */
.back{display:flex; align-items:center; justify-content:space-between; height:36px}
.back a{display:inline-flex; align-items:center; gap:4px; color:var(--indigo); font-size:15px; font-weight:400}
.hero{width:100%; height:228px; border-radius:var(--r-lg); border:1px solid var(--line)}
.acts{display:flex; gap:10px; align-items:center}
.musicrow{display:flex; align-items:center; gap:12px; border:1px solid var(--line);
  border-radius:var(--r-md); padding:10px 12px}
.musicrow .cover{width:38px; height:38px; border-radius:var(--r-xs); flex:none}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px}
.grid i{display:block; height:104px; border-radius:var(--r-xs)}

/* ---------- Untere Leiste ---------- */
.nav{position:absolute; left:0; right:0; bottom:0; height:78px; background:var(--canvas);
  border-top:1px solid var(--line); display:flex; padding:10px 8px 0; z-index:20}
.nav a{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--mute);
  transition:color var(--dur-s) var(--ease)}
.nav .ic{font-size:22px}
.nav em{font-size:10px; font-style:normal; font-weight:400; letter-spacing:.1px}
.nav a.on{color:var(--indigo)}
.nav a.on em{font-weight:500}
.nav .avatar{width:22px; height:22px; border:1px solid var(--line)}

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference){
  .screen > *{animation:rise var(--dur-l) var(--ease) both}
  .screen > *:nth-child(2){animation-delay:40ms}
  .screen > *:nth-child(3){animation-delay:80ms}
  .screen > *:nth-child(4){animation-delay:120ms}
  .screen > *:nth-child(5){animation-delay:160ms}
  .mesh::before{animation:drift 24s ease-in-out infinite alternate}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)} to{transform:translate3d(-22px,10px,0) scale(1.06)}}
}
