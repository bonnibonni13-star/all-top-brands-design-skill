<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<title>Musterscreens Pinterest</title>
<style>
/* =====================================================================
   Musterscreens im Stil von Pinterest – warm-cremefarbene Hülle um ein
   Masonry-Raster. Werte aus der Markendatei: drei Radien (16/32/voll),
   8-px-Fuge, ein Rot nur für die Hauptaktion, keine Schatten, keine
   scharfen Ecken, Gewichte 400/500/600/700, −1,2 px bei Überschriften.
   App-Muster (Tableiste unten ohne Beschriftung, Angabenzeile unter der
   Kachel) sind im Profil als App-Muster der Marke gekennzeichnet.
   ===================================================================== */
:root {
  /* Farben */
  --red: #e60023;              /* einzige gesättigte Farbe: Hauptaktion */
  --red-press: #cc001f;
  --ink: #000000;
  --body: #33332e;
  --mute: #62625b;             /* Angaben */
  --ash: #91918c;              /* Platzhalter */
  --hairline: #dadad3;
  --canvas: #ffffff;
  --soft: #fbfbf9;             /* Seitenwäsche */
  --card: #f6f6f3;             /* Kacheln, Felder, Chips */
  --secondary: #e5e5e0;
  --secondary-press: #c8c8c1;
  --focus: #435ee5;

  /* Schrift: Pin Sans → Inter (metrisch nächster freier Ersatz) */
  --font: Inter, "DejaVu Sans", sans-serif;
  --font-display: "Inter Display", Inter, sans-serif;

  /* Genau drei Radien */
  --r-md: 16px;
  --r-lg: 32px;
  --r-full: 9999px;

  /* Abstände */
  --s-4: 4px; --s-6: 6px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-24: 24px; --s-32: 32px;
  --gutter: 16px;
  --gap: 8px;                  /* die eine Rasterfuge */

  /* Bewegung (Empfehlung) */
  --dur-s: 180ms;
  --dur-m: 320ms;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

/* ---------- Grundlagen ---------- */
.phone { background: var(--soft); color: var(--ink); font: 400 16px/1.4 var(--font); }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }
:where(.phone) :where(button) { cursor: pointer; }
.sb, .hi { color: var(--ink); }

/* ---------- Kopfzeile: Pillen-Suchfeld + runder Icon-Knopf ---------- */
.head { position: absolute; left: var(--gutter); right: var(--gutter); top: 54px; display: flex; align-items: center; gap: var(--s-8); }
.search {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px;
  background: var(--card); border-radius: var(--r-full); color: var(--ash);
  transition: background-color var(--dur-s) var(--ease);
}
.search .ic { font-size: 20px; color: var(--ink); }
.search span { flex: 1; min-width: 0; font: 400 16px/1.4 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* runder Icon-Knopf: 40 px, Fläche Creme, voller Radius */
.round-btn {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-full);
  background: var(--card); color: var(--ink); font-size: 20px;
  transition: background-color var(--dur-s) var(--ease), transform var(--dur-s) var(--ease);
}
.round-btn:active { background: var(--secondary-press); transform: scale(.96); }
.round-btn-plain { background: var(--canvas); }

/* ---------- Typografie-Rollen ---------- */
.h-page { font: 700 28px/1.2 var(--font-display); letter-spacing: -1.2px; color: var(--ink); }
.h-card { font: 600 22px/1.25 var(--font-display); color: var(--ink); }
.h-section { font: 600 18px/1.3 var(--font); color: var(--ink); }
.meta { font: 400 14px/1.4 var(--font); color: var(--mute); }
.count { font: 700 14px/1.4 var(--font); color: var(--ink); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 6px 16px;
  border-radius: var(--r-md); font: 700 14px/1 var(--font);
  transition: background-color var(--dur-s) var(--ease), transform var(--dur-s) var(--ease);
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--red); color: var(--canvas); }
.btn-primary:active { background: var(--red-press); }
.btn-secondary { background: var(--secondary); color: var(--ink); }
.btn-secondary:active { background: var(--secondary-press); }
.btn .ic { font-size: 17px; }

/* ---------- Pin-Karte: das Bild IST die Karte ---------- */
.pin { position: relative; display: block; border-radius: var(--r-md); overflow: hidden; background-color: var(--card); }
.pin-lg { border-radius: var(--r-lg); }
/* weiße Overlay-Pille – die Marken-Geste */
.overlay-pill {
  position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px);
  padding: 6px 12px; border-radius: var(--r-full); background: var(--canvas); color: var(--ink);
  font: 700 12px/1 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.overlay-pill-top { top: 12px; bottom: auto; left: 12px; }
.pin-action { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-full); background: var(--canvas); color: var(--ink); font-size: 16px; }
.pin-lg .pin-action { right: 14px; top: 14px; width: 40px; height: 40px; font-size: 19px; }
/* Angabenzeile unter der Kachel (App-Muster der Marke) */
.pin-meta { display: block; padding: 6px 8px 0; font: 500 12px/1.5 var(--font); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Masonry: Spalten verschiedener Höhe, 8-px-Fuge ---------- */
.masonry { position: absolute; left: var(--gutter); right: var(--gutter); display: flex; gap: var(--gap); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
.col-offset { padding-top: 34px; }      /* versetzter Spaltenanfang – der Masonry-Rhythmus */
.ar-1-1 .pin { aspect-ratio: 1 / 1; }
.ar-4-5 .pin { aspect-ratio: 4 / 5; }
.ar-3-4 .pin { aspect-ratio: 3 / 4; }
.ar-2-3 .pin { aspect-ratio: 2 / 3; }

/* ---------- Chips: Pillen, aktiv komplett invertiert ---------- */
.chip-row { gap: var(--s-8); padding-left: var(--gutter); }
.chip {
  flex: none; display: inline-flex; align-items: center; height: 38px; padding: 8px 16px;
  border-radius: var(--r-full); background: var(--card); color: var(--ink); font: 700 14px/1 var(--font);
  transition: background-color var(--dur-s) var(--ease), color var(--dur-s) var(--ease);
}
.chip.is-active { background: var(--ink); color: var(--canvas); }

/* ---------- Tableiste unten: nur Icons, aktiv gefüllt plus Punkt ---------- */
.tab-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; height: 64px; padding-top: 10px;
  display: flex; background: var(--canvas); border-top: 1px solid var(--hairline);
}
.tab { position: relative; flex: 1; display: flex; justify-content: center; align-items: flex-start; color: var(--ash); font-size: 26px; }
.tab.is-active { color: var(--ink); }
.tab.is-active::after { content: ""; position: absolute; left: 50%; top: 34px; width: 4px; height: 4px; margin-left: -2px; border-radius: var(--r-full); background: var(--ink); }

/* ---------- Detail ---------- */
.detail-top { position: absolute; left: var(--gutter); right: var(--gutter); top: 54px; display: flex; align-items: center; justify-content: space-between; }
.detail-top .round-btn { background: var(--card); }
.top-group { display: flex; gap: var(--s-8); }
/* cremefarbene Zeilenkarte statt Trennlinie */
.row-card { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: var(--r-md); background: var(--card); }
.row-card .thumb { flex: none; width: 48px; height: 48px; border-radius: 12px; background-color: var(--secondary); background-size: cover; }
.row-card .row-main { flex: 1; min-width: 0; }
.row-card small { display: block; font: 500 12px/1.5 var(--font); color: var(--mute); }
.row-card b { display: block; font: 700 14px/1.4 var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-card .round-btn { width: 36px; height: 36px; background: var(--canvas); font-size: 17px; }

/* Fokus: 2 px Tinte innen, 4 px Ring außen – der doppelte Ring des Systems */
.phone :focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; box-shadow: inset 0 0 0 2px var(--ink); }

/* ---------- Bewegung: Kacheln steigen spaltenweise versetzt auf ---------- */
@media (prefers-reduced-motion: no-preference) {
  .col > *, .head, .h-page, .feature, .chip-row, .count, .row-card { animation: rise var(--dur-m) var(--ease) both; }
  .col:nth-child(2) > * { animation-delay: 40ms; }
  .col > :nth-child(2) { animation-delay: 80ms; }
  .col:nth-child(2) > :nth-child(2) { animation-delay: 120ms; }
  .col > :nth-child(n+3) { animation-delay: 160ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style></head>
