<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }

<style>
:root{
  /* Drei Leinwände: Indigo – Weiß – Petrol */
  --indigo:#1b1938; --indigo-deep:#0e0c1f; --violet:#c9b4fa;
  --teal:#0e3030; --teal-mid:#155555;
  --canvas:#ffffff; --canvas-soft:#fafaf8;
  --ink:#292827; --ink-mute:#73706d; --ink-faint:#9a9794;
  --hair:#e8e4dd; --hair-dark:#3f3a52;
  --on-dark:#ffffff; --on-dark-mute:#bcbac9; --on-dark-faint:#5a5772;
  /* Form */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
  /* Raster */
  --s-xxs:2px; --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-xxl:32px;
  --pad:24px;
  /* Schrift: eine Familie, Zwischen-Gewichte, dichtes Display */
  --font:"Inter","DejaVu Sans",sans-serif;
  --font-display:"Inter Display","Inter",sans-serif;
  /* Bewegung: bewusst langsam */
  --dur-s:180ms; --dur-m:320ms; --ease:cubic-bezier(.22,1,.36,1);
}

.phone{ font-family:var(--font); background:var(--canvas); color:var(--ink); }

/* ---------- Typografie: Display dicht gestapelt ---------- */
.display{ font-family:var(--font-display); font-size:32px; font-weight:500; line-height:.96;
  letter-spacing:-1.1px; }
.display-lg{ font-family:var(--font-display); font-size:40px; font-weight:500; line-height:.98;
  letter-spacing:-1.3px; }
.display-sm{ font-family:var(--font-display); font-size:22px; font-weight:500; line-height:1.14;
  letter-spacing:-.45px; }
.heading{ font-size:20px; font-weight:500; line-height:1.2; letter-spacing:-.4px; }
.body{ font-size:16px; font-weight:400; line-height:1.5; }
.caption{ font-size:14px; font-weight:400; line-height:1.4; color:var(--ink-mute); }
.micro{ font-size:12px; font-weight:600; line-height:1.4; letter-spacing:.02em; }

/* ---------- Icons: sehr fein, nie gefüllt ---------- */
.ic{ font-size:21px; }

/* ---------- Knöpfe: 8-px-Rechteck; Pille nur auf der dunklen Bühne ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 20px;
  border-radius:var(--r-md); font-size:15px; font-weight:700; line-height:1;
  transition:background-color var(--dur-s) var(--ease); }
.btn .ic{ font-size:18px; }
.btn-dark{ background:var(--indigo); color:var(--on-dark); }
.btn-dark:active{ background:var(--indigo-deep); }
.btn-on-teal{ background:var(--canvas); color:var(--teal); }
.btn-outline{ background:var(--canvas); color:var(--ink); box-shadow:inset 0 0 0 1px var(--hair); }
.pill-cta{ display:inline-flex; align-items:center; justify-content:center; gap:9px; height:46px; padding:0 22px;
  border-radius:var(--r-full); background:var(--violet); color:var(--indigo);
  font-size:15px; font-weight:700; line-height:1; }
.pill-cta .ic{ font-size:18px; }
.icon-btn{ width:38px; height:38px; flex:none; display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-md); color:var(--on-dark); }

/* ---------- Dunkle Bühne mit Violett-Himmel und halb angeschnittenem Bild ---------- */
.hero{ position:relative; overflow:hidden; color:var(--on-dark);
  background:
    radial-gradient(86% 64% at 70% 4%, rgba(201,180,250,.58) 0%, rgba(132,112,208,.3) 34%, rgba(27,25,56,0) 72%),
    linear-gradient(180deg, #221f45 0%, var(--indigo) 46%, var(--indigo-deep) 100%); }
/* Das Bild blendet links weich in die Leinwand aus – Maske statt harter Kante */
.portrait{ position:absolute; inset:0 0 0 44%; background-size:cover; background-position:50% 24%;
  -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.3) 24%, rgba(0,0,0,.9) 62%, #000 100%);
  mask-image:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.3) 24%, rgba(0,0,0,.9) 62%, #000 100%); }
.portrait::after{ content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(27,25,56,.72) 0%, rgba(27,25,56,.3) 52%, rgba(27,25,56,.16) 100%); }
.hero .inner{ position:relative; z-index:2; }
.portrait.tint::after{ background:linear-gradient(90deg, rgba(27,25,56,.8) 0%, rgba(27,25,56,.5) 52%, rgba(27,25,56,.4) 100%); }

/* ---------- Leiste oben: Textziele mit Unterstrich ---------- */
.topnav{ display:flex; align-items:center; gap:20px; height:50px; padding:0 var(--pad); }
.topnav a{ font-size:15px; font-weight:500; letter-spacing:-.1px; color:var(--on-dark-mute);
  padding-bottom:4px; border-bottom:2px solid transparent; }
.topnav a.on{ color:var(--on-dark); border-bottom-color:var(--violet); }
.topnav .avatar{ margin-left:auto; }
.topnav.light a{ color:var(--ink-mute); }
.topnav.light a.on{ color:var(--ink); border-bottom-color:var(--indigo); }
.topnav.light{ border-bottom:1px solid var(--hair); }
.avatar{ width:32px; height:32px; flex:none; border-radius:var(--r-full); background-color:var(--canvas-soft);
  background-size:cover; background-position:50% 22%; }

.hero .copy{ padding:28px var(--pad) 26px; max-width:248px; }
.hero .micro{ color:var(--on-dark-mute); }
.hero .caption{ color:var(--on-dark-mute); }

/* ---------- Heller Mittelteil ---------- */
.mid{ padding:22px var(--pad) 0; }
.mid-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
.mid-head .link{ margin-left:auto; font-size:14px; font-weight:500; color:var(--ink);
  text-decoration:underline; text-underline-offset:3px; }

/* Wechselzeilen auf #fafaf8 mit 8-px-Ecken */
.alt{ display:flex; align-items:center; gap:14px; height:62px; padding:0 12px; border-radius:var(--r-md); }
.alt:nth-child(odd){ background:var(--canvas-soft); }
.alt .thumb{ width:42px; height:42px; flex:none; border-radius:var(--r-md); }
.alt .txt{ min-width:0; flex:1; }
.alt .txt b{ display:block; font-size:16px; font-weight:500; letter-spacing:-.2px; }
.alt .txt span{ display:block; font-size:13px; color:var(--ink-mute); margin-top:2px; }
.alt .ic{ font-size:16px; color:var(--ink-faint); flex:none; }

/* ---------- Petrol-Abschlussband ---------- */
.teal{ position:absolute; left:0; right:0; bottom:0; background:var(--teal); color:var(--on-dark);
  padding:20px var(--pad) 26px; }
.teal .micro{ color:rgba(255,255,255,.62); }
.teal .track{ height:3px; border-radius:var(--r-full); background:var(--teal-mid); margin-top:14px;
  overflow:hidden; }
.teal .track i{ display:block; height:100%; width:69%; background:var(--on-dark); }
.teal .foot{ display:flex; align-items:center; gap:12px; margin-top:14px; }
.teal .foot .caption{ color:rgba(255,255,255,.62); flex:1; }

/* ---------- Suche und Pillen-Filter ---------- */
.search{ display:flex; align-items:center; gap:10px; height:46px; padding:0 14px; border-radius:var(--r-sm);
  background:var(--canvas); box-shadow:inset 0 0 0 1px var(--hair); color:var(--ink-faint); font-size:16px; }
.search .ic{ font-size:19px; color:var(--ink-mute); }
.pills{ display:flex; gap:7px; }
.pills button{ height:34px; padding:0 13px; border-radius:var(--r-full); font-size:12.5px; font-weight:600;
  color:var(--ink); background:var(--canvas); box-shadow:inset 0 0 0 1px var(--hair);
  transition:background-color var(--dur-s) var(--ease); }
.pills button.on{ background:var(--indigo); color:var(--on-dark); box-shadow:none; }

/* ---------- Editoriale Zeilen: viel Luft, Haarlinie als Trenner ---------- */
.ed{ display:flex; align-items:center; gap:16px; padding:14px 0; border-top:1px solid var(--hair); }
.ed:first-of-type{ border-top:0; }
.ed .thumb{ width:56px; height:56px; flex:none; border-radius:var(--r-md); }
.ed .txt{ min-width:0; flex:1; }
.ed .txt .t{ display:block; font-size:20px; font-weight:500; letter-spacing:-.4px; line-height:1.2; }
.ed .txt .m{ display:block; font-size:14px; color:var(--ink-mute); margin-top:4px; }
.ed .ic{ font-size:17px; color:var(--ink-faint); flex:none; }

/* ---------- Detail ---------- */
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
.grid .photo{ aspect-ratio:1/1; border-radius:var(--r-md); }
.hero .acts{ position:absolute; top:46px; right:calc(var(--pad) - 9px); height:50px; display:flex; align-items:center; gap:4px;
  z-index:3; }

/* ---------- Bewegung: 10 px herauf, 70 ms Staffelung ---------- */
@media (prefers-reduced-motion: no-preference){
  .hero .copy > *, .mid > *{ animation:rise var(--dur-m) var(--ease) both; }
  .hero .copy > *:nth-child(2){ animation-delay:70ms; }
  .hero .copy > *:nth-child(3){ animation-delay:140ms; }
  .hero .copy > *:nth-child(4){ animation-delay:210ms; }
  .teal{ animation:fade var(--dur-m) var(--ease) 140ms both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
}
</style></head>
