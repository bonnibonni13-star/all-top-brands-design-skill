<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* ==========================================================================
   xAI – Designsprache als App-Vorlage
   Werte aus references/x.ai.md (Farben, Radien, Abstände, Typo-Leiter).
   App-Muster, Icons und Bewegung = Empfehlung aus dem Profil.
   ========================================================================== */
:root {
  /* Flächen – eine einzige fast schwarze Leinwand, darüber Stufen */
  --canvas: #0a0a0a;
  --canvas-card: #191919;
  --canvas-soft: #1a1c20;
  --canvas-mid: #363a3f;
  --canvas-midnight: #0d1726;
  /* Haarlinie und Umrisse: nie deckendes Weiß */
  --hairline: #212327;
  --edge: rgba(255, 255, 255, .25);
  --edge-strong: rgba(255, 255, 255, .45);
  --edge-soft: rgba(255, 255, 255, .12);
  /* Text */
  --ink: #ffffff;
  --body: #dadbdf;
  --mute: #7d8187;
  /* Abendrot – nur als winziges Illustrations-Detail */
  --sunset: #ff7a17;
  --sunset-soft: #ffc285;
  --dusk: #7c3aed;
  --twilight: #c4b5fd;
  --breeze: #a0c3ec;
  /* Schrift */
  --font: "Inter", sans-serif;
  --font-display: "Inter Display", "Inter", sans-serif;
  --font-mono: "DejaVu Sans Mono", monospace;
  /* Radien: 0 · 8 · Pill */
  --r-sm: 8px;
  --r-pill: 9999px;
  /* Abstände (4-px-Basis) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-6: 24px;
  --s-8: 32px;
  --gutter: 24px;
  /* Bewegung (Empfehlung) */
  --dur-s: 160ms;
  --dur-m: 280ms;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

/* ---------- Grundlage ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 400 14px/1.45 var(--font); }
.phone .sb, .phone .hi { color: var(--ink); }
:where(.phone) :where(h1, h2, h3, p) { margin: 0; }
.ic-l { stroke-width: 1.25; }
.tnum { font-variant-numeric: tabular-nums; }

/* Mono-Versalien: Eyebrow, Label, Kennzahl, Status – die zweite Stimme */
.mono { font-family: var(--font-mono); text-transform: uppercase; }
.eyebrow { font: 400 11px/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--mute); }
.eyebrow--ink { color: var(--ink); }
.meta { font: 400 11px/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 1.1px; color: var(--mute);
  white-space: nowrap; }

/* Titel: nur Gewicht 400, negative Laufweite */
.display { font: 400 42px/1 var(--font-display); letter-spacing: -1.05px; }
.display--md { font-size: 32px; letter-spacing: -.6px; }
.subhead { font: 400 20px/1.3 var(--font-display); letter-spacing: -.3px; }

/* ---------- Bänder und Haarlinien ---------- */
.band { padding: 14px var(--gutter) 16px; }
.band + .band { border-top: 1px solid var(--hairline); }
.band-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4); }

/* ---------- Kopfzeile ---------- */
.top { display: flex; align-items: center; justify-content: space-between;
  padding: 2px var(--gutter) 14px; }
.top-greet { display: flex; flex-direction: column; gap: 3px; }
.avatar { width: 34px; height: 34px; border-radius: var(--r-pill); background-color: var(--canvas-soft);
  box-shadow: 0 0 0 1px var(--edge); }

/* ---------- Pills: die einzige Interaktionsform ---------- */
.pill { display: inline-flex; align-items: center; gap: var(--s-2); height: 40px; padding: 0 18px;
  border-radius: var(--r-pill); box-shadow: inset 0 0 0 1px var(--edge);
  font: 400 14px/1 var(--font); color: var(--ink); white-space: nowrap;
  transition: box-shadow var(--dur-s) var(--ease), background-color var(--dur-s) var(--ease); }
.pill:hover { box-shadow: inset 0 0 0 1px var(--edge-strong); background: var(--canvas-soft); }
.pill--solid { background: var(--ink); color: var(--canvas); box-shadow: inset 0 0 0 1px var(--ink); }
.pill--solid:hover { background: #fafaf7; }
.pill--sm { height: 32px; padding: 0 14px; font-size: 13px; }
.pill .ic { font-size: 15px; }
.circle { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-pill);
  box-shadow: inset 0 0 0 1px var(--edge); font-size: 17px; color: var(--ink);
  transition: box-shadow var(--dur-s) var(--ease), background-color var(--dur-s) var(--ease); }
.circle:hover { box-shadow: inset 0 0 0 1px var(--edge-strong); background: var(--canvas-soft); }

/* ---------- Bilder: immer gerahmte Abbildungen, nie randlos ---------- */
.figure { border-radius: var(--r-sm); background-color: var(--canvas-soft);
  box-shadow: inset 0 0 0 1px var(--edge-soft); overflow: hidden; }
.figure--hero { aspect-ratio: 16 / 9; }
.thumb { width: 48px; height: 48px; border-radius: var(--r-sm); background-color: var(--canvas-soft);
  box-shadow: inset 0 0 0 1px var(--edge-soft); flex: none; }

/* ---------- Start: Hero-Band ---------- */
.hero-title { margin-top: 10px; }
.hero-sub { margin-top: 8px; color: var(--body); font-size: 14px; }
.hero-fig { margin-top: 12px; }
.hero-actions { margin-top: 14px; display: flex; gap: var(--s-2); }

/* ---------- Kennzahlen in Mono ---------- */
.figures { margin-top: 14px; display: flex; }
.figures li { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.figures li + li { padding-left: 16px; box-shadow: inset 1px 0 0 0 var(--hairline); }
.fig-num { font: 400 22px/1 var(--font-mono); letter-spacing: -.4px; }
.fig-lab { font: 400 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--mute); }

/* Speicher: der einzige Abendrot-Verlauf im ganzen Screen */
.store { margin-top: 16px; }
.store-row { display: flex; align-items: baseline; justify-content: space-between; }
.store-track { margin-top: 8px; height: 2px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
.store-fill { height: 2px; width: 69%; background: linear-gradient(90deg, var(--dusk), var(--sunset) 70%, var(--sunset-soft)); }

/* ---------- Quellen-Zeilen ---------- */
.src { margin-top: 12px; }
.src li { display: flex; align-items: center; gap: var(--s-3); height: 44px;
  border-bottom: 1px solid var(--hairline); }
.src li:last-child { border-bottom: 0; }
.src .ic { font-size: 17px; color: var(--mute); }
.src-name { flex: 1; font-size: 15px; }
.dot { width: 5px; height: 5px; border-radius: var(--r-pill); background: var(--mute); display: inline-block;
  margin-right: 7px; vertical-align: 1px; }
.dot--live { background: var(--sunset); }

/* ---------- Bibliothek: Suche, Filter, Werkzeugzeile ---------- */
.search { display: flex; align-items: center; gap: var(--s-3); height: 46px; padding: 0 var(--s-4);
  background: var(--canvas-soft); border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px var(--hairline);
  color: var(--mute); font-size: 15px; transition: box-shadow var(--dur-s) var(--ease); }
.search:hover { box-shadow: inset 0 0 0 1px var(--edge-strong); }
.search .ic { font-size: 17px; }
.filters { display: flex; gap: var(--s-2); overflow: hidden; }
.filters .pill--sm { box-shadow: inset 0 0 0 1px var(--edge-soft); color: var(--mute); }
.filters .is-on { background: var(--canvas-mid); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge-strong); }
.toolbar { display: flex; align-items: center; justify-content: space-between;
  padding: 14px var(--gutter) 12px; border-bottom: 1px solid var(--hairline); }
.toolbar .ic { font-size: 13px; }
.sort { display: inline-flex; align-items: center; gap: 6px; color: var(--body); }

/* ---------- Index-Liste mit Mono-Nummern ---------- */
.index li { display: flex; align-items: center; gap: var(--s-3); height: 76px; padding: 0 var(--gutter);
  border-bottom: 1px solid var(--hairline);
  transition: background-color var(--dur-s) var(--ease); }
.index li:hover { background: #111113; }
.idx-no { width: 22px; font: 400 11px/1 var(--font-mono); letter-spacing: .8px; color: var(--mute); flex: none; }
.idx-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.idx-body .meta { font-size: 10px; letter-spacing: .8px; overflow: hidden; text-overflow: ellipsis; }
.idx-title { font: 400 17px/1.2 var(--font); letter-spacing: -.2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idx-right { font: 400 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 1px;
  color: var(--body); flex: none; }

/* ---------- Detail ---------- */
.detail-top { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--gutter) 16px; }
.path { flex: 1; font: 400 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--mute); }
.path b { font-weight: 400; color: var(--ink); }
.seg { display: flex; gap: var(--s-2); margin-top: 18px; }
.seg .pill--sm { box-shadow: inset 0 0 0 1px var(--edge-soft); color: var(--mute); }
.seg .is-on { background: var(--canvas-mid); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge-strong); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 16px; }
.grid .photo { aspect-ratio: 1; border-radius: var(--r-sm); background-color: var(--canvas-soft);
  box-shadow: inset 0 0 0 1px var(--edge-soft); }
.stat-row { margin-top: 10px; display: flex; gap: 14px; }
.stat-row span { font: 400 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 1.1px; color: var(--mute); }

/* ---------- Schwebende Pill-Navigation (Empfehlung) ---------- */
.nav { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 20;
  display: flex; gap: 2px; padding: 4px; height: 48px; align-items: center;
  border-radius: var(--r-pill); background: rgba(10, 10, 10, .92);
  box-shadow: inset 0 0 0 1px var(--edge); backdrop-filter: blur(12px); }
.nav a { display: inline-flex; align-items: center; height: 40px; padding: 0 20px; border-radius: var(--r-pill);
  font: 400 14px/1 var(--font); color: var(--mute);
  transition: background-color var(--dur-s) var(--ease), color var(--dur-s) var(--ease); }
.nav .is-on { background: var(--canvas-mid); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge-strong); }
/* Inhalte laufen unter der Leiste aus */
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 10; pointer-events: none;
  background: linear-gradient(180deg, rgba(10,10,10,0), rgba(10,10,10,.86) 46%, var(--canvas) 64%); }

/* Musik-Pill des Detailscreens: gleiche Form wie die Navigation */
.music { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 30px; z-index: 20;
  display: flex; align-items: center; gap: var(--s-3); height: 56px; padding: 0 8px 0 8px;
  border-radius: var(--r-pill); background: rgba(10, 10, 10, .92);
  box-shadow: inset 0 0 0 1px var(--edge); backdrop-filter: blur(12px); }
.music .thumb { width: 40px; height: 40px; }
.music-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.music-name { font: 400 14px/1 var(--font); }
.music-play { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-pill);
  background: var(--ink); color: var(--canvas); font-size: 16px; flex: none; }

/* ---------- Bewegung: Einblenden mit kleiner Staffelung ---------- */
@media (prefers-reduced-motion: no-preference) {

  .band, .index li, .nav, .music { animation: rise var(--dur-m) var(--ease) both; }
  .index li:nth-child(2) { animation-delay: 40ms; }
  .index li:nth-child(3) { animation-delay: 80ms; }
  .index li:nth-child(4) { animation-delay: 120ms; }
  .index li:nth-child(5) { animation-delay: 160ms; }
  .index li:nth-child(6) { animation-delay: 200ms; }
  .index li:nth-child(7) { animation-delay: 240ms; }
  .index li:nth-child(8) { animation-delay: 280ms; }
}
