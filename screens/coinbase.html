<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* =====================================================================
   Musterscreens im Stil von Coinbase – institutionell, hell, fast
   monochrom. Werte aus der Markendatei (Farben, Radien, Abstände,
   Typo-Skala). App-Muster (Pillen-Navigation unten, Kreisbild in der
   Zeile, Blatt-Aufbau) sind Empfehlungen aus Charakter und Geometrie.
   Leitsätze: Display in Gewicht 400, jede Zahl in Mono, genau ein
   schwarzes Band pro Screen, Blau nur ein- bis zweimal.
   ===================================================================== */
:root {
  /* Farben (Markendatei) */
  --primary: #0052ff;
  --primary-active: #003ecc;
  --ink: #0a0b0d;
  --body: #5b616e;
  --muted: #7c828a;
  --muted-soft: #a8acb3;
  --hairline: #dee1e6;
  --hairline-soft: #eef0f3;
  --canvas: #ffffff;
  --surface-soft: #f7f7f7;
  --surface-strong: #eef0f3;
  --dark: #0a0b0d;
  --dark-elevated: #16181c;
  --on-dark: #ffffff;
  --on-dark-soft: #a8acb3;
  --up: #05b169;
  --down: #cf202f;

  /* Schrift: CoinbaseDisplay/Sans → Inter (laut Datei), CoinbaseMono → Mono */
  --font: Inter, "DejaVu Sans", sans-serif;
  --font-display: "Inter Display", Inter, sans-serif;
  --font-mono: "DejaVu Sans Mono", monospace;

  /* Radien */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-pill: 100px;
  --r-full: 9999px;

  /* Abstände (4-px-Basis) */
  --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-20: 20px;
  --s-24: 24px; --s-32: 32px;
  --gutter: 24px;

  /* Die eine Schattenstufe des Systems */
  --shadow: 0 4px 12px rgba(0, 0, 0, .04);

  /* Bewegung (Empfehlung – Datei macht keine Angaben) */
  --dur-s: 160ms;
  --dur-m: 280ms;
  --ease: cubic-bezier(.25, .1, .25, 1);
}

/* ---------- Grundlagen ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 400 16px/1.5 var(--font); }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }
.ic { stroke-width: 1.75; }
.mono { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- Kopfzeile ---------- */
.top { display: flex; align-items: center; justify-content: space-between; padding: 2px var(--gutter) 0; height: 44px; }
.avatar { width: 34px; height: 34px; border-radius: var(--r-full); background-color: var(--surface-strong); }
.icon-btn { width: 36px; height: 36px; border-radius: var(--r-full); display: grid; place-items: center;
  font-size: 19px; color: var(--ink); background: var(--surface-strong); transition: background var(--dur-s) var(--ease); }
.icon-btn.plain { background: none; }

/* ---------- Titel ---------- */
.lede { padding: 10px var(--gutter) 0; }
.h-display { font: 400 34px/1.06 var(--font-display); letter-spacing: -1px; }
.h-page { font: 400 32px/1.13 var(--font-display); letter-spacing: -.5px; }
.lede .meta { margin-top: 8px; font-size: 13px; color: var(--muted); }

/* ---------- Signatur: schwarzes Band mit schwebender Karte ---------- */
.band { background: var(--dark); color: var(--on-dark); padding: 20px 16px 22px; margin-top: 20px; }
.band-head { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s-8) var(--s-12); }
.badge { display: inline-block; background: var(--surface-strong); color: var(--ink);
  font: 600 11px/1.5 var(--font); letter-spacing: .07em; text-transform: uppercase;
  border-radius: var(--r-pill); padding: 4px 12px; }
.badge.on-dark { background: var(--dark-elevated); color: var(--on-dark); }
.badge.invert { background: var(--ink); color: var(--canvas); }
.band-head .when { font-size: 12px; color: var(--on-dark-soft); }

.ui-card { background: var(--dark-elevated); border-radius: var(--r-xl); padding: 12px; }
.ui-card .shot { height: 104px; border-radius: var(--r-lg); filter: brightness(.94); }
.ui-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 8px 2px; }
.ui-card .title { font: 600 18px/1.33 var(--font); }
.ui-card .sub { font-size: 13px; color: var(--on-dark-soft); margin-top: 2px; }

/* ---------- Buttons ---------- */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 20px; border-radius: var(--r-pill);
  font: 600 16px/1.15 var(--font); transition: background var(--dur-s) var(--ease); }
.pill.primary { background: var(--primary); color: #fff; }
.pill.primary:active { background: var(--primary-active); }
.pill.sm { height: 38px; padding: 0 18px; font-size: 15px; }
.pill.outline-dark { border: 1px solid rgba(255,255,255,.22); color: var(--on-dark); }
.circle-dark { width: 48px; height: 48px; border-radius: var(--r-full); display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.22); color: var(--on-dark); font-size: 20px; flex: none; }
.circle-dark.solid { background: var(--dark-elevated); border-color: transparent; width: 40px; height: 40px; font-size: 18px; }

/* ---------- Abschnitte auf Weiß ---------- */
.sec { padding: 22px var(--gutter) 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.sec-head h2 { font: 600 18px/1.33 var(--font); }
.sec-head .val { font-size: 15px; color: var(--body); }

/* Speicherbalken */
.bar { height: 4px; border-radius: var(--r-pill); background: var(--surface-strong); margin-top: 12px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 69%; background: var(--ink); border-radius: var(--r-pill); }
.bar-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }
.bar-legend .up { color: var(--up); }

/* ---------- Werte-Zeile (Leitkomponente) ---------- */
.rows { margin-top: 2px; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid var(--hairline); }
.rows .row:first-child { border-top: 0; }
.row .thumb { width: 44px; height: 44px; border-radius: var(--r-full); background-color: var(--surface-strong); flex: none; }
.row .name { font: 600 16px/1.25 var(--font); }
.row .kind { font-size: 13px; color: var(--muted); margin-top: 1px; }
.row .grow { flex: 1; min-width: 0; }
.row .num { text-align: right; flex: none; }
.row .num b { display: block; font: 500 15px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.row .num span { display: block; font: 400 12px/1.4 var(--font-mono); color: var(--muted); margin-top: 3px; }

/* Spaltenkopf */
.colhead { display: flex; justify-content: space-between; padding: 16px 0 8px;
  font: 600 11px/1.4 var(--font); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

/* ---------- Suche und Filter ---------- */
.search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px;
  background: var(--surface-strong); border-radius: var(--r-pill); color: var(--muted); font-size: 15px; }
.filters { gap: 8px; padding: 16px var(--gutter) 2px; }
.filters .badge { flex: none; padding: 9px 14px; font-size: 12px; }

/* ---------- Navigationsleiste unten ---------- */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: var(--canvas);
  border-top: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between;
  padding: 10px var(--gutter) 24px; }
.nav a { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-full);
  color: var(--muted); font-size: 23px; transition: color var(--dur-s) var(--ease); }
.nav a.on { width: auto; grid-auto-flow: column; gap: 8px; padding: 0 16px; background: var(--surface-strong); color: var(--ink); }
.nav a.on span { font: 600 13px/1 var(--font); }

/* ---------- Detail ---------- */
.hero { background: var(--dark); color: var(--on-dark); padding: 0 var(--gutter) 24px; }
.hero .bar-row { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.hero h1 { font: 400 36px/1.06 var(--font-display); letter-spacing: -1.1px; margin-top: 10px; }
.hero .meta { margin-top: 6px; font-size: 13px; color: var(--on-dark-soft); }
.hero .ui-card { margin-top: 14px; }
.hero .ui-card .shot { height: 146px; background-position: 50% 64%; }
.actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.actions .pill.primary { flex: 1; height: 48px; }

.segment { display: flex; gap: 8px; padding: 18px var(--gutter) 0; }
.segment .badge { padding: 9px 14px; font-size: 12px; }
.segment .badge .mono { font-weight: 500; margin-left: 6px; opacity: .72; letter-spacing: 0; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px var(--gutter) 0; }
.grid .photo { height: 92px; border-radius: var(--r-lg); background-color: var(--surface-strong); }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference) {
  .lede, .band, .sec, .segment, .grid { animation: rise var(--dur-m) var(--ease) both; }
  .band { animation-delay: 40ms; }
  .sec { animation-delay: 80ms; }
  .row { animation: rise var(--dur-s) var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style></head>
