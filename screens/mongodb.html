<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Farben */
  --green:#00ed64; --green-deep:#00b545; --green-press:#008c34; --green-dark:#00684a;
  --green-soft:#c3f0d2; --mint:#e3fcef;
  --teal-deep:#001e2b; --teal:#003d4f; --teal-mid:#00684a;
  --purple:#7b3ff2; --orange:#fa6e39; --pink:#f06bb8; --blue:#3d4f9f;
  --canvas:#ffffff; --surface:#f9fbfa; --surface-soft:#f4f7f6;
  --hair:#e1e5e8; --hair-soft:#eceff1; --hair-strong:#c1ccd6; --hair-dark:#1c2d38;
  --ink:#001e2b; --charcoal:#1c2d38; --slate:#3d4f5b; --steel:#5c6c7a; --stone:#7c8c9a; --muted:#a8b3bc;
  /* Form */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
  --el-2:0 4px 12px rgba(0,30,43,.08);
  --el-3:0 12px 24px -4px rgba(0,30,43,.28);
  /* Raster */
  --pad:20px; --gap:12px;
  /* Bewegung */
  --dur-s:150ms; --dur-m:200ms; --ease:cubic-bezier(.22,1,.36,1);
  --sans:"Poppins","DejaVu Sans",sans-serif;
  --mono:"Liberation Mono",monospace;
}

/* ---------- Grundgerüst ---------- */
.phone{background:var(--canvas); font-family:var(--sans); color:var(--ink);
  font-size:14px; line-height:1.5;}

/* ---------- Petrol-Band ---------- */
.band{background:linear-gradient(170deg,#001e2b 0%,#002d3c 72%,#003d4f 100%); color:#fff; padding:0 var(--pad) 62px;}
.band .sb{color:#fff; margin:0 -20px;}
.band-top{display:flex; align-items:center; justify-content:space-between; padding:2px 0 16px;}
.who{display:flex; align-items:center; gap:10px;}
.ava{width:30px; height:30px; border-radius:var(--r-full); flex:none;
  box-shadow:0 0 0 1px var(--hair-dark);}
.who b{font-size:14px; font-weight:500;}
.round{width:36px; height:36px; border-radius:var(--r-full); border:1px solid var(--hair-dark);
  display:grid; place-items:center; font-size:17px; color:#fff; flex:none;
  transition:background var(--dur-s) var(--ease);}
.round:active{background:rgba(255,255,255,.08);}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--green);}
.band h1{font-size:30px; font-weight:500; letter-spacing:-.5px; line-height:1.2; margin-top:8px;}
.band .lead{font-size:14px; color:var(--muted); line-height:1.5; margin-top:8px;}
.pillrow{display:flex; gap:10px; margin-top:18px;}

/* ---------- Pillen ---------- */
.pill-btn{display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 22px;
  border-radius:var(--r-full); font-size:14px; font-weight:500; white-space:nowrap;
  transition:background var(--dur-s) var(--ease), transform var(--dur-s) var(--ease);}
.pill-btn .ic{font-size:17px;}
.p-green{background:var(--green); color:var(--ink);}
.p-green:active{background:var(--green-press); transform:scale(.97);}
.p-ghost-dark{border:1px solid var(--hair-dark); color:#fff;}
.p-ghost{border:1px solid var(--hair-strong); color:var(--ink);}

/* ---------- Weiße Fläche ---------- */
.sheet{background:var(--canvas); padding:0 var(--pad);}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 10px;}
.sec-head h2{font-size:18px; font-weight:500; letter-spacing:-.2px;}
.link-green{font-size:13px; font-weight:500; color:var(--green-dark); display:inline-flex; gap:5px; align-items:center;}
.link-green .ic{font-size:13px;}

/* ---------- Karte über der Bandkante ---------- */
.mockup{background:var(--teal); border-radius:var(--r-lg); box-shadow:var(--el-3);
  padding:12px; margin-top:-50px; position:relative; z-index:5; color:#fff;}
.mockup .shotimg{height:124px; border-radius:var(--r-md); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.mockup-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 4px 0;}
.mockup-foot h3{font-size:18px; font-weight:500;}
.mockup-foot p{font-size:13px; color:var(--muted); margin-top:2px;}

/* ---------- Kategorie-Tags ---------- */
.tag{display:inline-block; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:#fff; border-radius:var(--r-xs); padding:3px 7px; line-height:1.2;}
.t-purple{background:var(--purple);} .t-orange{background:var(--orange);}
.t-blue{background:var(--blue);} .t-pink{background:var(--pink);}
.badge-mint{display:inline-flex; align-items:center; gap:5px; background:var(--green-soft);
  color:var(--green-dark); font-size:12px; font-weight:700; border-radius:var(--r-full); padding:4px 11px;}
.badge-dark{display:inline-flex; align-items:center; gap:5px; background:var(--teal-deep);
  color:var(--green); font-size:12px; font-weight:700; border-radius:var(--r-full); padding:4px 11px;}
.badge-line{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--hair-dark);
  color:#fff; font-size:12px; font-weight:400; border-radius:var(--r-full); padding:4px 11px;}

/* ---------- Quellen-Karte ---------- */
.card{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg); padding:14px;}
.card-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.card-head h2{font-size:16px; font-weight:500; letter-spacing:-.2px;}
.card.lift{box-shadow:var(--el-2);}
.src-pills{display:flex; gap:8px;}
.src-pill{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--hair);
  border-radius:var(--r-full); padding:7px 12px; font-size:12.5px; color:var(--slate); white-space:nowrap;}
.src-pill .ic{font-size:14px; color:var(--steel);}
.src-pill.on{background:var(--ink); border-color:var(--ink); color:#fff;}
.src-pill.on .ic{color:#fff;}
.store{margin-top:12px;}
.store-l{display:flex; justify-content:space-between; font-size:13px; color:var(--steel); margin-bottom:8px;}
.store-l b{color:var(--ink); font-weight:500;}
.track{height:8px; border-radius:var(--r-full); background:var(--hair-soft); overflow:hidden;}
.track > i{display:block; height:100%; border-radius:var(--r-full); background:var(--green-dark);}

/* ---------- Kachelraster (Katalog) ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:var(--gap);}
.tile{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg);
  padding:10px 10px 13px; transition:box-shadow var(--dur-s) var(--ease);}
.tile .pic{height:78px; border-radius:10px; margin-bottom:10px;}
.tile h3{font-size:16px; font-weight:500; letter-spacing:-.2px; margin-top:8px; line-height:1.3;}
.tile p{font-size:12.5px; color:var(--steel); margin-top:3px; line-height:1.35;}
.tile .link-green{margin-top:9px;}
.tiles.plain .link-green{display:none;}

/* ---------- Untere Leiste ---------- */
.nav{position:absolute; left:0; right:0; bottom:0; height:80px; background:var(--teal-deep);
  display:flex; align-items:flex-start; justify-content:space-between; padding:8px 14px 0;}
.hi{color:#fff; opacity:.3;}
.nav a{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 0 7px; border-radius:var(--r-full); color:var(--muted);
  font-size:10px; font-weight:500; transition:background var(--dur-s) var(--ease);}
.nav a .ic{font-size:21px;}
.nav a.on{background:var(--teal-mid); color:#fff;}
.nav .ava{width:21px; height:21px; box-shadow:0 0 0 1px rgba(255,255,255,.25);}

/* ---------- Suche ---------- */
.search{display:flex; align-items:center; gap:10px; height:52px; padding:0 16px;
  background:var(--canvas); border:1px solid var(--hair-strong); border-radius:var(--r-md);
  color:var(--steel); font-size:14.5px; box-shadow:var(--el-2);
  margin-top:-26px; position:relative; z-index:5;}
.search .ic{font-size:19px; color:var(--steel);}

/* ---------- Pill-Tabs ---------- */
.ptabs{gap:8px; padding:2px 0;}
.ptab{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 13px; flex:none;
  border:1px solid var(--hair); border-radius:var(--r-full); font-size:12.5px; font-weight:500;
  color:var(--steel); white-space:nowrap;}
.ptab .ic{font-size:14px;}
.ptab.on{background:var(--ink); border-color:var(--ink); color:#fff;}

.sortrow{display:flex; align-items:center; justify-content:space-between; margin:14px 0 12px;}
.sortrow span{font-size:13px; color:var(--steel);}
.sortrow b{color:var(--ink); font-weight:500;}

/* ---------- Detail ---------- */
.hero-frame{border:1px solid var(--hair-dark); border-radius:var(--r-lg); padding:8px; margin-top:4px;}
.hero-frame .shotimg{height:168px; border-radius:10px; background-position:50% 58%;}
.band h1.big{font-size:32px; margin-top:16px;}
.badges{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.act{display:flex; align-items:center; gap:10px; margin-top:18px;}
.act .p-green{flex:1; justify-content:center;}
.act .round{width:42px; height:42px; font-size:18px;}

.music{display:flex; align-items:center; gap:12px; background:var(--canvas); border:1px solid var(--hair);
  border-radius:var(--r-lg); padding:12px; box-shadow:var(--el-2);
  margin-top:-40px; position:relative; z-index:5;}
.music .pic{width:54px; height:54px; border-radius:10px; flex:none;}
.music .mid{flex:1; min-width:0;}
.music h3{font-size:15px; font-weight:500; margin-top:5px;}
.music p{font-size:12.5px; color:var(--steel);}

.utabs{display:flex; gap:22px; border-bottom:1px solid var(--hair); margin-top:22px;}
.utab{font-size:14px; font-weight:500; color:var(--steel); padding-bottom:10px;
  border-bottom:2px solid transparent; margin-bottom:-1px;}
.utab.on{color:var(--green-dark); border-bottom-color:var(--green-dark);}
.utab em{font-style:normal; font-size:12px; color:var(--stone); margin-left:4px;}

.grid-photos{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
.grid-photos div{aspect-ratio:1; border-radius:10px;}

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference){
  .up{animation:up var(--dur-m) var(--ease) both;}
  .up:nth-of-type(2){animation-delay:60ms;}
  .up:nth-of-type(3){animation-delay:120ms;}
  @keyframes up{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
}
