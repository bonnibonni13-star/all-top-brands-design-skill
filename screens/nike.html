<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Farben – Schwarz, Weiß, ein Grau */
  --ink:#111111; --canvas:#ffffff; --cloud:#f5f5f5;
  --charcoal:#39393b; --mute:#707072; --stone:#9e9ea0;
  --hairline:#cacacb; --hairline-soft:#e5e5e5;
  /* Form */
  --r-0:0px; --r-search:24px; --r-pill:30px; --r-full:9999px;
  /* Abstand (8er-Basis) */
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:18px; --s-xl:24px; --s-xxl:30px; --s-sec:48px;
  --pad:16px;
  /* Bewegung */
  --dur-s:120ms; --dur-m:240ms; --dur-l:400ms; --ease:cubic-bezier(.4,0,.2,1);
}

.phone{background:var(--canvas); color:var(--ink);
  font-family:Inter,"DejaVu Sans",sans-serif; font-weight:400; letter-spacing:0}
.sb{color:var(--ink)}
.hi{color:var(--ink)}

/* ---------- Schrift ---------- */
.lockup{font-family:Poppins,"TeX Gyre Adventor",sans-serif; font-weight:500; text-transform:uppercase;
  font-size:46px; line-height:.9; letter-spacing:-.23px}
.h-xl{font-size:30px; font-weight:500; line-height:1.2}
.h-sec{font-size:20px; font-weight:500; line-height:1.2; text-transform:uppercase}
.b-strong{font-size:16px; font-weight:500; line-height:1.5}
.b-md{font-size:16px; font-weight:400; line-height:1.5}
.cap{font-size:14px; font-weight:500; line-height:1.5; color:var(--mute)}
.cap-sm{font-size:12px; font-weight:500; line-height:1.5}
.util{font-size:11px; font-weight:500; line-height:1.5; text-transform:uppercase}

/* ---------- Kopfzone: Utility + Kopf + Tabs ---------- */
.utilbar{height:30px; background:var(--cloud); display:flex; align-items:center;
  justify-content:space-between; padding:0 var(--pad); color:var(--charcoal)}
.head{height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 var(--pad)}
.mark{width:26px; height:26px; border:2px solid var(--ink); border-radius:var(--r-full)}
.mark::after{content:""; display:block; width:8px; height:8px; margin:7px 0 0 7px; background:var(--ink);
  border-radius:var(--r-full)}
.head-acts{display:flex; align-items:center; gap:14px}
.iconbtn{width:40px; height:40px; border-radius:var(--r-full); display:grid; place-items:center;
  font-size:22px; color:var(--ink); transition:opacity var(--dur-s) var(--ease), transform var(--dur-s) var(--ease)}
.iconbtn:active{opacity:.5; transform:scale(.5)}
.avatar{width:30px; height:30px; border-radius:var(--r-full)}
.tabs{height:44px; display:flex; gap:24px; padding:0 var(--pad); align-items:stretch;
  box-shadow:inset 0 -1px 0 var(--hairline-soft)}
.tabs a{display:flex; align-items:center; font-size:13px; font-weight:500; text-transform:uppercase;
  color:var(--mute); border-bottom:2px solid transparent}
.tabs a.on{color:var(--ink); border-bottom-color:var(--ink)}

/* ---------- Kampagnenfläche ---------- */
.campaign{position:relative; height:280px; overflow:hidden}
.campaign .pic{position:absolute; inset:0}
.campaign::after{content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 34%, rgba(0,0,0,.5) 100%)}
.campaign .copy{position:absolute; left:var(--pad); right:var(--pad); bottom:20px; z-index:2; color:#fff}
.campaign .eyebrow{font-size:12px; font-weight:500; text-transform:uppercase; display:block; margin-bottom:10px}

/* ---------- Pillen ---------- */
.pill{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:var(--r-pill);
  font-size:16px; font-weight:500; line-height:1.5; padding:12px 24px; min-height:48px;
  transition:opacity var(--dur-s) var(--ease), transform var(--dur-s) var(--ease)}
.pill:active{opacity:.5; transform:scale(.5)}
.pill-ink{background:var(--ink); color:#fff}
.pill-cloud{background:var(--cloud); color:var(--ink)}
.pill-onimage{background:#fff; color:var(--ink); min-height:44px; padding:12px 24px}
.pill-sm{font-size:14px; min-height:40px; padding:10px 20px}
.pill-block{display:flex; width:100%}

/* ---------- Abschnitte ---------- */
.sec{padding:0 var(--pad); margin-top:22px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px}
.sec-head .cap{text-decoration:underline; text-underline-offset:3px; color:var(--ink)}

/* ---------- Reihe aus 4:5-Kacheln ---------- */
.rail{gap:8px; padding-left:var(--pad)}
.rail-item{position:relative; width:170px; height:212px; flex:none; overflow:hidden}
.rail-item .pic{position:absolute; inset:0}
.rail-item::after{content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.42) 100%)}
.rail-item .pill{position:absolute; left:10px; bottom:10px; z-index:2}

/* ---------- 1:1-Raster ---------- */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 var(--pad)}
.tile .pic{position:relative; width:100%; aspect-ratio:1/1; background-color:var(--cloud); display:block}
.tile .meta{margin-top:8px}
.tile .meta b{display:block; font-size:16px; font-weight:500; line-height:1.4}
.tile .meta span{display:block; font-size:14px; font-weight:500; line-height:1.5; color:var(--mute)}
.tile .meta u{display:block; font-size:14px; font-weight:500; line-height:1.5; text-decoration:none; margin-top:2px}
.badge{position:absolute; left:8px; top:8px; background:#fff; border:1px solid var(--hairline);
  border-radius:var(--r-pill); font-size:12px; font-weight:500; line-height:1.5; padding:3px 10px}

/* ---------- Suche und Chips ---------- */
.search{display:flex; align-items:center; gap:10px; height:40px; background:var(--cloud);
  border-radius:var(--r-search); padding:0 16px; margin:0 var(--pad)}
.search .ic{font-size:19px}
.search span{font-size:16px; color:var(--charcoal)}
.chips{gap:10px; padding:0 var(--pad); align-items:center}
.chip{flex:none; display:inline-flex; align-items:center; height:40px; padding:0 18px; border-radius:var(--r-pill);
  border:1px solid var(--hairline); background:#fff; color:var(--ink); font-size:14px; font-weight:500;
  transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease)}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.toolrow{display:flex; align-items:center; justify-content:space-between; padding:0 var(--pad); margin-top:14px}
.textbtn{display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500}

/* ---------- Detail ---------- */
.pdp-hero{position:relative; width:100%; height:356px; overflow:hidden; background:var(--cloud)}
.pdp-hero .pic{position:absolute; inset:0}
.pdp-hero .tl{position:absolute; left:12px; top:54px; z-index:2}
.pdp-hero .tr{position:absolute; right:12px; top:54px; z-index:2; display:flex; gap:4px}
.round{width:40px; height:40px; border-radius:var(--r-full); background:#fff; display:grid; place-items:center;
  font-size:19px; color:var(--ink)}
.dots{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:6px; z-index:2}
.dots i{width:7px; height:7px; border-radius:var(--r-full); background:rgba(255,255,255,.55)}
.dots i.on{background:#fff}
.disclosure{display:flex; align-items:center; gap:12px; padding:16px 0; border-bottom:1px solid var(--hairline)}
.disclosure .cover{width:44px; height:44px; flex:none}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:0 var(--pad)}
.grid3 i{display:block; aspect-ratio:1/1}

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference){
  .pic{animation:fade var(--dur-l) var(--ease) both}
  .campaign .copy > *{animation:up 320ms var(--ease) both}
  .campaign .copy > *:nth-child(2){animation-delay:60ms}
  .campaign .copy > *:nth-child(3){animation-delay:120ms}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  @keyframes up{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
}
</style></head>
