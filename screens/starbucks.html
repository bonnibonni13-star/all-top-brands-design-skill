<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{

  /* Grünsystem */
  --green:#006241; --accent:#00754A; --house:#1E3932; --uplift:#2b5148; --mint:#d4e9e2;
  /* Akzent und Text */
  --gold:#cba258; --gold-soft:#dfc49d;
  --ink:rgba(0,0,0,.87); --ink-soft:rgba(0,0,0,.58); --line:#d6dbde;
  --on-dark:#ffffff; --on-dark-soft:rgba(255,255,255,.70);
  /* Form */
  --r-card:12px; --r-pill:50px; --r-thumb:8px;
  /* Tiefe: immer mehrere schwache Lagen */
  --sh-card:0 0 .5px rgba(0,0,0,.14), 0 1px 1px rgba(0,0,0,.24);
  --sh-nav:0 -1px 3px rgba(0,0,0,.10), 0 -2px 2px rgba(0,0,0,.06), 0 0 2px rgba(0,0,0,.07);
  --sh-frap:0 0 6px rgba(0,0,0,.24), 0 8px 12px rgba(0,0,0,.14);
  /* Bewegung */
  --dur-s:200ms; --dur-m:300ms; --ease:cubic-bezier(.25,.46,.45,.94);
}

.phone{ background:var(--cream); color:var(--ink);
  font-family:Inter,"DejaVu Sans",sans-serif; letter-spacing:-.01em; }
.sb{ color:var(--ink); }
.hi{ color:var(--ink); }

/* ---------- Grundbausteine ---------- */
.pad{ padding-left:16px; padding-right:16px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:var(--r-pill); font-size:15px; font-weight:600; line-height:1.2;
  padding:11px 20px; transition:all var(--dur-s) ease; }
.btn-fill{ background:var(--accent); color:#fff; border:1px solid var(--accent); }
.btn-out{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
.btn-dark-out{ background:transparent; color:#fff; border:1px solid rgba(255,255,255,.85); }
.btn-on-green{ background:#fff; color:var(--accent); border:1px solid #fff; }
.btn:active{ transform:scale(.95); }
.btn .ic{ font-size:17px; }

.card{ background:var(--white); border-radius:var(--r-card); box-shadow:var(--sh-card); overflow:hidden; }

.eyebrow{ font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--green); }
.h-screen{ font-size:24px; font-weight:600; color:var(--green); line-height:1.3; }
.meta{ font-size:13.5px; color:var(--ink-soft); line-height:1.45; }

.avatar{ width:40px; height:40px; border-radius:50%; background-size:cover; background-position:50% 22%;
  box-shadow:0 0 0 2px var(--white), 0 0 0 3px var(--green); flex:none; }

/* ---------- Untere Leiste + Schwebeknopf ---------- */
.nav{ position:absolute; left:0; right:0; bottom:0; height:78px; background:var(--white);
  box-shadow:var(--sh-nav); display:flex; align-items:flex-start; padding-top:8px; z-index:20; }
.nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;

.nav-item .ic{ font-size:23px; }
.nav-item.is-on{ color:var(--green); font-weight:700; }

.frap{ position:absolute; right:16px; bottom:98px; width:56px; height:56px; border-radius:50%;

.frap .ic{ font-size:26px; margin-left:2px; }

.hero-meta{ margin-top:5px; }

.shelf{ gap:12px; padding-left:16px; }

.status-card{ margin:10px 16px 0; padding:12px 16px 13px; }

.src{ display:inline-flex; align-items:center; gap:7px; background:var(--white); border:1px solid var(--line);

.list{ padding:16px 16px 0; display:flex; flex-direction:column; gap:11px; }

/* ---------- Detail ---------- */
.dband{ background:var(--house); color:var(--on-dark); padding:0 16px 20px; }

.dmeta{ font-size:13.5px; color:var(--on-dark-soft); margin-top:6px; }
.dimg{ height:176px; border-radius:var(--r-card); margin-top:14px; background-position:50% 58%; }

.act{ display:flex; align-items:center; gap:10px; padding:16px 16px 0; }

.ibtn{ width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--white);

.ibtn .ic{ font-size:19px; }

.tabs{ display:flex; gap:24px; padding:18px 16px 0; }
.tab{ font-size:15px; font-weight:600; color:var(--ink-soft); padding-bottom:9px; }

.tabline{ height:1px; background:var(--ceramic); margin:0 16px; }

.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; padding:14px 16px 0; }
.ph{ aspect-ratio:1/1; border-radius:var(--r-card); }

.music{ position:absolute; left:12px; right:12px; bottom:90px; z-index:22;
