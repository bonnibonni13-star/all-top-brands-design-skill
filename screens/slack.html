<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* =====================================================================
   Tokens aus references/slack.md – Markenname neutralisiert
   ===================================================================== */
:root {
  /* Marke: ein einziges tiefes Aubergine trägt alles */
  --aubergine: #4a154b;
  --aubergine-press: #611f69;
  --aubergine-tint: #592466;
  --on-aubergine: #ffffff;
  --on-aubergine-mute: #d9bdde;
  /* Flächen */
  --canvas: #ffffff;
  --cream: #f4ede4;
  --lavender: #f9f0ff;
  --hairline: #e6e6e6;
  /* Text */
  --ink: #1d1d1d;
  --ink-mute: #696969;
  --link: #1264a3;            /* einzige zweite Farbe im Text */
  /* Radien: Pille für alles Klickbare, 16 für Karten, 4 nur für Felder */
  --r-pill: 90px;
  --r-card: 16px;
  --r-img: 12px;
  --r-img-sm: 8px;
  --r-field: 4px;
  /* Abstände */
  --s-xs: 4px; --s-sm: 8px; --s-md: 12px; --s-lg: 16px; --s-xl: 20px; --s-xxl: 24px; --s-huge: 28px;
  /* Schrift: zwei Schnitte einer humanistischen Sans */
  --font: "Inter", "Carlito", sans-serif;
  --font-display: "Inter Display", "Inter", sans-serif;
  /* Bewegung (Empfehlung): weich auslaufend */
  --dur-s: 180ms;
  --dur-m: 320ms;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

/* =====================================================================
   Grundgerüst
   ===================================================================== */
.phone { background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
.phone .sb, .phone .hi { color: var(--ink); }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }

/* Typografie-Rollen */
.display   { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.25; letter-spacing: -.26px; }
.heading-md{ font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.4; }
.heading-sm{ font-family: var(--font-display); font-size: 18px; font-weight: 600; line-height: 1.3; letter-spacing: -.02px; }
.body      { font-size: 16px; font-weight: 400; line-height: 1.55; }
.caption   { font-size: 14px; font-weight: 400; line-height: 1.43; letter-spacing: .1px; color: var(--ink-mute); }
.eyebrow   { font-size: 12px; font-weight: 700; line-height: 1; letter-spacing: .96px; text-transform: uppercase; }
.link      { color: var(--link); font-size: 14px; font-weight: 700; }

/* Icons: humanistische Linie, in der aktiven Pille gefüllt */
.ic { stroke-width: 1.75; }

/* Pastell-Mesh: die Tiefe der Marke – Inhalte schweben darüber, ohne Schatten */
.mesh { background:
    radial-gradient(62% 52% at 8% 6%, #fff0e6 0%, rgba(255,240,230,0) 72%),
    radial-gradient(58% 48% at 96% 14%, #e9d8ff 0%, rgba(233,216,255,0) 74%),
    radial-gradient(74% 56% at 46% 102%, #e6f0e4 0%, rgba(230,240,228,0) 72%),
    var(--cream); }

/* =====================================================================
   Kopfzeile
   ===================================================================== */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 2px var(--s-xl) 0; height: 52px; }
.mark { width: 26px; height: 26px; border-radius: 9px; background: var(--aubergine); position: relative; }
.mark::after { content: ""; position: absolute; left: 7px; top: 7px; width: 12px; height: 12px;
  border-radius: var(--r-pill); background: var(--cream); }
.topbar-right { display: flex; align-items: center; gap: var(--s-lg); color: var(--ink-mute); }
.topbar-right .ic { font-size: 22px; }
.avatar { width: 34px; height: 34px; border-radius: var(--r-pill); background-size: cover;
  background-position: center 18%; }

/* =====================================================================
   Pillen – jeder Knopf, jeder Filter
   ===================================================================== */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-sm);
  border-radius: var(--r-pill); font-size: 16px; font-weight: 700; letter-spacing: .2px; line-height: 1.38;
  padding: 14px 28px; transition: background var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); }
.pill-primary { background: var(--aubergine); color: var(--on-aubergine); }
.pill-primary:active { background: var(--aubergine-press); transform: scale(.98); }
.pill-secondary { background: var(--lavender); color: var(--ink); padding: 14px 30px; }
.pill-outline-light { border: 2px solid var(--on-aubergine); color: var(--on-aubergine); padding: 10px 22px;
  font-size: 14.4px; letter-spacing: .14px; }
.pill-row { display: flex; gap: var(--s-md); }
.pill-icon { width: 40px; height: 40px; border-radius: var(--r-pill); background: var(--canvas);
  border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center;
  color: var(--ink); }
.pill-icon .ic { font-size: 20px; }
.tag { display: inline-flex; align-items: center; border-radius: var(--r-pill); background: var(--cream);
  color: var(--ink); padding: 5px 12px; }
.mesh .tag { background: var(--canvas); }

/* =====================================================================
   Start – Verlaufsband mit schwebendem Inhalt
   ===================================================================== */
.band { padding: 0 var(--s-xl) var(--s-xl); }
.band .display { margin-top: var(--s-sm); }
.hero-img { height: 144px; border-radius: var(--r-img); margin-top: var(--s-md); }
.hero-title { margin-top: 14px; }
.hero-meta { display: flex; align-items: center; gap: var(--s-sm); margin-top: var(--s-sm); }
.band .pill-row { margin-top: var(--s-lg); }

/* Kennzahl-Karten: Betonung allein über Größe */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-md);
  padding: 18px var(--s-xl) 0; }
.stat { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-card);
  padding: 10px var(--s-sm) 12px; text-align: center; }
.stat-value { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.1;
  letter-spacing: -.6px; color: var(--aubergine); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 13px; color: var(--ink-mute); margin-top: 4px; line-height: 1.3; }

.sec { padding: 18px var(--s-xl) 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; }
.cards-x { gap: var(--s-md); margin: 10px calc(-1 * var(--s-xl)) 0 0; }
.card-x { width: 168px; flex: none; }
.card-x-img { height: 84px; border-radius: var(--r-img-sm); }
.card-x .heading-sm { margin-top: var(--s-sm); }
.card-x .caption { font-size: 13px; }

/* =====================================================================
   Untere Navigation – aktives Ziel als gefüllte Aubergine-Pille
   ===================================================================== */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: var(--canvas);
  border-top: 1px solid var(--hairline); display: flex; align-items: flex-start;
  justify-content: space-around; gap: var(--s-sm); padding: var(--s-md) var(--s-lg) 0; z-index: 40; }
.nav-item { display: flex; align-items: center; gap: var(--s-sm); border-radius: var(--r-pill);
  height: 44px; padding: 0 14px; color: var(--ink-mute); }
.nav-item .ic { font-size: 23px; }
.nav-item.is-on { background: var(--aubergine); color: var(--on-aubergine); padding: 0 18px; }
.nav-item.is-on .nav-label { display: inline; font-size: 15px; font-weight: 700; letter-spacing: .1px; }
.nav-label { display: none; }

/* =====================================================================
   Bibliothek – Suchfeld mit 4px, Pillen-Filter, Eintrags-Karten
   ===================================================================== */
.page-head { padding: var(--s-sm) var(--s-xl) 0; display: flex; align-items: flex-start;
  justify-content: space-between; }
.field { margin: var(--s-lg) var(--s-xl) 0; height: 44px; background: var(--canvas);
  border: 1px solid var(--hairline); border-radius: var(--r-field); display: flex; align-items: center;
  gap: var(--s-sm); padding: 0 12px; color: var(--ink-mute); }
.field .ic { font-size: 20px; }
.chips { gap: var(--s-sm); margin-top: var(--s-lg); padding-left: var(--s-xl); }
.chip { flex: none; border-radius: var(--r-pill); border: 1px solid var(--hairline); background: var(--canvas);
  color: var(--ink); font-size: 14px; font-weight: 700; letter-spacing: .14px; padding: 8px 13px; }
.chip.is-on { background: var(--aubergine); color: var(--on-aubergine); border-color: var(--aubergine); }
.list { padding: var(--s-lg) var(--s-xl) 0; display: flex; flex-direction: column; gap: var(--s-sm); }
.item { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-card);
  padding: 10px; display: flex; align-items: center; gap: var(--s-md); }
.item-img { width: 56px; height: 56px; border-radius: var(--r-img-sm); flex: none; }
.item-main { min-width: 0; flex: 1; }
.item-main .caption { font-size: 13px; }
.item .tag { font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase;
  padding: 4px 10px; flex: none; }

/* =====================================================================
   Detail – Bild als Karte, Raster mit Fugen, Aubergine-Schlussband
   ===================================================================== */
.detail-top { padding-bottom: var(--s-xxl); }
.detail-img { height: 180px; margin: 0 var(--s-xl); border-radius: var(--r-card); }
.detail-head { padding: var(--s-lg) var(--s-xl) 0; }
.detail-head .display { margin-top: var(--s-md); }
.detail-head .caption { margin-top: 2px; }
.detail-head .pill-row { margin-top: var(--s-lg); }
.toggle { gap: var(--s-sm); margin-top: var(--s-xl); padding-left: var(--s-xl); }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-sm);
  padding: var(--s-md) var(--s-xl) 0; }
.photo-grid > div { aspect-ratio: 1; border-radius: var(--r-img-sm); }
.closing { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; background: var(--aubergine);
  color: var(--on-aubergine); border-radius: var(--r-card) var(--r-card) 0 0; display: flex;
  align-items: center; gap: var(--s-md); padding: 0 var(--s-xl); z-index: 40; }
.closing .eyebrow { color: var(--on-aubergine-mute); }
.closing .heading-sm { margin-top: 3px; }
.closing .pill-outline-light { margin-left: auto; flex: none; }

/* =====================================================================
   Bewegung: Verlauf blendet auf, Karten steigen gestaffelt
   ===================================================================== */
@media (prefers-reduced-motion: no-preference) {
  @keyframes softIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
