<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
:root{
  /* Farben */
  --green:#76b900; --green-dark:#5a8d00; --on-green:#000000;
  --ink:#000000; --body:#1a1a1a; --mute:#757575; --stone:#898989; --ash:#a7a7a7;
  --canvas:#ffffff; --soft:#f7f7f7; --dark:#000000; --elevated:#1a1a1a;
  --hair:#cccccc; --hair-strong:#5e5e5e;
  --on-dark:#ffffff; --on-dark-mute:rgba(255,255,255,.7);
  /* Form */
  --r-none:0px; --r-xs:1px; --r-sm:2px;
  /* Raster: 8-px-Basis */
  --s-xxs:2px; --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-xxl:32px;
  --pad:16px;
  /* Schrift */
  --font:"Inter","Arial",sans-serif;
  /* Bewegung */
  --dur-s:150ms; --dur-m:250ms; --ease:cubic-bezier(.4,0,.2,1);
}

.phone{ font-family:var(--font); background:var(--canvas); color:var(--ink); }

/* ---------- Typografie: Hierarchie aus Gewicht, Zeilenhöhe locker ---------- */
.display{ font-size:32px; font-weight:700; line-height:1.25; letter-spacing:-.01em; }
.h-xl{ font-size:24px; font-weight:700; line-height:1.25; }
.h-md{ font-size:20px; font-weight:700; line-height:1.25; }
.card-title{ font-size:17px; font-weight:700; line-height:1.3; }
.body-md{ font-size:16px; font-weight:400; line-height:1.5; }
.body-sm{ font-size:15px; font-weight:400; line-height:1.5; }
.eyebrow{ font-size:12px; font-weight:700; line-height:1.43; letter-spacing:.1em; text-transform:uppercase; }
.caption{ font-size:12px; font-weight:400; line-height:1.3; color:var(--mute); }
.util-xs{ font-size:10px; font-weight:700; line-height:1.5; letter-spacing:.1em; text-transform:uppercase; }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 20px;
  border-radius:var(--r-sm); font-size:16px; font-weight:700; line-height:1.25;
  transition:background-color var(--dur-s) var(--ease), border-color var(--dur-s) var(--ease); }
.btn-primary{ background:var(--green); color:var(--on-green); }
.btn-primary:active{ background:var(--green-dark); }
.btn-outline{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--green); }
.btn-outline-dark{ background:transparent; color:var(--on-dark); box-shadow:inset 0 0 0 1px var(--on-dark); }
.ghost{ display:inline-flex; align-items:center; gap:6px; color:var(--green); font-size:14px; font-weight:700; }
.ghost .ic{ font-size:13px; }
.icon-btn{ width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; flex:none;
  border-radius:var(--r-sm); font-size:18px; color:var(--on-dark); }

/* ---------- Kopfzone: Utility + Hauptleiste + Brotkrumen ---------- */
.util{ height:32px; background:var(--dark); color:var(--on-dark-mute); display:flex; align-items:center;
  justify-content:space-between; padding:0 var(--pad); border-bottom:1px solid var(--elevated); }
.util .dot{ width:7px; height:7px; background:var(--green); display:inline-block; margin-right:6px; vertical-align:1px; }
.util .right{ color:var(--on-dark); }
.topnav{ height:56px; background:var(--dark); color:var(--on-dark); display:flex; align-items:center; gap:10px; padding:0 10px 0 var(--pad); }
.mark{ width:18px; height:18px; flex:none; background:var(--green); }
.topnav h1{ font-size:16px; font-weight:700; line-height:1.25; }
.topnav .right{ margin-left:auto; display:flex; align-items:center; gap:2px; }
.avatar{ width:32px; height:32px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px var(--hair-strong); margin-left:6px; }
.crumbs{ height:44px; background:var(--soft); display:flex; align-items:center; gap:8px; padding:0 var(--pad);
  border-bottom:1px solid var(--hair); color:var(--body); }
.crumbs .ic{ font-size:9px; color:var(--mute); }
.crumbs .now{ color:var(--ink); }
.crumbs .past{ color:var(--mute); }

/* ---------- Bühnenkapitel (schwarz, Text im linken Drittel) ---------- */
.hero{ position:relative; background:var(--dark); overflow:hidden; }
.hero-photo{ position:absolute; inset:0; }
.hero-veil{ position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,.78) 60%, #000 100%); }
.hero-copy{ position:absolute; left:var(--pad); right:var(--pad); bottom:18px; color:var(--on-dark); }
.hero-copy .eyebrow{ color:var(--on-dark); }
.hero-copy .display{ margin-top:6px; }
.hero-copy .sub{ font-size:15px; font-weight:400; line-height:1.5; color:var(--on-dark-mute); margin-top:8px; }
.hero-cta{ display:flex; gap:10px; margin-top:16px; }
.hero-cta .btn{ padding:0 16px; }

/* ---------- Kennzahl-Kacheln ---------- */
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px var(--pad) 0; }
.stat{ border:1px solid var(--hair); border-radius:var(--r-sm); padding:10px 11px 11px; }
.stat b{ display:block; font-size:24px; font-weight:700; line-height:1.1; color:var(--green); }
.stat span{ display:block; font-size:11px; font-weight:400; line-height:1.3; color:var(--mute); margin-top:4px; }

/* ---------- Abschnittskopf ---------- */
.sec{ display:flex; align-items:baseline; justify-content:space-between; padding:16px var(--pad) 8px; }
.sec .eyebrow{ color:var(--mute); }

/* ---------- Karten mit Haarlinie und grünem Eckquadrat ---------- */
.cards{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:0 var(--pad); }
.card{ position:relative; border:1px solid var(--hair); border-radius:var(--r-sm); background:var(--canvas); overflow:hidden; }
.corner{ position:absolute; top:0; left:0; width:12px; height:12px; background:var(--green); z-index:2; }
.card-photo{ width:100%; height:97px; }
.card-txt{ padding:10px 11px 11px; }
.card-txt h4{ font-size:16px; font-weight:700; line-height:1.3; }
.card-txt p{ font-size:12px; font-weight:400; line-height:1.3; color:var(--mute); margin-top:4px; }

/* ---------- Suche und Segment-Tabs ---------- */
.search{ display:flex; align-items:center; gap:10px; height:40px; margin:14px var(--pad) 0;
  border:1px solid var(--hair); border-radius:var(--r-sm); padding:0 12px; }
.search .ic{ font-size:16px; color:var(--mute); }
.search span{ font-size:15px; font-weight:400; color:var(--stone); }
.tabs{ gap:2px; padding:14px var(--pad) 0; }
.tab-seg{ flex:none; padding:10px 15px; border-radius:var(--r-sm); font-size:14.4px; font-weight:700;
  line-height:1; letter-spacing:.144px; color:var(--ink); transition:background-color var(--dur-s) var(--ease); }
.tab-seg.is-on{ background:var(--ink); color:var(--on-dark); }

/* ---------- Tabelle (Dokumentations-Dichte) ---------- */
.thead{ display:flex; align-items:center; justify-content:space-between; height:30px; margin-top:14px;
  padding:0 var(--pad); background:var(--soft); border-top:1px solid var(--hair); border-bottom:1px solid var(--hair);
  font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--body); }
.trow{ display:flex; align-items:center; gap:12px; height:56px; padding:0 var(--pad); border-bottom:1px solid var(--hair); }
.trow:nth-child(even){ background:var(--soft); }
.tthumb{ width:40px; height:40px; flex:none; border-radius:var(--r-sm); }
.tmain{ flex:1 1 auto; min-width:0; }
.tmain h4{ font-size:15px; font-weight:700; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tmeta{ display:flex; align-items:center; gap:7px; margin-top:3px; }
.badge{ background:var(--canvas); color:var(--body); border:1px solid var(--hair); border-radius:var(--r-sm);
  font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:2px 6px; flex:none; }
.trow:nth-child(even) .badge{ background:var(--canvas); }
.tmeta span{ font-size:12px; font-weight:400; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tend{ flex:none; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--body); }

/* ---------- Tableiste unten (schwarz, aktiv grün mit Oberkante) ---------- */
.tabbar{ position:absolute; left:0; right:0; bottom:0; height:76px; background:var(--dark); color:var(--on-dark-mute);
  display:flex; align-items:flex-start; }
.tab{ flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:10px;
  border-top:3px solid transparent; transition:color var(--dur-s) var(--ease); }
.tab i{ font-size:20px; }
.tab span{ font-size:10px; font-weight:400; letter-spacing:.09em; text-transform:uppercase; }
.tab.is-on{ color:var(--green); border-top-color:var(--green); }
.tab.is-on span{ font-weight:700; color:var(--on-dark); }

/* ---------- Detail ---------- */
.photo-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:0 var(--pad); margin-top:16px; }
.photo-grid div{ aspect-ratio:1/1; border-radius:var(--r-sm); }
.actionbar{ position:absolute; left:0; right:0; bottom:0; height:88px; background:var(--canvas);
  border-top:1px solid var(--hair); display:flex; align-items:flex-start; gap:12px; padding:14px var(--pad) 0; }
.actionbar .corner{ top:1px; }
.ab-thumb{ width:44px; height:44px; flex:none; border-radius:var(--r-sm); }
.ab-txt{ flex:1 1 auto; min-width:0; }
.ab-txt .eyebrow{ color:var(--mute); }
.ab-txt h4{ font-size:16px; font-weight:700; line-height:1.3; margin-top:3px; }

/* ---------- Bewegung: nur Opazität, kein Versatz ---------- */
@media (prefers-reduced-motion: no-preference){
  .hero,.stats,.sec,.cards,.thead,.trow,.photo-grid{ animation:fade-in var(--dur-m) var(--ease) both; }
  .stats{ animation-delay:40ms; } .sec{ animation-delay:80ms; } .cards{ animation-delay:120ms; }
  @keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }
}
</style></head>
