<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* ==========================================================================
   Binance – Designsprache als App-Vorlage

   Prinzip: fast schwarze Fläche, flache Blöcke, Zahlen in eigener Stimme,

:root {

  --canvas: #0b0e11;

  --hairline: #2b3139;
  /* Text */
  --ink: #ffffff;
  --body: #eaecef;
  --muted: #707a8a;
  --muted-strong: #929aa5;
  /* Einziger Akzent */
  --yellow: #fcd535;
  --yellow-press: #f0b90b;
  --on-yellow: #181a20;
  /* Handelssemantik: nur Richtung */
  --up: #0ecb81;
  --down: #f6465d;
  --focus: #3b82f6;
  /* Schrift: Wörter vs. Zahlen */
  --font-text: "Inter", sans-serif;
  --font-display: "Inter Display", "Inter", sans-serif;
  --font-num: "DejaVu Sans Mono", monospace;
  /* Radien (klein bis mittel) */
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-xl: 12px;
  /* Abstände, 4-px-Basis */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-6: 24px;
  /* Bewegung (Empfehlung) */
  --dur-s: 150ms;
  --dur-m: 250ms;
  --ease: cubic-bezier(.2, 0, 0, 1);
}

/* ---------- Grundlage ---------- */
.phone { background: var(--canvas); color: var(--body); font: 400 14px/1.5 var(--font-text); }
.phone .sb { color: var(--ink); }
.phone .hi { color: var(--ink); }
:where(.phone) :where(h1, h2, h3, p) { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.up { color: var(--up); }
.down { color: var(--down); }
.tri { font-size: .72em; vertical-align: .08em; }

/* ---------- Kopfzeile: Avatar + Suche ---------- */
.top { display: flex; align-items: center; gap: var(--s-3); padding: 2px var(--s-4) var(--s-3); }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; background-color: var(--surface-2); }
.search { flex: 1; height: 40px; display: flex; align-items: center; gap: var(--s-2);
  background: var(--surface); border-radius: var(--r-lg); padding: 0 var(--s-4);
  color: var(--muted); font-size: 14px; transition: box-shadow var(--dur-s) var(--ease); }
.search .ic { font-size: 18px; }
.icon-btn { width: 32px; height: 32px; flex: none; display: grid; place-items: center;
  color: var(--body); font-size: 20px; border-radius: var(--r-md);
  transition: background var(--dur-s) var(--ease), color var(--dur-s) var(--ease); }

/* ---------- Kennzahl-Block ---------- */
.metric { padding: var(--s-3) var(--s-4) 0; }
.metric-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.metric-label .ic { font-size: 15px; }
.metric-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-3); margin-top: 6px; }
.metric-value { font: 700 32px/1.1 var(--font-num); color: var(--ink); letter-spacing: -1.4px;
  display: flex; align-items: baseline; gap: 6px; }
.metric-unit { font: 500 15px/1 var(--font-text); color: var(--muted-strong); display: inline-flex; align-items: center; gap: 2px; }
.metric-unit .ic { font-size: 13px; }
.metric-change { margin-top: 6px; font: 500 13px/1 var(--font-num); }
.metric-change span { font-family: var(--font-text); color: var(--muted); }

/* Kompakter gelber Button, passt in Zeilen (28 px, 4 px) */
.btn-y-sm { height: 28px; padding: 0 16px; border-radius: var(--r-sm); background: var(--yellow);
  color: var(--on-yellow); font: 600 13px/1 var(--font-text); display: inline-flex; align-items: center; gap: 5px;
  flex: none; transition: background var(--dur-s) var(--ease); }
.btn-y-sm:active { background: var(--yellow-press); }
.btn-y-sm .ic { font-size: 14px; }
/* Standard-Primär 40 px, 6 px */
.btn-y { height: 40px; padding: 0 20px; border-radius: var(--r-md); background: var(--yellow);
  color: var(--on-yellow); font: 600 14px/1 var(--font-text); display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; transition: background var(--dur-s) var(--ease); }
.btn-y:active { background: var(--yellow-press); }
.btn-y .ic { font-size: 17px; }
.btn-dark { height: 40px; width: 40px; border-radius: var(--r-md); background: var(--surface);
  color: var(--body); display: grid; place-items: center; font-size: 19px; flex: none; }

/* Fortschritt: 4 px, flach */
.bar { margin: var(--s-3) var(--s-4) 0; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--yellow); }
.bar-legend { display: flex; justify-content: space-between; margin: 6px var(--s-4) 0;
  font: 500 11px/1 var(--font-num); color: var(--muted); }

/* Kennzahl-Leiste: drei Spalten mit Haarlinien */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: var(--s-4) var(--s-4) 0;
  border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
.stats div { padding: 13px 0; }
.stats div + div { border-left: 1px solid var(--hairline); padding-left: 14px; }
.stats dt { font: 500 11px/1.2 var(--font-text); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stats dd { font: 500 16px/1.3 var(--font-num); color: var(--body); margin-top: 3px; }

/* ---------- Banner-Karte ---------- */
.banner { margin: var(--s-4) var(--s-4) 0; background: var(--surface); border-radius: var(--r-xl);
  padding: var(--s-4) var(--s-4) var(--s-4) var(--s-4); display: flex; gap: var(--s-3); align-items: center; }
.banner-body { flex: 1; min-width: 0; }
.tag { display: inline-block; font: 600 10px/1 var(--font-text); letter-spacing: .08em; text-transform: uppercase;
  color: var(--yellow); background: rgba(252, 213, 53, .12); border-radius: 2px; padding: 4px 6px; }
.banner h3 { font: 600 15px/1.35 var(--font-text); color: var(--ink); margin-top: 7px; }
.banner p { font: 400 12px/1.4 var(--font-text); color: var(--muted); margin-top: 2px; }
.banner-actions { display: flex; align-items: center; gap: var(--s-3); margin-top: 10px; }
.dots { display: flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--surface-2); }
.dots i:first-child { width: 12px; border-radius: 3px; background: var(--muted); }
.banner-thumb { width: 72px; height: 72px; border-radius: var(--r-lg); flex: none; }

/* ---------- Text-Tabs mit Gelbstrich ---------- */
.tabs { display: flex; gap: var(--s-6); padding: 0 var(--s-4); margin-top: var(--s-4);
  border-bottom: 1px solid var(--hairline); }
.tabs button { position: relative; padding: 0 0 10px; font: 500 14px/1 var(--font-text); color: var(--muted); }
.tabs button.on { color: var(--ink); font-weight: 600; }
.tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;

.tabs-wide button { flex: none; }

/* ---------- Filter-Chips ---------- */
.chips { display: flex; gap: var(--s-2); padding: var(--s-3) var(--s-4) 0; }
.chip { height: 28px; padding: 0 10px; border-radius: var(--r-sm); font: 500 12px/1 var(--font-text);

.chip .ic { font-size: 14px; }
.chip.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }

/* ---------- Tabelle ---------- */
.colhead { display: flex; align-items: center; gap: 10px; padding: 11px var(--s-4) 9px;
  font: 500 11px/1 var(--font-text); color: var(--muted); white-space: nowrap; }
.colhead::before { content: ""; width: 30px; flex: none; }
.colhead .c-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.colhead .c-num { width: 58px; text-align: right; }
.colhead .c-chg { width: 78px; text-align: right; display: inline-flex; align-items: center;
  justify-content: flex-end; gap: 3px; }
.colhead .ic { font-size: 11px; }

.rows { padding: 0 var(--s-4); }
.row { display: flex; align-items: center; gap: 10px; height: 64px;
  border-top: 1px solid var(--hairline); transition: background var(--dur-s) var(--ease); }
.row:first-child { border-top: 0; }
.row:active { background: var(--surface); }
.coin { width: 30px; height: 30px; border-radius: 50%; flex: none; background-color: var(--surface-2); }
.coin-i { display: grid; place-items: center; color: var(--muted-strong); font-size: 16px; }
.r-name { flex: 1; min-width: 0; }
.r-title { display: flex; align-items: center; gap: 5px; }
.r-title b { font: 600 14px/1.3 var(--font-text); color: var(--ink);

.type { font: 500 9px/1 var(--font-text); letter-spacing: .05em; text-transform: uppercase; color: var(--muted-strong);

.r-num { width: 58px; text-align: right; font: 500 15px/1.2 var(--font-num); color: var(--body); flex: none; }

.hero { margin: 0 var(--s-4); height: 158px; border-radius: var(--r-xl); background-position: 50% 62%; }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: var(--s-3) var(--s-4) 0; }

.actionbar { position: absolute; left: 0; right: 0; bottom: 0; background: var(--canvas);
