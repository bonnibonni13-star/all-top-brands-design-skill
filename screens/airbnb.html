<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--grain, .18); mix-blend-mode: overlay;

<title>Musterscreens Airbnb</title>
<style>
/* =====================================================================
   Musterscreens im Stil von Airbnb – heller, fotogetriebener Marktplatz.
   Werte aus der Markendatei; App-Muster (Tab-Leiste, Blatt, Karten-Pille)
   sind Empfehlungen. Eine Akzentfarbe, ein Schatten, alles rund.
   ===================================================================== */
:root {
  /* Farben */
  --rausch: #ff385c;            /* einzige Markenfarbe: Hauptbutton, Such-Kugel, Herz gespeichert, aktiver Tab */
  --rausch-active: #e00b41;     /* gedrückt */
  --rausch-disabled: #ffd1da;
  --ink: #222222;               /* Text, Unterstriche, Kennzahlen – nie reines Schwarz */
  --body: #3f3f3f;
  --muted: #6a6a6a;
  --hairline: #dddddd;
  --hairline-soft: #ebebeb;
  --canvas: #ffffff;
  --surface-soft: #f7f7f7;
  --surface-strong: #f2f2f2;
  --on-photo: rgba(34, 34, 34, .6);      /* dunkle Pille auf Fotos (Zähler) */
  --heart-fill: rgba(0, 0, 0, .5);       /* Herz ungespeichert: halbtransparent mit weißem Rand */

  /* Schrift: Airbnb Cereal → Inter (laut Datei nächster freier Ersatz) */
  --font: Inter, "DejaVu Sans", sans-serif;
  --font-display: "Inter Display", Inter, sans-serif;

  /* Radien */
  --r-xs: 4px;
  --r-sm: 8px;        /* Buttons, Felder */
  --r-md: 14px;       /* Fotos, Karten */
  --r-sheet: 24px;    /* Blatt über dem Detailfoto (Empfehlung) */
  --r-full: 9999px;   /* Suche, Kugel, Herz, Badges */

  /* Abstände (4er-Raster) */
  --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-24: 24px; --s-32: 32px;
  --gutter: 24px;

  /* Die eine Schattenstufe des Systems */
  --shadow: 0 0 0 1px rgba(0,0,0,.02), 0 2px 6px rgba(0,0,0,.04), 0 4px 8px rgba(0,0,0,.1);

  /* Bewegung */
  --dur-s: 200ms;
  --dur-m: 350ms;
  --ease: cubic-bezier(.2, 0, 0, 1);
  --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
}

/* ---------- Grundlagen ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 400 14px/1.43 var(--font); }
/* Resets mit :where(), damit Komponenten-Klassen sie ohne Spezifitätskampf überschreiben */
:where(.phone) :where(h1, h2, h3, p) { margin: 0; }
:where(.phone) :where(button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }
.sb, .hi { color: var(--ink); }
.ic-l { stroke-width: 1.75; }

/* ---------- Such-Pille (einteilig, mobil) ---------- */
.home-head { padding: 6px var(--gutter) 0; }
.search-pill {
  width: 100%; height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-full); box-shadow: var(--shadow);
  font: 600 14px/18px var(--font); color: var(--ink);
  transition: box-shadow var(--dur-s) var(--ease);
}
.search-pill .ic { font-size: 17px; stroke-width: 2.75; }

/* ---------- Bereichs-Tabs mit illustrierten Icons ---------- */
.product-tabs {
  display: flex; justify-content: center; gap: 40px;
  margin: 10px calc(-1 * var(--gutter)) 0; border-bottom: 1px solid var(--hairline-soft);
}
.product-tab {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-bottom: 10px;
  font: 600 13px/16px var(--font); color: var(--muted);
}
.product-tab.is-active { color: var(--ink); }
.product-tab.is-active::after {
  content: ""; position: absolute; left: -4px; right: -4px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink);
}
/* Illustrationen aus den Bildmotiven gebaut (Abzüge, Bildschirm, Platte) */
.glyph { position: relative; display: block; width: 52px; height: 40px; }
.glyph > span { position: absolute; display: block; }
.glyph-shadow { box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 3px 8px rgba(0,0,0,.14); }
.print { width: 29px; height: 25px; border: 2.5px solid #fff; border-radius: 5px; }
.print-back { left: 6px; top: 4px; transform: rotate(-12deg); background-size: 230%; background-position: 80% 30%; }
.print-front { left: 18px; top: 13px; transform: rotate(8deg); background-size: 190%; background-position: 35% 75%; }
.screen { left: 6px; top: 8px; width: 40px; height: 28px; border: 2.5px solid #fff; border-radius: 7px; background-size: 150%; background-position: 62% 62%; }
.screen-play {
  position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
  display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.94);
}
.screen-play .ic { font-size: 7.5px; fill: var(--ink); stroke: var(--ink); stroke-width: 3; margin-left: 1px; }
.sleeve { left: 4px; top: 7px; width: 30px; height: 30px; border-radius: 4px; background-size: 210%; background-position: 50% 60%; }
/* Platte = Ausschnitt der Schallplatte aus .scene-studio (Mitte 262/160, r 116 im 400×300-Motiv) */
.vinyl { left: 19px; top: 7px; width: 30px; height: 30px; border-radius: 50%; background-size: 51.7px 38.8px; background-position: -18.9px -5.7px; }
.new-tag {
  position: absolute; right: -14px; top: -6px; z-index: 2; padding: 2px 6px; border-radius: var(--r-full);
  background: var(--canvas); color: var(--ink); box-shadow: var(--shadow);
  font: 700 8px/10px var(--font); letter-spacing: .32px; text-transform: uppercase;
}

/* ---------- Fotokarte (ohne Fläche, Angaben unter dem Foto) ---------- */
.feed { padding: 18px var(--gutter) 0; }
/* Begrüßung als bescheidene H1 unter der Suche – Fotos tragen die Hierarchie */
.greeting { font: 600 22px/28px var(--font-display); letter-spacing: -.3px; color: var(--ink); }
.listing-hero { margin-top: 12px; }
.listing { display: block; }
.photo {
  position: relative; display: block; border-radius: var(--r-md); overflow: hidden; background-color: var(--surface-strong);
  transition: box-shadow var(--dur-s) var(--ease);
}
.listing:hover .photo { box-shadow: var(--shadow); }
.badge {
  position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: var(--r-full);
  background: var(--canvas); color: var(--ink); box-shadow: var(--shadow); font: 600 11px/13px var(--font);
}
.heart { position: absolute; right: 12px; top: 11px; display: grid; place-items: center; }
.heart .ic { font-size: 24px; fill: var(--heart-fill); stroke: #fff; stroke-width: 2; }
.heart.is-saved .ic { fill: var(--rausch); }
.dots { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .6; }
.dots span:first-child { opacity: 1; }
.dots span:last-child { width: 4px; height: 4px; }
.meta { padding-top: 10px; }
.meta-title { display: block; font: 600 15px/20px var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-line { display: block; font: 400 14px/20px var(--font); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-line b { font-weight: 600; color: var(--ink); }

/* Highlight: große Karte (1-up) */
.listing-hero .photo { height: 136px; background-size: 112%; background-position: 50% 74%; }
.listing-hero .meta-title { font-size: 16px; }

/* ---------- Abschnitte und Kartenreihen ---------- */
.section { margin-top: 22px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.section-title { display: inline-flex; align-items: center; gap: 4px; font: 600 20px/24px var(--font-display); letter-spacing: -.18px; }
.section-title .ic { font-size: 16px; stroke-width: 2.75; margin-top: 2px; }
.section-aside { font: 400 14px/20px var(--font); color: var(--muted); }
.cards-row { gap: 12px; margin-right: calc(-1 * var(--gutter)); }
.listing-sm { flex: none; width: 142px; }
.listing-sm .photo { height: 116px; }
.listing-sm .heart { right: 8px; top: 8px; }
.listing-sm .heart .ic { font-size: 20px; }
.listing-sm .dots { bottom: 8px; }
.listing-sm .meta { padding-top: 8px; }
.listing-sm .meta-title { font-size: 14px; line-height: 18px; }
.listing-sm .meta-line { font-size: 13px; line-height: 18px; }

/* Weiße Pillen mit Haarlinie (Schnellzugriff, Filter) */
.pill-row { gap: 8px; margin-right: calc(-1 * var(--gutter)); }
.pill {
  flex: none; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px;
  border: 1px solid var(--hairline); border-radius: var(--r-full); background: var(--canvas);
  font: 500 13px/18px var(--font); color: var(--ink);
}
.pill .ic { font-size: 16px; stroke-width: 2; }

/* ---------- Tab-Leiste (Empfehlung: aktiv in Rausch) ---------- */
.tab-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; height: 84px; padding: 9px 12px 0;
  display: flex; justify-content: space-around; background: var(--canvas); border-top: 1px solid var(--hairline-soft);
}
.tab { width: 80px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px/14px var(--font); color: var(--muted); }
.tab .ic { font-size: 24px; stroke-width: 1.5; }
/* aktiv: Rausch plus kräftigerer Strich und Label – bleibt auch ohne Farbe erkennbar */
.tab.is-active { color: var(--rausch); font-weight: 600; }
.tab.is-active .ic { stroke-width: 2.25; }

/* ---------- Bibliothek: segmentierte Such-Pille mit Rausch-Kugel ---------- */
.lib-head { padding: 8px var(--gutter) 0; }
.search-bar {
  display: flex; align-items: center; height: 62px; padding: 0 7px 0 20px;
  background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-full); box-shadow: var(--shadow);
}
.seg { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.seg-label { font: 600 12px/16px var(--font); color: var(--ink); }
.seg-value { font: 400 13px/17px var(--font); color: var(--muted); white-space: nowrap; }
.seg-divider { flex: none; width: 1px; height: 32px; margin: 0 10px; background: var(--hairline); }
.search-orb {
  flex: none; width: 46px; height: 46px; margin-left: 6px; display: grid; place-items: center;
  border-radius: 50%; background: var(--rausch); color: #fff;
  transition: background-color var(--dur-s) var(--ease);
}
.search-orb:active { background: var(--rausch-active); }
.search-orb .ic { font-size: 18px; stroke-width: 3; }

/* Kategorie-Leiste: Icon über Label, aktiv mit 2-px-Unterstrich */
.category-strip {
  display: flex; justify-content: space-between; margin: 16px calc(-1 * var(--gutter)) 0; padding: 0 30px;
  border-bottom: 1px solid var(--hairline-soft);
}
.category {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 11px;
  font: 500 13px/16px var(--font); color: var(--muted);
}
.category .ic { font-size: 24px; stroke-width: 1.75; }
.category.is-active { color: var(--ink); font-weight: 600; }
.category.is-active::after {
  content: ""; position: absolute; left: -6px; right: -6px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink);
}

/* Foto-Raster 2-spaltig */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; padding: 14px var(--gutter) 0; }
.grid .photo { aspect-ratio: 1 / 1; }
.grid .meta { padding-top: 8px; }

/* Schwebende Tinten-Pille (Empfehlung) */
.map-pill {
  position: absolute; left: 50%; bottom: 98px; z-index: 15; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px;
  border-radius: var(--r-full); background: var(--ink); color: #fff; box-shadow: var(--shadow);
  font: 600 14px/18px var(--font);
}
.map-pill .ic { font-size: 18px; stroke-width: 2; }

/* ---------- Detail ---------- */
.stage-photo { position: absolute; left: 0; right: 0; top: 0; height: 302px; background-size: 160%; background-position: 50% 95%; }
.photo-actions { position: absolute; left: 0; right: 0; top: 54px; z-index: 5; display: flex; justify-content: space-between; padding: 0 16px; }
.circle-group { display: flex; gap: 10px; }
.circle-btn {
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
  background: var(--canvas); color: var(--ink); box-shadow: var(--shadow);
}
.circle-btn .ic { font-size: 16px; stroke-width: 2.5; }
.circle-btn.is-saved .ic { fill: var(--rausch); stroke: var(--rausch); }
.photo-count {
  position: absolute; right: 16px; bottom: 38px; padding: 4px 10px; border-radius: var(--r-full);
  background: var(--on-photo); color: #fff; font: 600 12px/16px var(--font);
}
.sheet {
  position: absolute; left: 0; right: 0; top: 276px; bottom: 0; padding: 26px var(--gutter) 0;

.title-block { text-align: center; }
.title-block h1 { font: 600 26px/32px var(--font-display); letter-spacing: -.4px; }
.title-block p { margin-top: 4px; font: 400 15px/20px var(--font); color: var(--body); }

/* Kennzahl-Karte mit Lorbeer (mobile Form der 64-px-Kennzahl) */
.fav-card {
  display: flex; align-items: center; height: 70px; margin-top: 22px;
  border: 1px solid var(--hairline); border-radius: var(--r-md);
}
.fav-badge { flex: 1.35; display: flex; align-items: center; justify-content: center; gap: 3px; font: 600 14px/17px var(--font); text-align: center; }
.svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.laurel { width: 15px; height: 36px; color: var(--ink); flex: none; }
.laurel-r { transform: scaleX(-1); }
.fav-divider { flex: none; width: 1px; height: 36px; background: var(--hairline); }
.fav-stat { flex: 1; display: flex; flex-direction: column; align-items: center; }
.fav-stat b { font: 600 18px/22px var(--font); }
.fav-stat span { font: 500 12px/16px var(--font); color: var(--ink); }

/* Unterstrich-Tabs */
.tabs { display: flex; gap: 28px; margin-top: 22px; border-bottom: 1px solid var(--hairline-soft); }
.tabs a { position: relative; padding-bottom: 12px; font: 500 15px/20px var(--font); color: var(--muted); }
.tabs a.is-active { color: var(--ink); font-weight: 600; }
.tabs a.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }

/* Collage: 1 groß + 4 klein, nur außen rund */
.collage {
  position: relative; display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px;
  height: 198px; margin-top: 16px; border-radius: var(--r-md); overflow: hidden;
}
.tile { display: block; }
/* Weitere „Fotos“ als Ausschnitte desselben Motivs: Sonne, Straßenbahn, Dächer, Fenster, Gassen */
.tile-big { grid-row: span 2; background-size: 220%; background-position: 5% 30%; }
.crop-a { background-size: 400%; background-position: 45% 100%; }
.crop-b { background-size: 300%; background-position: 100% 40%; }
.crop-c { background-size: 350%; background-position: 60% 75%; }
.crop-d { background-size: 320%; background-position: 20% 70%; }
.all-photos {
  position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border: 1px solid var(--ink); border-radius: var(--r-sm); background: var(--canvas); font: 600 12px/16px var(--font);
}
.all-photos .ic { font-size: 14px; stroke-width: 2.5; }

/* Feste Aktionsleiste (mobile Reservierungsleiste) */
.action-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; height: 92px; padding: 14px var(--gutter) 0;
  display: flex; align-items: flex-start; justify-content: space-between;
  background: var(--canvas); border-top: 1px solid var(--hairline-soft);
}
.action-info { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
.action-info small { font: 400 13px/17px var(--font); color: var(--muted); }
.action-info a { font: 600 16px/20px var(--font); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.btn-primary {
  height: 48px; padding: 0 24px; border-radius: var(--r-sm); background: var(--rausch); color: #fff;
  font: 500 16px/20px var(--font);
  transition: background-color var(--dur-s) var(--ease);   /* gedrückt: nur Farbwechsel, kein Transform */
}
.btn-primary:active { background: var(--rausch-active); }

/* Fokus: 2 px Tinte, kein Glow */
.phone :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- Bewegung: Einblenden und Herz-Pop ---------- */
@media (prefers-reduced-motion: no-preference) {
  .feed > *, .grid > *, .sheet > * { animation: rise var(--dur-m) var(--ease) both; }
  .feed > :nth-child(2), .grid > :nth-child(2), .sheet > :nth-child(2) { animation-delay: 40ms; }
  .feed > :nth-child(3), .grid > :nth-child(3), .sheet > :nth-child(3) { animation-delay: 80ms; }
  .feed > :nth-child(4), .grid > :nth-child(4), .sheet > :nth-child(4) { animation-delay: 120ms; }
  .grid > :nth-child(n+5) { animation-delay: 160ms; }

}
