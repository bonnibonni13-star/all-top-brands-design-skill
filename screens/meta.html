<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */
.grain { position: relative; }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--grain, .18); mix-blend-mode: overlay;

<style>
/* =====================================================================
   Musterscreens im Stil von Meta – weiße Bühne, randlose Fotokarten mit
   32 px Radius, alles Bedienbare als Pille (Radius 100). Navigation als
   Pillen-Reiter oben statt Tab-Leiste unten. Kobalt nur für die eine
   abschließende Aktion. App-Muster sind im Profil gekennzeichnet.
   ===================================================================== */
:root {
  /* Flächen */
  --canvas: #ffffff;
  --surface-soft: #f1f4f7;
  --ink-deep: #0a1317;
  --ink: #1c1e21;
  --charcoal: #444950;
  --steel: #5d6c7b;
  --stone: #8595a4;
  --hairline: #ced0d4;
  --hairline-soft: #dee3e9;

  /* Akzente */
  --cobalt: #0064e0;
  --cobalt-deep: #0457cb;
  --black: #000000;
  --warning: #f7b928;
  --success: #31a24c;

  /* Schrift: Optimistic VF → Poppins (300/400/500/700) */
  --font: Poppins, Inter, "DejaVu Sans", sans-serif;

  /* Radien */
  --r-sm: 4px;
  --r-field: 8px;
  --r-card: 16px;
  --r-quiet: 24px;
  --r-photo: 32px;
  --r-feature: 40px;
  --r-pill: 100px;

  /* Abstände */
  --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-20: 20px; --s-24: 24px; --s-32: 32px;
  --gutter: 16px;

  /* Die zwei Schattenstufen des Systems */
  --sh-tab: rgba(0,0,0,.2) 1px 1px 0 0;
  --sh-bar: rgba(20,22,26,.3) 0 1px 4px 0;

  /* Bewegung (Empfehlung) */
  --dur-s: 180ms;
  --dur-m: 250ms;
  --ease: cubic-bezier(.2, 0, 0, 1);
}

/* ---------- Grundlagen ---------- */
.phone { background: var(--canvas); color: var(--ink-deep); font: 400 14px/1.43 var(--font); letter-spacing: -.14px; }
:where(.phone) :where(a) { color: inherit; text-decoration: none; }
:where(.phone) :where(button) { cursor: pointer; }
.sb, .hi { color: var(--ink-deep); }

/* ---------- Dunkles Hinweisband über der Leiste ---------- */
.promo {
  background: var(--ink-deep); color: var(--canvas);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px var(--gutter); font: 700 11.5px/1.3 var(--font);
}
.promo u { text-decoration: underline; text-underline-offset: 2px; }

/* ---------- Weiße Leiste ---------- */
.topbar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 var(--gutter); }
.mark { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ink-deep); flex: none; }
.mark::after { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-deep); margin: 7px auto 0; }
.topbar .spacer { flex: 1; }
.circle-btn {
  width: 40px; height: 40px; border-radius: 50%; background: var(--canvas); border: 1px solid var(--hairline-soft);
  display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--ink-deep); flex: none;
  transition: background var(--dur-s) var(--ease);
}
.circle-btn:active { background: var(--surface-soft); }
.avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; background-color: var(--surface-soft); }

/* ---------- Pillen-Reiter = Hauptnavigation ---------- */
.pills { gap: 8px; padding: 4px var(--gutter) 12px; }
.pill {
  flex: none; height: 36px; padding: 0 16px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; background: var(--canvas); border: 1px solid var(--hairline);
  font: 700 13.5px/1 var(--font); letter-spacing: -.14px; color: var(--ink);
  transition: background var(--dur-s) var(--ease), color var(--dur-s) var(--ease);
}
.pill.is-active { background: var(--ink-deep); border-color: var(--ink-deep); color: var(--canvas); box-shadow: var(--sh-tab); }

/* ---------- Große Fotokarte ---------- */
.photo-card {
  position: relative; margin: 0 var(--gutter); height: 214px; border-radius: var(--r-photo); overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.photo-card::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,19,23,.30) 0%, rgba(10,19,23,0) 34%, rgba(10,19,23,.74) 100%);
}
.photo-card > * { position: relative; }
.badge {
  align-self: flex-start; margin: 0 0 10px 20px; padding: 4px 11px; border-radius: var(--r-pill);
  background: var(--warning); color: var(--ink-deep); font: 700 11.5px/1.33 var(--font);
}
.photo-card h2 { margin: 0 20px; font: 500 27px/1.16 var(--font); letter-spacing: -.2px; color: var(--canvas); }
.photo-card p { margin: 6px 20px 0; font: 400 13.5px/1.44 var(--font); color: rgba(255,255,255,.85); }
.cta-row { display: flex; gap: 10px; margin: 16px 20px 20px; }
.btn-on-photo {
  height: 40px; padding: 0 22px; border-radius: var(--r-pill); background: var(--canvas); color: var(--ink-deep);
  font: 700 13.5px/1 var(--font); letter-spacing: -.14px; display: inline-flex; align-items: center; gap: 7px;
}
.btn-ghost-photo {
  height: 40px; padding: 0 20px; border-radius: var(--r-pill); background: transparent; color: var(--canvas);
  border: 2px solid rgba(255,255,255,.9); font: 700 13.5px/1 var(--font); letter-spacing: -.14px;
  display: inline-flex; align-items: center;
}
.card-actions { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 2; }
.card-actions .circle-btn { border-color: transparent; background: rgba(255,255,255,.92); }

/* ---------- Abschnittskopf ---------- */
.sec { display: flex; align-items: baseline; justify-content: space-between; margin: 16px var(--gutter) 10px; }
.sec h3 { font: 500 21px/1.25 var(--font); letter-spacing: -.2px; }
.sec a { font: 700 13.5px/1 var(--font); color: var(--ink-deep); display: inline-flex; align-items: center; gap: 2px; }

/* ---------- Waagerechte Kachelreihe ---------- */
.tiles { gap: 12px; padding-left: var(--gutter); }
.tile { width: 148px; flex: none; }
.tile .thumb {
  position: relative; display: block; width: 100%; height: 126px; border-radius: var(--r-card);
  background-color: var(--surface-soft);
}
.tile b { display: block; margin-top: 10px; font: 700 13.5px/1.43 var(--font); letter-spacing: -.14px; }
.tile span { display: block; margin-top: 1px; font: 400 13px/1.43 var(--font); color: var(--steel); }
.tile-tag {
  position: absolute; top: 9px; left: 9px; padding: 3px 9px; border-radius: var(--r-pill);
  background: var(--warning); color: var(--ink-deep); font: 700 10.5px/1.33 var(--font);
}

/* ---------- Ruhige Karte (#f1f4f7) ---------- */
.quiet { margin: 16px var(--gutter) 0; background: var(--surface-soft); border-radius: var(--r-quiet); padding: 18px 18px 6px; }
.quiet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.quiet-head h3 { font: 500 19px/1.25 var(--font); letter-spacing: -.2px; }
.btn-primary {
  height: 34px; padding: 0 18px; border-radius: var(--r-pill); background: var(--black); color: var(--canvas);
  font: 700 13px/1 var(--font); letter-spacing: -.14px; display: inline-flex; align-items: center; flex: none;
  transition: background var(--dur-s) var(--ease);
}
.btn-primary:active { background: var(--charcoal); }
.src { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--hairline-soft); }
.src:first-of-type { border-top: 0; }
.src .ic { font-size: 21px; color: var(--ink-deep); flex: none; }
.src b { font: 700 14px/1.43 var(--font); letter-spacing: -.14px; }
.src small { margin-left: auto; font: 400 13px/1.43 var(--font); color: var(--steel); }
.src small.ok { color: var(--success); font-weight: 700; }

/* ---------- Suche ---------- */
.search {
  display: flex; align-items: center; gap: 10px; height: 44px; margin: 4px var(--gutter) 0;
  background: var(--surface-soft); border-radius: var(--r-pill); padding: 0 18px;
  font: 400 14px/1 var(--font); color: var(--steel);
}
.search .ic { font-size: 18px; }

/* ---------- Kachelraster (Bibliothek) ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; margin: 16px var(--gutter) 0; }
.grid .tile { width: auto; }
.grid .thumb { height: 112px; }

/* ---------- Detail: Brotkrumen ---------- */
.crumbs { display: flex; align-items: center; gap: 6px; padding: 2px var(--gutter) 0; font: 400 13px/1.43 var(--font); color: var(--steel); }
.crumbs .ic { font-size: 13px; color: var(--stone); }
.crumbs b { font-weight: 700; color: var(--ink-deep); }

/* ---------- Detail: Galerie mit Miniaturstreifen ---------- */
.gallery { display: flex; gap: 12px; margin: 12px var(--gutter) 0; }
.thumbs { display: flex; flex-direction: column; gap: 8px; flex: none; }
.thumbs span {
  display: block; width: 52px; height: 52px; border-radius: var(--r-field);
  background-color: var(--surface-soft); border: 1px solid var(--hairline-soft);
}
.thumbs span.is-active { border: 2px solid var(--ink-deep); }
.stage-photo { flex: 1; height: 220px; border-radius: var(--r-photo); background-color: var(--surface-soft); position: relative; }
.count {
  position: absolute; right: 12px; bottom: 12px; padding: 4px 11px; border-radius: var(--r-pill);
  background: rgba(10,19,23,.72); color: var(--canvas); font: 700 11.5px/1.33 var(--font);
}

.detail-head { margin: 18px var(--gutter) 0; }
.detail-head h1 { font: 500 30px/1.17 var(--font); letter-spacing: -.3px; }
.detail-head p { margin-top: 2px; font: 300 18px/1.44 var(--font); color: var(--charcoal); }

/* Kennzahl-Kacheln */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px var(--gutter) 0; }
.stat { border: 1px solid var(--hairline-soft); border-radius: var(--r-card); padding: 12px 12px 11px; }
.stat .ic { font-size: 20px; color: var(--steel); }
.stat b { display: block; margin-top: 7px; font: 700 16px/1.2 var(--font); letter-spacing: -.16px; }
.stat span { display: block; margin-top: 1px; font: 400 12px/1.33 var(--font); color: var(--steel); }

.seg { gap: 8px; padding: 18px var(--gutter) 0; }

.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px var(--gutter) 0; }
.photo-grid span { display: block; height: 92px; border-radius: var(--r-card); }

/* ---------- Feste untere Leiste (Abschluss) ---------- */
.bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 88px; z-index: 20;
  background: var(--canvas); border-top: 1px solid var(--hairline-soft); box-shadow: var(--sh-bar);
  display: flex; align-items: center; gap: 12px; padding: 0 var(--gutter) 22px;
}
.bar-info { min-width: 0; }
.bar-info small { display: block; font: 400 12px/1.33 var(--font); color: var(--steel); }
.bar-info b { display: block; font: 700 15px/1.4 var(--font); letter-spacing: -.16px; }
.btn-buy {
  margin-left: auto; height: 44px; padding: 0 24px; border-radius: var(--r-pill);
  background: var(--cobalt); color: var(--canvas); font: 700 14px/1 var(--font); letter-spacing: -.14px;
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  transition: background var(--dur-s) var(--ease);
}
.btn-buy:active { background: var(--cobalt-deep); }

/* ---------- Bewegung ---------- */
@media (prefers-reduced-motion: no-preference) {
  .photo-card, .tiles, .quiet, .grid, .gallery, .stats, .photo-grid { animation: lift var(--dur-m) var(--ease) both; }
  .tiles { animation-delay: 60ms; }
  .quiet { animation-delay: 110ms; }
  @keyframes lift { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
}
</style></head>
