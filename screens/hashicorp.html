<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style id="ms-base">
/* Musterscreens – Basis. Wird vom Renderer vor die eigenen Stile gesetzt; eigene Regeln überschreiben sie.
   Platzhalter der Form „{{scene:<name>}}“ ersetzt der Renderer durch das SVG aus scenes/<name>.svg. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e7e7eb; font-family: Inter, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ms-wrap { display: inline-block; background: #e7e7eb; }
.stage { display: flex; gap: 40px; align-items: flex-start; padding: 48px 48px 20px; width: max-content; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.shot > figcaption { font: 600 13px/1 Inter, "DejaVu Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b74; padding-left: 8px; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; isolation: isolate;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14); }
.ms-foot { font: 500 13px/1.4 Inter, "DejaVu Sans", sans-serif; color: #6b6b74; padding: 0 56px 30px; }
.ms-foot b { color: #3a3a40; font-weight: 600; }

/* Rücksetzungen ohne Spezifität: eigene Klassen gewinnen immer. Eigene Resets bitte ebenfalls mit :where(). */
:where(.phone) :where(h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
:where(.phone) :where(ul, ol) { list-style: none; }
:where(.phone) :where(button, input, select, textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }

/* Icons: <i data-icon="lucide:house"></i> oder <i data-icon="ph-bold:house"></i> → Inline-SVG mit Klasse .ic */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.ic-missing { outline: 2px dashed red; }

/* Statusleiste und Gestenleiste */
.sb { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 32px;
  font: 600 15px/1 Inter, "DejaVu Sans", sans-serif; position: relative; z-index: 30; }
.sb-icons { display: flex; gap: 6px; font-size: 16px; align-items: center; }
.hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; transform: translateX(-50%);
  background: currentColor; opacity: .45; z-index: 40; }

/* Bilder (abstrakte Motive, gleich für alle Marken). Ausschnitt per background-position/-size, Behandlung frei. */
[class*="scene-"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Körnung als Überlagerung: Element bekommt .grain, Stärke per --grain (0–1). */

<style>
/* ==========================================================================
   HashiCorp – Designsprache als App-Vorlage
   Werte aus references/hashicorp.md (Farben, Typo, Radien, Abstände).
   App-Muster, Icons und Bewegung sind Ableitungen/Empfehlungen.
   Grundsätze: schwarze Leinwand · Flächenstufen statt Schatten · 1-px-Haarlinien
   · Versal-Augenbraue über jedem Band · eine Identitätsfarbe je Thema
   · 8-px-Ecken an Buttons/Feldern, 12 px an Karten · kein Monospace.
   ========================================================================== */
:root {
  /* Flächen */
  --canvas: #000000;
  --surface-1: #15181e;
  --surface-2: #1f232b;
  --surface-3: #3b3d45;
  --hairline: #3b3d45;
  --hairline-soft: #252830;
  --hairline-card: rgba(178, 182, 189, .1);
  /* Text */
  --ink: #ffffff;
  --ink-muted: #b2b6bd;
  --ink-subtle: #656a76;
  --inverse-canvas: #ffffff;
  --inverse-ink: #000000;
  --accent-blue: #2b89ff;
  /* Identitätsfarben je Thema (im Original: je Produkt) */
  --id-fotos: #7b42bc;
  --id-fotos-bright: #911ced;
  --id-videos: #14c6cb;
  --id-musik: #ffcf25;
  --id-alben: #00ca8e;
  /* Typografie: eine Familie, Hierarchie über Gewicht + Zeilenhöhe */
  --font: "Inter", "DejaVu Sans", sans-serif;
  --font-display: "Inter Display", "Inter", sans-serif;
  /* Radien */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-xxl: 24px;
  --r-pill: 9999px;
  /* Abstände (8-px-Basis) */
  --s-xxs: 4px;
  --s-xs: 8px;
  --s-sm: 12px;
  --s-md: 16px;
  --s-lg: 24px;
  --s-xl: 32px;
  /* Bewegung (Empfehlung) */
  --dur-s: 120ms;
  --dur-m: 220ms;
  --ease: cubic-bezier(.2, 0, 0, 1);
}

/* ---------- Grundlage ---------- */
.phone { background: var(--canvas); color: var(--ink); font: 500 16px/1.5 var(--font); }
.phone .sb, .phone .hi { color: var(--ink); }
:where(.phone) :where(h1, h2, h3, p, ul, li) { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Typo-Rollen ---------- */
.eyebrow { font: 600 12px/1.23 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--ink-subtle); }
.display { font: 600 28px/1.21 var(--font-display); letter-spacing: -.6px; }
.card-title { font: 600 22px/1.18 var(--font-display); letter-spacing: -.4px; }
.title-sm { font: 600 15px/1.25 var(--font); letter-spacing: -.2px; }
.body { font: 500 14px/1.71 var(--font); color: var(--ink-muted); }
.caption { font: 500 13px/1.38 var(--font); letter-spacing: .2px; color: var(--ink-subtle); }

/* ---------- Kopfleiste (top-nav, 64 px) ---------- */
.top-nav { position: relative; z-index: 5; height: 56px; display: flex; align-items: center;
  justify-content: space-between; gap: var(--s-sm); padding: 0 var(--s-md); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink); }
.brand-mark svg { width: 22px; height: 24px; }
.brand-name { font: 600 16px/1 var(--font); letter-spacing: -.2px; }
.nav-actions { display: flex; align-items: center; gap: var(--s-xs); }

/* ---------- Buttons: 8-px-Rechtecke, nie Pillen ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none;
  height: 40px; padding: 0 18px; border-radius: var(--r-md);
  font: 600 14px/1.29 var(--font); white-space: nowrap;
  transition: background-color var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); }
.btn .ic { font-size: 17px; }
.btn--primary { background: var(--inverse-canvas); color: var(--inverse-ink); }
.btn--secondary { background: var(--surface-2); color: var(--ink); }
.btn--sm { height: 34px; padding: 0 14px; }
.btn:active { transform: scale(.985); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-md);
  background: var(--surface-2); color: var(--ink); font-size: 18px; flex: none;
  transition: background-color var(--dur-s) var(--ease); }
.icon-btn--bare { background: none; color: var(--ink-muted); }

/* ---------- Scrollbereich ---------- */
.content { position: absolute; inset: 102px 0 0 0; overflow: hidden; padding: 0 var(--s-md); }
.band { margin-bottom: 16px; }
.band-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-sm);
  margin-bottom: 10px; }

/* ---------- Rückblick-Band (Marketing-Hero als App-Einstieg) ---------- */
.hero-title { margin-top: 2px; }
.hero-meta { margin-top: 2px; }
.hero-actions { display: flex; gap: var(--s-xs); margin: 12px 0 12px; }
.media { border-radius: var(--r-lg); border: 1px solid var(--hairline-card); height: 136px; }

/* ---------- Identitätskarten: je Medienart eine Farbe (Ebene 3) ---------- */
.id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.id-card { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 13px 14px 12px;
  min-height: 76px; display: flex; flex-direction: column; justify-content: space-between;
  transition: transform var(--dur-s) var(--ease); }
.id-card:active { transform: scale(.985); }
.id-card .cube { position: absolute; right: 10px; top: 10px; width: 30px; height: 34px; }

.id--fotos { background: var(--id-fotos); color: #fff; }
.id--videos { background: var(--id-videos); color: var(--inverse-ink); }
.id--musik { background: var(--id-musik); color: var(--inverse-ink); }
.id--alben { background: var(--id-alben); color: var(--inverse-ink); }

/* ---------- Vergleichstabelle (Quellen / Speicher) ---------- */
.table { background: var(--surface-1); border: 1px solid var(--hairline-card); border-radius: var(--r-lg);
  padding: 0 14px; }
.thead { display: grid; grid-template-columns: 1fr auto 72px; gap: var(--s-sm); align-items: center;
  padding: 11px 0 9px; border-bottom: 1px solid var(--hairline-soft);
  font: 600 11px/1.2 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--ink-subtle); }
.thead span:last-child, .trow .t-size { text-align: right; }
.trow { display: grid; grid-template-columns: 1fr auto 72px; gap: var(--s-sm); align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--hairline-soft); }
.trow:last-child { border-bottom: 0; }
.t-name { display: flex; align-items: center; gap: 10px; font: 500 14px/1.3 var(--font); }
.t-name .ic { font-size: 17px; color: var(--ink-muted); }
.t-state { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1.3 var(--font); color: var(--ink-muted); }
.dot { width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--ink-subtle); flex: none; }
.dot--ok { background: #00ca8e; }
.dot--sync { background: #ffcf25; }
.dot--off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-subtle); }
.t-size { font: 500 13px/1.3 var(--font); color: var(--ink-muted); }

/* Speicherbalken */
.meter-row { display: flex; align-items: baseline; justify-content: space-between; margin: 12px 0 8px; }
.meter { height: 6px; border-radius: var(--r-xs); background: var(--surface-2); overflow: hidden; margin-bottom: 12px; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: var(--r-xs); }

/* ---------- Suche + Chips ---------- */
.search { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 14px;
  background: var(--surface-1); border: 1px solid var(--hairline-card); border-radius: var(--r-md);
  color: var(--ink-subtle); font: 500 15px/1 var(--font); }
.search .ic { font-size: 18px; }
.chips { display: flex; gap: var(--s-xs); margin: 12px 0 14px; }
.chip { padding: 5px 11px; border-radius: var(--r-pill); background: var(--surface-1);

.lib-text .title-sm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tag--alben { background: rgba(0, 202, 142, .16); color: #4fdcb4; }
.lib-when { display: block; margin-top: 3px; font: 500 12px/1.3 var(--font); color: var(--ink-subtle); }

/* ---------- Detail ---------- */
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0;
  font: 500 14px/1 var(--font); color: var(--ink-subtle); }
.crumbs .ic { font-size: 13px; }

.seg { display: flex; gap: 2px; padding: 3px; background: var(--surface-1);
  border: 1px solid var(--hairline-card); border-radius: var(--r-md); margin-bottom: 12px; }
.seg button { flex: 1; height: 30px; border-radius: var(--r-sm); color: var(--ink-muted);
  font: 500 13px/1 var(--font); transition: background-color var(--dur-s) var(--ease); }
.seg button.is-on { background: var(--id-fotos); color: #fff; font-weight: 600; }
.photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.photo { aspect-ratio: 1; border-radius: var(--r-md); border: 1px solid var(--hairline-card); }
.music-card { display: flex; align-items: center; gap: var(--s-sm); margin: 12px 0; padding: 12px;
  background: var(--surface-1); border: 1px solid var(--hairline-card); border-radius: var(--r-lg); }
.music-card .thumb { width: 44px; height: 44px; }
.music-card .grow { flex: 1; min-width: 0; }

/* ---------- Navigation unten: eckige Felder, kein Pillen-Dock ---------- */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; z-index: 20;
  display: flex; align-items: flex-start; gap: 6px; padding: 8px 12px 0;
  background: var(--canvas); border-top: 1px solid var(--hairline-soft); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
